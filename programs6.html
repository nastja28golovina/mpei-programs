вания медийной среды.", "learn": "Разработка дизайн‑решений в сферах графического, интерьерного, промышленного, медиа‑ и арт‑дизайна | Владение инструментами дизайна: программы 3D‑моделирования, графические редакторы, инструменты анимации и видеомонтажа | Создание визуальных коммуникаций: от полиграфии и типографики до систем навигации и корпоративной айдентики | Работа с медиаконтентом: видеодизайн, цифровая анимация, оформление интернет‑ресурсов и ТВ‑материалов | Макетирование, конструирование и структурная организация пространств и комплексов объектов с учётом эргономики и эстетики | Проектирование предметно‑пространственной и информационно‑коммуникационной среды (интерьеры, навигация, медиаресурсы, корпоративные стили) с учётом утилитарных и эстетических требований.", "career": "Выпускники работают в сфере образования и науки (вузы, школы, НИИ), в учреждениях культуры и искусства (галереи, музеи, творческие студии), в IT‑компаниях и телекоммуникационных организациях. Их нанимают архитектурные бюро, геодезические фирмы, СМИ, издательства и полиграфические предприятия. Специалисты востребованы в лёгкой и текстильной промышленности (дизайн текстиля и одежды), в автомобилестроении (промышленный дизайн), а также в компаниях разных отраслей на дизайнерских позициях.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10154", "passing": ""}, {"id": "10156", "name": "Технологии разработки интеллектуальных систем", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 1, "cost": 152000, "exam": "Физика (по выбору), Математика, Информатика (по выбору), Русский язык", "about": "Программа направлена на подготовку высококвалифицированных специалистов в области информатики, прикладной математики, искусственного интеллекта и математического моделирования. Обучение ориентировано на разработку интеллектуальных систем для автоматизации бизнес-процессов, управления производством и анализа данных. Студенты осваивают современные информационные технологии, методы машинного обучения и программирование на Python, C++ и Java, а также получают опыт работы с TensorFlow, PyTorch и Keras. Программа учитывает актуальные требования рынка труда в сфере информатики и вычислительной техники.", "learn": "Комплексный анализ | Web-технологии | Информатика и информационные технологии | Технологии и методы программирования | Проектирование информационных систем | Структуры данных и методы программирования | Объектно-ориентированное программирование | Разработка интеллектуальных систем | Вычислительные методы | Компьютерные инструменты в бизнес-аналитике (BIG DATA)", "career": "Выпускники программы могут работать в сфере информационно-коммуникационных технологий, занимаясь разработкой и тестированием программного обеспечения, созданием и администрированием информационных систем, баз данных и интернет-ресурсов. Они востребованы в области искусственного интеллекта, анализа данных, математического моделирования и автоматизации бизнес-процессов. Также возможна работа в программной инженерии, системном программировании, защите информации, высокопроизводительных вычислениях, разработке интеллектуальных систем и научно-исследовательской деятельности в сфере информационных технологий.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10156", "passing": ""}, {"id": "10157", "name": "Технологии разработки программного обеспечения", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 2, "cost": 155000, "exam": "Математика, Информатика (по выбору), Русский язык, Физика (по выбору)", "about": "Программа направлена на подготовку специалистов в области информатики и вычислительной техники, способных решать профессиональные задачи производственно-технологического типа. Выпускники получают знания и практические навыки в разработке, внедрении и эксплуатации программного обеспечения, вычислительных систем и информационных технологий, востребованных в современной цифровой и промышленной среде.", "learn": "Администрирование информационных сетей и систем | Методы оптимизации | Технология программирования | Архитектура предприятия | Web-технологии; компьютерные сети | Системное программное обеспечение | Объектно-ориентированное программирование", "career": "Выпускники могут работать в сфере информационно-коммуникационных технологий, занимаясь разработкой программного обеспечения, средств вычислительной техники, компьютерных сетей, систем управления и обработки данных, а также цифровых электронных устройств. Они востребованы в компаниях, связанных с информационными технологиями, телекоммуникациями, разработкой аппаратного и программного обеспечения, центрах высокопроизводительных и суперкомпьютерных вычислений, а также на предприятиях, использующих современные цифровые технологии и автоматизированные системы управления.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10157", "passing": ""}, {"id": "10158", "name": "Информационные технологии в теплоэнергетике (с получением 2-й квалификации 13.03.01)", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 0, "cost": 0, "exam": "Математика, Русский язык, Информатика (по выбору), Физика (по выбору)", "about": "Программа \"Информационные технологии в теплонергетике (с получением второй квалификации 13.03.01 Теплоэнергетика и теплотехника)\" направлена на подготовку востребованных специалистов, способных решать комплексные задачи на стыке энергетики и IT. Обучение включает изучение методов разработки программного обеспечения, проектирования баз данных и корпоративных информационных систем, что позволяет выпускникам создавать и внедрять цифровые решения для повышения эффективности энергетических компаний. Особое внимание уделяется киберфизическим системам, которые объединяют физические процессы с цифровыми технологиями, а также вопросам защиты информации и реинжиниринга бизнес-процессов в энергетике.", "learn": "Исследование и внедрение киберфизических систем в области теплоэнергетики | Проектирование систем теплоснабжения и инженерных сетей | Реализация проектов по реинжинирингу и модернизации теплоэнергетических компаний | Проведение математического моделирования и симуляции процессов тепломассообмена | Разработка и внедрение информационных систем для управления теплоэнергетическими установками | Разработка корпоративных информационных систем для анализа данных и мониторинга | Анализ и оптимизация теплоэнергетических процессов", "career": "Выпускники программы становятся востребованными специалистами, способными решать комплексные задачи на стыке энергетики и IT. Они могут работать в проектировании, управлении и оптимизации теплоэнергетических систем, разрабатывать программные продукты для энергетической отрасли и внедрять инновационные технологии в процессы производства и распределения энергии.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10158", "passing": ""}, {"id": "10164", "name": "Интеллектуальные производственные технологии", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Программа готовит специалистов в области технологий производства и ремонта оборудования энергетического машиностроения. Студенты изучают методы контроля структурно‑механического состояния изделий, осваивают передовые технологии обработки тугоплавких, коррозионностойких, жаропрочных и жаростойких материалов. Обучение базируется на достижениях физики, математики, химии и материаловедения — это позволяет создавать надёжные детали и конструкции для эксплуатации в сложных условиях (высокие нагрузки и температуры, агрессивная среда, интенсивный износ). Выпускники востребованы в промышленности, науке и технике.", "learn": "Численные методы в инженерных расчетах | Обработка металлов давлением | Литейное производство | Тепловые процессы при сварке | Теоретические основы сварки, оборудование и технология сварки плавлением | Технологические процессы в энергомашиностроении | Физические основы неразрушающих способов контроля | Восстановление деталей машин и элементов энергетического оборудования | Разработка и внедрение интеллектуальных систем управления производственными процессами | Оптимизация производственных потоков с использованием методов машинного обучения | Технология конструкционных материалов", "career": "Выпускники работают на предприятиях энергетического машиностроения, тепловых, гидро‑ и атомных электростанциях — проектируют оснастку, разрабатывают и внедряют технологические процессы, монтируют, налаживают, эксплуатируют и модернизируют оборудование (котлы, турбины, силовые установки и т. д.). Востребованы в авиационной и космической отрасли (работа с двигателями и элементами аппаратов), в научно‑исследовательских институтах, а также в организациях по стандартизации и сертификации.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10164", "passing": "215"}, {"id": "10172", "name": "Гражданское право", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 150000, "exam": "Обществознание, Математика (по выбору), Иностранный язык (по выбору), Информатика (по выбору), Русский язык, История (по выбору)", "about": "Программа направлена на подготовку квалифицированных юристов, обладающих глубоки-ми знаниями в области частноправового регулирования имущественных и неимущественных отношений. В процессе обучения студенты изучают основы теории государства и права, а также отраслевые юридические дисциплины, внимание уделяется применению норм гражданского законодательства в наследственной, обязательственной и процессуальной сферах. Обучение сочетает теоретическую подготовку с практической деятельностью.", "learn": "Толкование и применение нормативно-правовых актов | Принятие правовых решений на высоком профессиональном уровне в соответствии с законом | Правовое сопровождение гражданско-правовых отношений | Юридическое консультирование | Профессиональное квалификация правовой информации", "career": "Выпускники работают в судах и органах судебной системы, нотариальных конторах, юридических консультациях и фирмах, органах государственной и муниципальной власти. Они востребованы в компаниях разных форм собственности — обеспечивают правовое сопровождение гражданско‑правовых отношений, защищают права граждан и юридических лиц, сопровождают сделки и договоры, занимаются вопросами собственности, наследования, семейных и корпоративных правоотношений.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10172", "passing": ""}, {"id": "10177", "name": "Реклама и продвижение СМИ", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 155000, "exam": "Русский язык, Обществознание, Иностранный язык (по выбору), Информатика (по выбору), История (по выбору)", "about": "Программа направлена на подготовку мультимедийных специалистов, обладающих компетенциями в области стратегического маркетинга, медиапланирования и креативного производства контента. Образовательный процесс сочетает изучение теоретических основ массовых коммуникаций с интенсивной практикой по созданию рекламных кампаний для различных типов медиаплатформ. Студенты учатся анализировать аудиторию, управлять репутацией брендов и внедрять цифровые инструменты продвижения в редакционную деятельность.", "learn": "Технология рекламы и связей с общественностью | Digital-маркетинг | Разработка PR-стратегии компании, медиа- и контент-планов | Коммуникации в связях с общественностью, основы медиапланирования | Организация и проведение рекламных и PR-кампаний | Организация работы отделов рекламы и связей с общественностью | Создание востребованных обществом и индустрией медиапродуктов и медиатекстов | Рекламные продукты (видеоролики, баннеры, макеты), медиатексты различных форматов и жанров.", "career": "Выпускники программы смогут работать в сфере рекламы и связи с общественностью, информационных и коммуникационных технологий, в сфере продвижения продукции средств массовой информации, включая печатные издания, телевизионные и радиопрограммы, онлайн-ресурсы, а также средства массовой информации, издательства и полиграфии в сфере мультимедийных, печатных, теле- и радиовещательных средств массовой информации, сфера рекламы и связей с общественностью.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10177", "passing": ""}, {"id": "10178", "name": "Архитектура информационных систем предприятия", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 2, "cost": 155000, "exam": "Математика, Информатика (по выбору), Обществознание (по выбору), Русский язык", "about": "Программа осуществляет подготовку специалистов для бизнеса, способных осуществлять профессиональную деятельность в области информатики и архитектуры информационных систем, решать задачи профессиональной деятельности проектного, аналитического и организационно-управленческого типа.", "learn": "Разработка архитектуры информационных систем предприятия | Моделирование, анализ и совершенствование бизнес-процессов и информационно-технологической инфраструктуры предприятия в интересах достижения его стратегических целей | Использование информации, методов и программных средств ее сбора, обработки и анализа для информационно-аналитической поддержки принятия управленческих решений | Разработка математических моделей и алгоритмов для анализа, обработки и верификации данных | Участие в составлении информационной основы для построения системы показателей, характеризующих деятельность организаций финансового сектора | Разработка и совершенствование методики формирования статистических показателей | Выполнение задач в рамках научной и учебно-профессиональной деятельности для поиска, выработки и применения новых решений в области информационно-коммуникационных технологий | Организация взаимодействия с клиентами и партнерами в процессе решения задач управления жизненным циклом информационных систем и информационно-коммуникационных технологий | Управление процессами создания и использования продуктов и услуг в сфере информационно-коммуникационных технологий, в том числе разработка алгоритмов и программ для их практической реализации | Проведение исследований и анализа рынка информационных систем и информационно-коммуникационных технологий, выбор рациональных решений для управления бизнесом", "career": "Выпускники работают в сфере финансов и экономики — занимаются бизнес‑анализом, организуют и развивают платёжные системы и их сервисы. В административно‑управленческой сфере они оптимизируют и автоматизируют рабочие процессы с применением информационных технологий. Также востребованы в сфере связи и информационных технологий: анализируют и моделируют бизнес‑процессы предприятий, планируют развитие информационных систем, поддерживают принятие управленческих решений. Кроме того, выпускники строят карьеру в сфере образования и научных исследований.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10178", "passing": ""}, {"id": "10179", "name": "Автоматизированные системы управления (Интеллектуальные системы автоматизации; БПЛА)", "level": "Бакалавриат", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 135000, "exam": "Математика, Русский язык, Физика (по выбору), Информатика (по выбору)", "about": "Программа осуществляет подготовку специалистов для промышленности, ориентированных на обслуживание и проектирование оборудования в рамках автоматизированных производственных процессов, техничного зрения, интеллектуальных систем управления, систем управления навигационными средствами, беспилотными летающими и перемещающимися объектами", "learn": "Владение теорией автоматического управления, разработка ПО систем управления, применение статистических методов в исследованиях, работа с техническими средствами автоматизации. | Работа с микроконтроллерами и микропроцессорами, пневмоавтоматикой, системным ПО; обработка данных, использование нейрокомпьютеров; разработка ПО автоматизированных систем. | Эксплуатация беспилотников, управление их взаимодействием по протоколам связи; понимание конструкции и автономного движения; работа с навигацией и потоковой обработкой данных видеорегистрации.", "career": "Выпускники работают: в сфере связи и информационных коммуникационных технологий — настраивают базы данных и сопровождают информационные системы; в ракетно‑космической промышленности — разрабатывают аппаратуру бортовых космических систем; на машиностроительных предприятиях — внедряют автоматизацию технологических процессов; в промышленности — обеспечивают соответствие продукции нормам, внедряют системы автоматизации, робототехники и работают с беспилотными объектами.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10179", "passing": ""}, {"id": "10180", "name": "Управление качеством продукции, процессов и услуг", "level": "Бакалавриат", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 135000, "exam": "Физика (по выбору), Русский язык, Математика, Информатика (по выбору)", "about": "Программа разработана с учетом современных требований рынка труда в области управления качеством и ориентирована на подготовку специалистов в этой области и формирования у них практических навыков для решения всех видов профессиональных задач.", "learn": "Средства и методы управления качеством | Основы планирования и обеспечения качества | Методы и средства измерений, испытаний и контроля | Основы системного подхода в управлении качеством | Производственный менеджмент | Технология и организация производства товаров и услуг | Сертификация СМК | Аудит качества", "career": "Выпускники программы по управлению качеством работают на промышленных предприятиях, в энергетике, машиностроении, сфере услуг и IT-компаниях, органах сертификации и стандартизации, консалтинговых организациях. Они занимаются внедрением и развитием систем менеджмента качества, анализом и повышением качества продукции и процессов, оценкой рисков, разработкой технической документации, проведением сертификации и аудита качества, цифровизацией процессов контроля, а также сопровождением проектов повышения эффективности деятельности организаций.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10180", "passing": ""}, {"id": "10181", "name": "Робототехнические устройства", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 135000, "exam": "Информатика (по выбору), Математика, Физика (по выбору), Русский язык", "about": "Программа направлена на подготовку специалистов в области робототехники, автоматизации производства, исследования и разработок. Студенты получают знания и навыки в области механики, электроники, программирования и автоматизации процессов, что необходимо для разработки и управления современными роботами и мехатронными системами.", "learn": "Механика жидкости и газа | Динамика мехатронных систем | Диагностика технических систем | Технические средства автоматизации | Промышленная робототехника | Основы компьютерного моделирования и проектирования робототехнических устройств и систем | Управление роботами и мехатронными устройствами | Вычислительные методы компьютерного моделирования в механике | Основы прототипирования и программирования мехатронных и робототехнических устройств | Гидропневмопривод и электропривод мехатронных и робототехнических устройств | Электронные устройства мехатронных и робототехнических устройств", "career": "Выпускники работают в производстве машин и оборудования (повышают производительность и безопасность труда), на предприятиях электро‑, электронного и оптического оборудования (определяют характеристики новой техники), в сфере образования и науки (реализуют образовательные программы, проводят исследования и испытания мехатронных систем). Также востребованы в промышленности — автоматизируют и роботизируют производство, применяют компьютерные и расчётно‑экспериментальные технологии для проектирования и отладки систем.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10181", "passing": ""}, {"id": "10182", "name": "Гидроэнергетика", "level": "Бакалавриат", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 135000, "exam": "Математика (по выбору), Физика, Информатика (по выбору), Русский язык", "about": "Программа направлена на подготовку инженеров для проектирования, строительства и эксплуатации гидротехнических сооружений и гидроэлектростанций. В ходе обучения студенты осваивают ключевые дисциплины: гидромеханику, гидрологию, основы возобновляемой энергетики, изучают устройство и принципы работы гидротурбинного оборудования. Особое внимание уделяется практическим навыкам расчёта, моделирования и оценки эффективности гидроэнергетических объектов, а также вопросам эксплуатации и обслуживания сооружений водного хозяйства. Выпускники готовы к профессиональной деятельности в сфере гидроэнергетики, управления водными ресурсами и инфраструктурного развития гидротехнических комплексов.", "learn": "Математические задачи возобновляемой энергетики | Электроэнергетические системы и сети | Релейная защита электроэнергетических систем | Системы автоматизированного управления в электроэнергетике | Метрология и информационно-измерительная техника | Электрические станции и подстанции | Техника высоких напряжений, электроснабжение, ТЭС и АЭС | Инженерная гидрология, гидравлические машины, гидротехнические сооружения | Инженерная и компьютерная графика | Конструкционное и электротехническое материаловедение", "career": "Выпускники работают в сфере гидроэнергетики и водного хозяйства: на гидроэлектростанциях и гидроаккумулирующих электростанциях, в том числе на малых и микро‑ГЭС. Они заняты на объектах инфраструктуры — плотинах, водоподпорных, водозаборных и водосбросных сооружениях, водохранилищах, бассейнах суточного регулирования и водоводах. Специалисты трудятся в проектных и строительных организациях, энергетических компаниях, научно‑исследовательских институтах, участвуют в управлении энергохозяйством и развитии гидроэнергетики, включая обслуживание гидротурбинного оборудования и систем автоматического управления технологическими процессами ГЭС.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10182", "passing": ""}, {"id": "10183", "name": "Проектирование и эксплуатация объектов энергетики", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 2, "cost": 135000, "exam": "Математика (по выбору), Физика, Информатика (по выбору), Русский язык", "about": "Программа включает в себя 3 профиля: Энергоснабжение, Электроборудование автомобилей, Электрические аппараты станций и подстанций. Многопрофильное обучение в рамках программы направлено на формирование глубокого понимания процессов, происходящих на всех этапах пути электроэнергии — от производства на тепловых и атомных станциях до передачи и потребления на промышленных объектах и в жилых массивах. Особое внимание уделяется современным подходам к автоматизации, где изучаются методы проектирования интеллектуальных систем управления и релейной защиты, обеспечивающих надежность и безопасность энергоснабжения.", "learn": "Электрические аппараты высокого напряжения | Автоматизированное проектирование электромеханических преобразователей | Информационные и компьютерные технологии в электротехнике | Проектирование систем электроснабжения, переходные процессы в системах электроснабжения | Электрооборудование систем электроснабжения | Электрические аппараты низкого напряжения | Выключатели высоковольтные, проектирование низковольтных комплектных устройств; | Системы тягового привода с гибридными энергоустановками | Электрооборудование электромобилей и автомобилей с комбинированными энергоустановками, их эксплуатация и ремонт | Эксплуатация систем электроснабжения, монтаж электрооборудования", "career": "Выпускники работают в строительстве и ЖКХ — проектируют и эксплуатируют объекты электроэнергетики; в электроэнергетике и атомной промышленности — занимаются эксплуатацией электроэнергетического и электротехнического оборудования (основного и вспомогательного). Также востребованы в промышленности: участвуют в производстве волоконно‑оптических кабелей, проектировании и эксплуатации электроэнергетических систем, электротехнических комплексов, систем электроснабжения, автоматизации и механизации производства. Работают с электрооборудованием разного напряжения, электрическими машинами, трансформаторами и системами управления потоками энергии.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10183", "passing": ""}, {"id": "10188", "name": "Диагностические системы и технологии", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 2, "cost": 135000, "exam": "Физика, Русский язык, Информатика (по выбору), Математика (по выбору)", "about": "Программа включает 3 профиля: Приборы диагностики зданий и сооружений, Медицинские диагностические приборы, Компьютерная фотоника. Студенты изучают физические принципы работы диагностического оборудования, методы неразрушающего контроля (ультразвуковые, электромагнитные, тепловизионные), электронику, схемотехнику, датчики и встроенные системы, обработку и интерпретацию сигналов. Осваиваются технологии проектирования оптических и лазерных устройств, фотонных компонентов и световодных систем, а также современные программные комплексы для автоматизации диагностики, анализа результатов измерений и прогнозирования состояния объектов.", "learn": "Компьютерное моделирование в диагностике | Неразрушающий контроль бетонных изделий, стальных конструкций | Диагностика биологических объектов, биофизика | Компьютерные технологии в системах фотоники, нанофотоника | Основы конструирования оптико-электронных систем | Электромагнитные и физические методы контроля | Основы конструирования, основы проектирования оптических систем | Разработка интеллектуальных систем, методы и средства анализа данных | Мониторинг состояния зданий методом акустической эмиссии | Компьютерная фильтрация изображений, методы обработки и восстановления изображений;", "career": "Выпускники могут работать в области проектирования приборов и оптико‑электронных систем, на промышленных предприятиях (производство и техконтроль электро‑, электронного и оптического оборудования), в лабораториях неразрушающего контроля (диагностика зданий, конструкций, материалов), в медицинских организациях и компаниях‑производителях медтехники (разработка и обслуживание диагностических приборов), в научно‑исследовательских институтах (разработка методов диагностики и фотонных технологий), в сервисных и ремонтных центрах (постпродажное обслуживание технических систем), а также в компаниях, разрабатывающих информационно‑измерительные системы и ПО для диагностики.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10188", "passing": ""}, {"id": "10190", "name": "Технологии теплоэнергетики", "level": "Бакалавриат", "inst": "ИДДО", "campus": "Москва", "budget": 0, "contract": 1, "cost": 135000, "exam": "Математика (по выбору), Информатика (по выбору), Физика, Русский язык", "about": "Программа включает в себя несколько профилей: «Тепловые станции», «Теплоснабжение», «Водоподготовка» и «Автоматизированные системы». Обучение направлено на подготовку специалистов в области теплоэнергетики, включая проектирование, эксплуатацию и модернизацию технических средств по производству, распределению и рациональному использованию тепловой энергии.", "learn": "Отопление, вентиляция и кондиционирование | Технологические энергоносители и энергосистемы предприятий | Энергетическое обследование предприятий и энергетический менеджмент | Газотурбинные и парогазовые технологии на ТЭС | Автоматизация систе м, а также пониманием правовых и этических аспектов профессиональной деятельности для успешной работы в условиях динамично развивающихся медиа-индустрий.", "learn": "Организация работы отделов рекламы и связей с общественностью в СМИ | Корпоративные коммуникации: формирование внутреннего и внешнего имиджа компаний. | Digital-маркетинг и SMM: управление присутствием бренда в цифровой среде и социальных медиа. | Организация работы пресс-службы | Медиапроизводство: создание рекламного, информационного и контентного наполнения для различных каналов связи. | Методы исследования рынка и оценки эффективности рекламных рекламных кампаний", "career": "Выпускники программы могут работать в рекламных агентствах, PR- и коммуникационных агентствах, маркетинговых отделах коммерческих компаний, а также в средствах массовой информации (телевидение, радио, интернет-издания). Они востребованы в пресс-службах и отделах по связям с общественностью, медиа-компаниях, исследовательских и аналитических центрах. Специалисты смогут занимать позиции менеджеров по рекламе и PR, бренд-менеджеров, маркетологов, медиапланеров, специалистов по коммуникациям, аналитиков рынка, а также участвовать в разработке и реализации рекламных и коммуникационных кампаний, проведении маркетинговых и социологических исследований и управлении имиджем организаций и СМИ.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10218", "passing": ""}, {"id": "10219", "name": "Реклама и связи с общественностью", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 155000, "exam": "Обществознание, Русский язык, Информатика (по выбору), Иностранный язык (по выбору), История (по выбору)", "about": "Цель образовательной программы — подготовка квалифицированных специалистов в области рекламы, маркетинга и связей с общественностью, обладающих современными знаниями о медиа-среде, навыками разработки и реализации эффективных коммуникационных стратегий, анализа ры го сочетания фундаментального и прикладного образования с использованием передовых образовательных технологий.", "learn": "Аудит безопасности информационных систем | Администрирование систем и сетей | Безопасность критической информационной инфраструктуры объектов энергетики | Безопасность беспроводных сетей передачи информации, информационная безопасность в цифровой экономике | Технические средства защиты информации | Защита информации в киберфизических системах | Управление инцидентами информационной безопасности", "career": "Области и сферы профессиональной деятельности выпускника: Связь, информационные и коммуникационные технологии (в сфере техники и технологии, охватывающей совокупность проблем, связанных с обеспечением защищенности объектов информатизации в условиях существования угроз в информационной сфере).", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10222", "passing": ""}, {"id": "10223", "name": "Управление качеством процессов и продукции предприятия", "level": "Бакалавриат", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 140000, "exam": "Математика, Русский язык, Физика (по выбору), Информатика (по выбору)", "about": "Программа обеспечивает студентам фундаментальное понимание принципов и методов управления качеством в различных сферах применения. Она охватывает широкий спектр знаний и навыков, необходимых для эффективного управления качеством в производственных и технологических системах. Обучение включает изучение основных аспектов управления качеством, стандартов и методологий, анализа и улучшения процессов, контроля качества, управления рисками, статистического анализа данных, а также разработки и внедрения стратегий управления качеством. Особое внимание в подготовке специалистов уделено статистическим методам управления качеством и системному подходу в управлении.", "learn": "Информационные технологии в управлении качеством и защита информации | Маркетинг, аудит качества | Инновационный менеджмент | Исследование систем управления | Производственный менеджмент | Методы и средства измерений, испытаний и контроля | Планирование качества, проектная деятельность | Статистические методы в управлении качеством | Технологии и организация производства продукции и услуг | Управление качеством электроэнергии | Экономические основы повышения качества", "career": "Выпускники работают на промышленных предприятиях любой отрасли, в консалтинговых компаниях, органах по сертификации и испытательных лабораториях, отделах качества организаций. Занимаются внедрением принципов всеобщего управления качеством (TQM), анализом и улучшением работы предприятий, разработкой методик повышения качества продукции. Организуют процедуры сертификации процессов и продукции, консультируют по вопросам систем менеджмента качества и сопровождают их внедрение.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10223", "passing": ""}, {"id": "10224", "name": "Управление проектами", "level": "Магистратура", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 160000, "exam": "Вступительные испытания по профилю", "about": "Программа направлена на подготовку специалистов в области современного менеджмента. Обучение формирует управленческое мышление и компетенции в реализации функций менеджмента для различных сфер деятельности организаций. Особое внимание уделяется стратегическому и тактическому планированию, организации производства и управлению проектами для достижения стратегических целей организации.", "learn": "Организация эффективной командной работы и руководство проектами | Разработка и внедрение инновационных подходов в управлении организацией | Стратегическое планирование и распределение ресурсов организации | Управление проектами на всех этапах жизненного цикла с применением современных методик и инструментов | Проведение системного анализа проблемных ситуаций и выработка стратегий их решения", "career": "Выпускники осуществляют профессиональную деятельность в сфере стратегического и тактического планирования, организации производства, управления проектами в различных отраслях экономики. Их профессиональная деятельность охватывает широкий спектр задач: от стратегического и тактического планирования до организации производства и управления проектами.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10224", "passing": ""}, {"id": "10225", "name": "Управление деятельностью PR-организаций и структур", "level": "Магистратура", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 160000, "exam": "Вступительные испытания по профилю", "about": "Программа подготавливает специалистов, способных эффективно управлять коммуникационными и PR-процессами в организациях различных отраслей экономики, а также разрабатывать и реализовывать стратегические коммуникационные решения.", "learn": "Теория и практика связей с общественностью | Работа со СМИ и медиа менеджмент | Управление кризисными ситуациями и антикризисные коммуникации | Ведение и управление корпоративной репутацией | Стратегии коммуникации и PR-планирование | Digital-маркетинг и SMM | Правовые основы деятельности в сфере PR | Мониторинг и аналитика эффективности PR-кампаний", "career": "Выпускники программы готовы занять позиции менеджеров по связям с общественностью, PR-менеджеров, специалистов по корпоративной коммуникации, управлению репутацией, медиаменеджменту, контент-менеджеров, экспертов по коммуникациям в государственных органах, коммерческих и некоммерческих организациях, а также заниматься стратегическим консалтингом и развитием собственных проектов в сфере PR.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10225", "passing": ""}, {"id": "10226", "name": "Цифровизация в тепловой и возобновляемой энергетике", "level": "Бакалавриат", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 420000, "exam": "Русский язык, Физика, Математика (по выбору), Информатика (по выбору), Химия (по выбору)", "about": "Образовательная программа «Цифровизация в тепловой и возобновляемой энергетике» фокусируется на развитии навыков математического и компьютерного моделирования энергетических систем. В ходе обучения студенты осваивают работу с компьютерными моделями, обработку и анализ данных, а также методы моделирования объектов тепловой и возобновляемой энергетики. Программа включает изучение современных языков программирования для анализа, прогнозирования и машинного обучения объектов энергетики, а также инструментов визуализации данных.", "learn": "Водоподготовка | Язык программирования, основы цифровизации в тепловой энергетике | Моделирование объектов тепловой и возобновляемой энергетики, CFD-моделирование | Системы машинного обучения и предиктивной аналитики в тепловой и возобновляемой энергетике | Энергетические котлы и системы теплоснабжения, экологически безопасные технологии на ТЭС | Энергетическое топливо и масла | Турбины ТЭС и АЭС | ТЭС и АЭС, Водно-химические режимы ТЭС и АЭС, режимы работы и эксплуатация ТЭС | Вспомогательное оборудование электростанций", "career": "Выпускники работают в производстве машин и оборудования (проектирование объектов теплоэнергетики), атомной промышленности (эксплуатация тепломеханического и теплообменного оборудования), электроэнергетике, нефтегазовой отрасли (регулирование потоков углеводородного сырья), строительстве и ЖКХ (проектирование и эксплуатация объектов теплоэнергетики), а также в сфере науки и образования и в ИТ‑сфере. Они заняты на ТЭС и АЭС, объектах малой и возобновляемой энергетики, тепловых сетях, котельных, энергоблоках и газотурбинных установках, в т. ч. занимаются водо‑ и топливоподготовкой, моделированием теплоэнергетического оборудования и эксплуатацией тепловых насосов.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10226", "passing": "216"}, {"id": "10227", "name": "Информационное и программное обеспечение бизнес-процессов", "level": "Ба g": ""}];
const INST_FULL = {"ИВТИ": "Институт информационных и вычислительных технологий", "ИГВИЭ": "Институт гидроэнергетики и возобновляемых источников энергии", "ИЭВТ": "Институт энергоэффективности и водородных технологий", "ИнЭИ": "Инженерно-экономический институт", "ИРЭ": "Институт радиотехники и электроники им. В.А. Котельникова", "ИТАЭ": "Институт тепловой и атомной энергетики", "ЭнМИ": "Институт энергомашиностроения и механики", "ИЭЭ": "Институт электроэнергетики", "ИЭТЭ": "Институт электротехники и электрификации", "ГПИ": "Гуманитарно-прикладной институт", "ИДДО": "Институт дистанционного и дополнительного образования"};
const INST_ORDER = ["ИВТИ", "ИРЭ", "ИЭЭ", "ИЭТЭ", "ИТАЭ", "ЭнМИ", "ИЭВТ", "ИГВИЭ", "ИнЭИ", "ГПИ", "ИДДО"];
const INST_COLOR = {"ИВТИ": "#2563eb", "ИРЭ": "#7c3aed", "ИЭЭ": "#dc2626", "ИЭТЭ": "#ea580c", "ИТАЭ": "#0891b2", "ЭнМИ": "#0d9488", "ИЭВТ": "#16a34a", "ИГВИЭ": "#0284c7", "ИнЭИ": "#ca8a04", "ГПИ": "#db2777", "ИДДО": "#475569"};
const LEVELS = ["Бакалавриат","Магистратура","Аспирантура"];
const DEFAULT_AC = "#0a3d7a";

let state = {level: "Бакалавриат", inst: "all", q: ""};

const fmtMoney = n => (n==null) ? "—" : n.toLocaleString("ru-RU") + " ₽";
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function levelCounts(){
  const c={}; LEVELS.forEach(l=>c[l]=0);
  DATA.forEach(p=>{if(c[p.level]!=null)c[p.level]++});
  return c;
}
function instColor(code){return DEFAULT_AC;} // единый корпоративный синий

function renderTabs(){
  const c=levelCounts();
  document.getElementById("tabs").innerHTML = LEVELS.map(l=>
    `<button class="tab ${l===state.level?'active':''}" data-l="${l}">${l}<span class="cnt">${c[l]}</span></button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    state.level=b.dataset.l; state.inst="all"; renderTabs(); renderFilters(); renderContent();
  });
}

function institutesFor(level){
  const set=new Set(DATA.filter(p=>p.level===level && p.inst).map(p=>p.inst));
  return INST_ORDER.filter(i=>set.has(i));
}

function renderFilters(){
  const insts=institutesFor(state.level);
  const box=document.getElementById("filt");
  if(insts.length===0){box.innerHTML="";return;}
  let h=`<button class="chip ${state.inst==='all'?'active':''}" data-i="all" style="${state.inst==='all'?'background:var(--blue)':''}">Все институты</button>`;
  h+=insts.map(i=>
    `<button class="chip ${state.inst===i?'active':''}" data-i="${i}" title="${esc(INST_FULL[i]||'')}" style="${state.inst===i?'background:var(--blue)':''}">${i}</button>`
  ).join("");
  box.innerHTML=h;
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.inst=b.dataset.i;renderFilters();renderContent();});
}

function cardHTML(p){
  const ac=instColor(p.inst);
  const tag = p.inst ? p.inst : "Научная специальность";
  const facts=[];
  if(p.budget!=null) facts.push(`<div class="fact"><span>Бюджетных мест</span><b>${p.budget}</b></div>`);
  if(p.contract!=null) facts.push(`<div class="fact"><span>Контрактных мест</span><b>${p.contract}</b></div>`);
  if(p.cost!=null) facts.push(`<div class="fact"><span>Стоимость / год</span><b>${fmtMoney(p.cost)}</b></div>`);
  return `<div class="card" style="--ac:${ac}" data-id="${p.id}">
    <span class="tag">${esc(tag)}</span>
    <h3>${esc(p.name)}</h3>
    <div class="facts">${facts.join("")}</div>
    <div class="more">Подробнее <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>`;
}

function renderContent(){
  const root=document.getElementById("content");
  let list=DATA.filter(p=>p.level===state.level);
  if(state.inst!=="all") list=list.filter(p=>p.inst===state.inst);
  if(state.q){const q=state.q.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q));}

  if(list.length===0){root.innerHTML=`<div class="empty">Программы не найдены</div>`;bindCards();return;}

  const hasInst = list.some(p=>p.inst);
  if(!hasInst){
    root.innerHTML=`<div class="grid">${list.map(cardHTML).join("")}</div>`;
    bindCards();return;
  }
  // группировка по институтам
  let html="";
  const insts = (state.inst==="all") ? institutesFor(state.level).filter(i=>list.some(p=>p.inst===i)) : [state.inst];
  insts.forEach(i=>{
    const items=list.filter(p=>p.inst===i);
    if(!items.length)return;
    html+=`<section class="inst">
      <div class="inst-h">
        <span class="inst-badge">${i}</span>
        <span class="inst-name">${esc(INST_FULL[i]||i)}</span>
        <span class="inst-count">${items.length} ${items.length%10===1&&items.length%100!==11?'программа':'программ'}</span>
      </div>
      <div class="grid">${items.map(cardHTML).join("")}</div>
    </section>`;
  });
  // программы без института внутри уровня (на всякий случай)
  const noInst=list.filter(p=>!p.inst);
  if(noInst.length){html+=`<section class="inst"><div class="grid">${noInst.map(cardHTML).join("")}</div></section>`;}
  root.innerHTML=html;
  bindCards();
}

function bindCards(){
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openModal(c.dataset.id));
}

function openModal(id){
  const p=DATA.find(x=>String(x.id)===String(id));
  if(!p)return;
  const ac=instColor(p.inst);
  const stats=[];
  if(p.budget!=null) stats.push(`<div class="m-stat"><div class="k">Бюджетных мест</div><div class="v">${p.budget}</div></div>`);
  if(p.contract!=null) stats.push(`<div class="m-stat"><div class="k">Контрактных мест</div><div class="v">${p.contract}</div></div>`);
  if(p.cost!=null) stats.push(`<div class="m-stat"><div class="k">Стоимость / год</div><div class="v">${fmtMoney(p.cost)}</div></div>`);
  if(p.campus) stats.push(`<div class="m-stat"><div class="k">Кампус</div><div class="v">${esc(p.campus)}</div></div>`);

  // «Чему учат» — превратить в список по разделителям | ;
  let learnHTML="";
  if(p.learn){
    const items=p.learn.split(/\s*[|;]\s*/).map(s=>s.trim()).filter(Boolean);
    if(items.length>1){
      learnHTML=`<ul class="llist">${items.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
    }else{
      learnHTML=`<p>${esc(p.learn)}</p>`;
    }
  }
  const instLine = p.inst ? `<div class="inst-line">${esc(INST_FULL[p.inst]||p.inst)} (${esc(p.inst)})</div>` : "";

  let body="";
  if(p.about) body+=`<div class="sect"><h4>О программе</h4><p>${esc(p.about)}</p></div>`;
  if(learnHTML) body+=`<div class="sect"><h4>Чему научат</h4>${learnHTML}</div>`;
  if(p.career) body+=`<div class="sect"><h4>Кем работают выпускники</h4><p>${esc(p.career)}</p></div>`;
  if(p.exam) body+=`<div class="sect"><h4>Вступительные испытания</h4><div class="exam">${esc(p.exam)}</div></div>`;

  document.getElementById("modal").innerHTML=`
    <div class="m-head" style="--ac:${ac}">
      <button class="x" onclick="closeModal()">×</button>
      <div class="lv">${esc(p.level)}</div>
      <h2>${esc(p.name)}</h2>
      ${instLine}
    </div>
    ${stats.length?`<div class="m-stats">${stats.join("")}</div>`:""}
    <div class="m-body">${body}</div>
    ${p.link?`<div class="m-foot"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Подробнее на studyinrussia.ru
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg></a></div>`:""}
  `;
  document.getElementById("ov").classList.add("show");
  document.body.classList.add("lock");
}
function closeModal(){document.getElementById("ov").classList.remove("show");document.body.classList.remove("lock");}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;renderContent();});

renderTabs();renderFilters();renderContent();
</script>
</body>
</html>
