тают над созданием и эксплуатацией электротехнического оборудования. Они востребованы в компаниях автомобилестроения, авиастроения, а также на предприятиях, занимающихся производством волоконно-оптических кабелей и электроэнергетических систем.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8947", "passing": ""}, {"id": "8948", "name": "Физика и технология электротехнических материалов и изделий", "level": "Магистратура", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Программа направлена на подготовку специалистов, обладающих глубокими знаниями в области физики электротехнических материалов, их свойств, технологий производства и применения в электротехнической и энергетической промышленности. Студенты осваивают современные методы исследования и разработки новых материалов, технологий изготовления электротехнических изделий, а также получают компетенции в области контроля качества и диагностики технического состояния материалов и изделий, что позволяет создавать эффективные и надежные электротехнические компоненты для различных отраслей.", "learn": "Физика электротехнических материалов | Технология производства электротехнических материалов и изделий | Нормативно-техническая документация и стандартизация в области электротехнических материалов | Методы исследования и контроля качества материалов | Материаловедение и химия электротехнических материалов", "career": "Выпускники программы востребованы на профильных предприятиях по производству электротехнических материалов и изделий, в научно-исследовательских институтах, лабораториях контроля качества, а также в компаниях, занимающихся разработкой и внедрением новых материалов и технологий для энергетики и электротехники. Основные позиции: инженер-технолог, инженер по контролю качества, научный сотрудник, конструктор материалов и изделий, специалист по сертификации и стандартизации, менеджер по разработкам в области электротехнических материалов", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8948", "passing": ""}, {"id": "8949", "name": "Электротехнология", "level": "Магистратура", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Программа предназначена для подготовки высококвалифицированных специалистов в области проектирования, разработки, эксплуатации и совершенствования электротехнологических процессов и оборудования в энергетической отрасли. Студенты изучают современные технологии производства и преобразования электрической энергии, а также технологии монтажа, эксплуатации и обслуживания электротехнических систем и устройств. Особое внимание уделяется автоматизации процессов и обеспечению надежности электроустановок.", "learn": "Электроизоляционные материалы и технологии | Нормативно-техническая документация, стандартизация и безопасность труда | Устройства и системы электроснабжения и электроснабжения промышленных предприятий | Методы диагностики и контроля состояния электротехнического оборудования | Теоретические основы электротехнологий | Технологии производства и сборки электротехнического оборудования", "career": "Выпускники программы востребованы на предприятиях энергетического комплекса, в производственных и монтажных организациях, научных и проектных институтах, занимающихся разработкой и эксплуатацией электротехнологического оборудования. Они могут работать инженерами по эксплуатации, инженерами по монтажу и наладке, специалистами по диагностике и автоматизации электросистем, а также в сферах научных исследований и проектирования. Основные позиции: инженер-электрик, инженер по электромонтажу, специалист по автоматизации и управлению, инженер по эксплуатации электросетей и установок, научный сотрудник.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8949", "passing": ""}, {"id": "8950", "name": "Электри ми динамики машин, роботов и мехатронных систем.", "learn": "Проводить научные исследования в области механики и динамики машин | Разрабатывать математические модели сложных механических систем | Работать с современным испытательным оборудованием | Создавать инновационные робототехнические объекты и системы | Применять компьютерные технологии моделирования движения | Анализировать устойчивость, колебания и динамические нагрузки в машинах", "career": "Выпускники могут работать в следующих сферах: наука и образование – преподаватели в высших учебных учреждениях, научные сотрудники в научно-исследовательских институтах; инженерия и промышленность – инженеры-расчетчики, специалисты по динамике машин (авиация, космос, автомобилестроение, робототехника); IT и моделирование – разработчики программного обеспечения для инженерных расчетов; государственные и частные компании в области механики и машиностроения. Образовательные учреждения в качестве преподавателей и исследователей", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8981", "passing": ""}, {"id": "8982", "name": "Механика деформируемого твердого тела", "level": "Аспирантура", "inst": "", "campus": "Москва", "budget": 0, "contract": 3, "cost": 490000, "exam": "Конкурс научного портфолио абитуриента, Специальная дисциплина, соответствующая научной специальности программы подготовки в аспирантуре", "about": "Подготовка кадров высшей квалификации в области теоретического и прикладного анализа напряженно-деформированного состояния материалов и конструкций под воздействием механических, тепловых и других нагрузок. Программа сочетает фундаментальную механику с прикладными задачами прочности, устойчивости и разрушения материалов. Основные направления: теория упругости, пластичности и ползучести (линейные и нелинейные модели); механика разрушения (трещины, усталость, хрупкое и вязкое разрушение); динамика и устойчивость конструкций (удар, вибрации, сейсмические воздействия); композитные и анизот ние, производство и применение приборов, систем и изделий медицинского назначения | Биотехнические системы и технологии, фотоника, радиоэлектроника, приборостроение", "career": "Область профессиональной деятельности выпускников, освоивших программу аспирантуры, включает: инженерию, направленную на проектирование, производство и применение приборов, систем и изделий медицинского назначения; экспертную и организационно-управленческую деятельность, связанную с биотехническими системами и технологиями; педагогическую деятельность по подготовке кадров с высшим образованием в сфере разработки и применения приборов, систем и изделий медицинского назначения. Образовательные учреждения в качестве преподавателей и исследователей.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/9019", "passing": ""}, {"id": "9020", "name": "Радиотехника, в том числе системы и устройства телевидения", "level": "Аспирантура", "inst": "", "campus": "Москва", "budget": 0, "contract": 8, "cost": 480000, "exam": "Специальная дисциплина, соответствующая научной специальности программы подготовки в аспирантуре, Конкурс научного портфолио абитуриента", "about": "Программа направлена на подготовку высококвалифицированных специалистов и ученых в области радиотехнических устройств, включая разработку. Основная цель программы — углубленное изучение теоретических и практических аспектов радиотехники, формирование навыков научно-исследовательской деятельности, а также развитие компетенций для внедрения инновационных технологий в области передачи и обработки сигналов. Выпускники программы смогут решать сложные технические задачи, разрабатывать новые радиотехнические устройства и участвовать в современных научных исследованиях.", "learn": "Исследования в области беспроводных технологий (5G, IoT) | Развитие цифрового телевидения (DVB, IPTV) | Развитие спутниковых и мобильных систем связи", "career": "Выпускники программы могут работать в научно-исследовательских институтах, констру тенных систем и микроволновых устройств | Исследование и разработка радио-оптических антенных систем и антенн с уникальными характеристиками | Разработка методов автоматизированного проектирования и оптимизации антенных систем и микроволновых устройств широкого применения | Решение задач электродинамики для анализа и синтеза высокоэффективных антенн и микроволновых устройств, определения их предельно-достижимых характеристик, возможных путей построения и т. д. | Исследования распространения радиоволн на различных трассах в природных и искусственных средах и влияние условий распространения и вида подстилающей поверхности на характеристики антенн", "career": "Исследование и моделирование процессов в электродинамике, радиоэлектронике и радиофизике. Разработка, проектирование и эксплуатация материалов, компонентов, электронных приборов и устройств, установок вакуумной, плазменной, твердотельной, микроволновой, оптической, микро- и наноэлектроники. Создание и применение систем на основе электромагнитных волн для передачи, приема, обработки информации об окружающей среде, природных и технических объектах и воздействия на них для изменениях их свойств. Технологии, средства и методы человеческой деятельности для работы с информацией на расстоянии по проводной, радио, оптической системам. Образовательные учреждения, преподавание, исследования.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/9021", "passing": ""}, {"id": "9022", "name": "Радиолокация и радионавигация", "level": "Аспирантура", "inst": "", "campus": "Москва", "budget": 0, "contract": 5, "cost": 480000, "exam": "Специальная дисциплина, соответствующая научной специальности программы подготовки в аспирантуре, Конкурс научного портфолио абитуриента", "about": "Программа подготовки направлена на изучение и решение проблем, требующих применения фундаментальных знаний в области радиотехники, связанных с разработкой, исследованием и моделированием новых радиотехнических устройств, создани ировании механических систем и процессов, а также в разработке системного и программного обеспечения. Особое внимание при подготовке выпускников уделяется методам математического моделирования, компьютерной реализации математических моделей, современным информационным технологиям и их применению в научно-исследовательской, конструкторской и производственной деятельности.", "learn": "Обрабатывать и интерпретировать данные, полученные в ходе натурных или вычислительных экспериментов, подготавливать тех. отчёты и заключения | Осуществлять анализ надёжности и оптимизация механических систем, поиск оптимальных форм и материалов для будущих изделий | Проводить сложные инженерные расчёты на основе методов математической физики и численных алгоритмов | Проектировать и проводить виртуальные эксперименты: создание цифровых двойников реальных объектов для анализа их прочности, устойчивости и динамики | Разрабатывать и внедрять специализированное программное обеспечение для решения задач механики сплошной среды и механики деформируемого твёрдого тела | Моделировать многокомпонентные и многофазные процессы: например, течение жидкостей, взаимодействие конструкций с жидкостями и газами или распространение колебаний", "career": "Выпускники могут работать в сферах образования и науки, занимаясь преподаванием и научными исследованиями, в архитектуре и проектировании, выполняя математическое и компьютерное моделирование сложных систем и конструкций. Они востребованы в нефтегазовой отрасли, атомной и ракетно-космической промышленности, судостроении, автомобилестроении и авиастроении, где применяют методы математического моделирования, вычислительной механики, численных методов и анализа надежности. Также возможна работа в сквозных видах промышленной деятельности, включая научно-исследовательские и опытно-конструкторские разработки, создание алгоритмов, программного обеспечения и моделей механических систем и процессов.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10108", "passing": "256"}, {"id": "10109", "name": "Газотурбинные, паротурбинные установки и двигатели", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Русский язык, Физика, Математика (по выбору), Информатика (по выбору)", "about": "Программа готовит высококвалифицированных специалистов по проектированию, конструированию и эксплуатации паротурбинных и газотурбинных установок и двигателей. Обучение сочетает теоретическую подготовку с практическими навыками: студенты работают в современной лаборатории, проводят исследования аэродинамики элементов турбомашин, осваивают CAD/CAE‑системы и методы трёхмерного проектирования. Особое внимание уделяется вычислительной гидродинамике: учащиеся учатся моделировать течения, анализировать результаты расчётов и оптимизировать конструкции с учётом гидро‑ и аэродинамических нагрузок.", "learn": "Автоматическое регулирование турбоустановок | Основы применения CAD/CAE для проектирования элементов турбомашин | Газотурбинные и паротурбинные установки, комбинированные установки | Лопастные турбомашины, нагнетательные машины | Конструкция деталей и узлов турбомашин, прочность материалов и деталей турбомашин | Механика жидкости и газа | Теплообменники энергетических установок", "career": "Выпускники работают: инженерами‑проектировщиками и конструкторами энергетического оборудования; научными сотрудниками и исследователями (в т. ч. в рамках научно‑исследовательских и опытно‑конструкторских работ); монтажниками и наладчиками установок; техниками и инженерами по эксплуатации, обслуживанию, диагностике, ремонту и модернизации оборудования; менеджерами и руководителями проектов в энергетике. Трудоустраиваются на тепловых и атомных электростанциях, предприятиях энергетического машиностроения, в проектных и сервисных организациях, а также на объектах малой энергетики и компрессорных установках.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10109", "passing": "215"}, {"id": "10110", "name": "Фундаментальные и прикладные задачи мехатроники и робототехники", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 420000, "exam": "Математика, Русский язык, Физика (по выбору), Информатика (по выбору)", "about": "Программа направлена на подготовку специалистов по разработке интеллектуальных управляющих систем и робототехнических комплексов. Студенты учатся создавать алгоритмы управления мехатронными узлами и распределённые роботизированные системы для автоматизации сложных процессов в промышленности, энергетике, транспорте, авиационно‑космической отрасли и социальной сфере.", "learn": "Управление роботами и мехатронными устройствами | Управление и моделирование роботов и мехатронных систем | Промышленная робототехника | CAD/CAE технологии в робототехнике и мехатронике | Гидропневмопривод мехатронных и робототехнических устройств | Вычислительные методы компьютерного моделирования в механике | Электропривод мехатронных и робототехнических устройств | Основы компьютерного моделирования и проектирования робототехнических устройств и систем | Электротехника и электроника | Теория автоматического управления | Математический анализ | Теоретическая механика | Механика материалов и конструкций", "career": "Выпускники работают в образовании, науке, ракетно‑космической и авиационной промышленности, автомобиле‑ и судостроении, атомной энергетике, машиностроении. Занимаются разработкой и внедрением роботов и мехатронных систем: создают ПО, проектируют автономные аппараты и интеллектуальные системы, автоматизируют производство. Применяют компетенции в создании экзоскелетов и протезов, беспилотного транспорта, экстремальных роботов для опасных сред, роботизированных линий сборки и логистики. Сфера охватывает научные исследования, проектирование, управление проектами и техническое обеспечение.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10110", "passing": "233"}, {"id": "10111", "name": "Гидроэнергетика и возобновляемые источники энергии", "level": "Бакалавриат", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Образовательная программа охватывает проектирование, строительство и эксплуатацию гидроэлектростанций и энергоустановок на основе солнечной, ветровой и других возобновляемых источников энергии. Студенты изучают гидравлику, гидрологию, ветро‑ и гелиоэнергетику, системы накопления энергии и управление гибридными энергокомплексами. Обучение включает лабораторные работы, компьютерное моделирование режимов работы станций и практики на объектах гидро‑ и «зелёной» энергетики. Выпускники готовы работать в энергокомпаниях, проектных и эксплуатационных организациях сферы возобновляемой энергетики.", "learn": "Энергетические системы и ресурсы | Электротехнические материалы, промышленная электроника | Микроэлектроника и микропроцессорная техника | Эксплуатация и ремонт гидроэнергетического оборудования | Ветроэнергетика и ветротурбины | Солнечная энергетика и солнечные установки | Биомасса и биогазовые установки | Энергетическая безопасность и экология, энергоэффективность и энергосбережение | Техническая термодинамика | Гидравлические машины и установки | Энергетическая политика и планирование, экономика и управление в энергетике | Теория и расчет гидротурбин, проектирование гидроэлектростанций", "career": "Выпускники программы могут работать в области гидроэнергетики, электроэнергетических систем и сетей, ветровой и солнечной энергетики, автоматизации энергетических объектов, проектирования электростанций, энергоэффективности и энергетического аудита, а также научных исследований и внедрения инновационных технологий в энергетике. Они востребованы на гидроэлектростанциях и других объектах генерации электроэнергии, в сетевых и генерирующих компаниях, на предприятиях по производству энергетического оборудования, в проектных и инжиниринговых организациях, научно-исследовательских институтах, государственных структурах энергетического профиля.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10111", "passing": "214"}, {"id": "10112", "name": "Возведение и эксплуатация тепловых и атомных электростанций (получение 2-й квалиф-и Строительство)", "level": "Бакалавриат", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 420000, "exam": "Русский язык, Физика, Информатика (по выбору), Химия (по выбору), Математика (по выбору)", "about": "Программа направлена на подготовку специалистов в области возведения и эксплуатации тепловых и атомных электростанций. Студенты получают инженерную подготовку в сфере теплоэнергетики и строительства, осваивают технологии сооружения энергетических объектов и методы монтажа тепломеханического оборудования (паровых и газовых турбин, парогенераторов, теплообменных аппаратов). Особое внимание уделяется управлению эксплуатационными режимами с соблюдением требований безопасности. Особенность программы — присвоение второй квалификации по направлению 08.03.01 «Строительство», что расширяет компетенции выпускников и позволяет профессионально заниматься сооружением станций.", "learn": "Строительный контроль с помощью БАС | Паровые энергетические котлы, оборудование ПГУ и ГТУ ТЭС. | Инженерные сети и системы, основы технической эксплуатации объектов строительства | Основы технологий информационного моделирования | Специальные строительные материалы энергетических объектов | Архитектурно-строительные и конструктивные решения энергетических объектов | Основы централизованного теплоснабжения | Паротурбинные ТЭС, природоохранные технологии на ТЭС, режимы работы и эксплуатация ТЭС | Тепломеханическое и вспомогательное оборудование электростанций | Проектирование ТЭС, инжиниринг, организация и управление строительством ТЭС", "career": "Выпускники работают в строительстве и ЖКХ (проектирование и эксплуатация объектов теплоэнергетики и теплотехники), электроэнергетике, архитектурно‑строительном проектировании, а также в сфере управления проектами по сооружению объектов атомной энергии. Они заняты на тепловых и атомных электростанциях, объектах малой и возобновляемой энергетики, в котельных, на энергоблоках, парогазовых и газотурбинных установках. Среди направлений деятельности — работа с паровыми и газовыми турбинами, парогенераторами АЭС, тепло‑ и массообменными аппаратами, тепловыми сетями и вспомогательным энергетическим оборудованием.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10112", "passing": "216"}, {"id": "10113", "name": "Моделирование процессов в ядерных реакторах", "level": "Бакалавриат", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 474000, "exam": "Информатика (по выбору), Физика, Математика (по выбору), Русский язык", "about": "Программа формирует инженерные навыки для разработки, расчёта и обоснования безопасности оборудования ядерных энергетических реакторов. Практические занятия проходят в трёх формах: лабораторный физический эксперимент, численное моделирование и аналитическое решение задач. Студенты работают на уникальном оборудовании — гидродинамическом и теплофизическом стенде с параметрами реактора, подкритическом стенде, — а также осваивают программные комплексы атомной отрасли, изучая нейтронную физику, теплогидравлику, динамику и прочность в рамках единого подхода.", "learn": "Теплообмен | Устройство ядерных ректоров и АЭС | Термодинамика | Ядерная и нейтронная физика | Моделирование напряженно-деформированного состояния механических систем | Основы обеспечения безопасности АЭС", "career": "Выпускники работают в научно‑исследовательских институтах, на предприятиях атомной отрасли и экспериментальных площадках: проводят исследования нейтронно‑физических и теплофизических процессов, проектируют и разрабатывают ядерные энергетические и исследовательские установки, обосновывают их безопасность. Востребованы в проектных бюро и инженерных центрах, где создают конструкции установок и совершенствуют технические решения, а также участвуют в тестировании компонентов и систем на испытательных стендах.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10113", "passing": ""}, {"id": "10114", "name": "Энергообеспечение и инженерные системы зданий и сооружений", "level": "Бакалавриат", "inst": "ИЭВТ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Русский язык, Информатика (по выбору), Физика, Математика (по выбору), Химия (по выбору)", "about": "Программа направлена на подготовку проектировщиков инженерных систем и ТИМ‑специалистов — профессионалов по внедрению технологий информационного моделирования (ТИМ) в строительной отрасли. Востребованность таких специалистов растёт из‑за активного перехода отрасли на цифровые технологии. Выпускники научатся создавать цифровые модели зданий и их инженерных систем на этапе проектирования, выполнять инженерный анализ и оптимизировать ключевые показатели — в т. ч. энергопотребление и энергоэффективность объектов.", "learn": "Отопление, вентиляция и кондиционирование | Тепло- и газоснабжение зданий и сооружений | Тепломассообмен и тепломассообменное оборудование предприятий | Нетрадиционные и возобновляемые источники энергии | Основы конструирования и производства теплообменного оборудования | Проектирование инженерных систем зданий и сооружений | Основы математического моделирования процессов формирования микроклимата", "career": "Выпускники работают в сфере проектирования, конструирования и эксплуатации технических средств производства и применения теплоты: на тепловых и атомных электростанциях, объектах малой и возобновляемой энергетики, в ЖКХ. Они заняты в системах отопления, вентиляции, кондиционирования, водоснабжения и теплоснабжения, включая тепловые сети и пункты, котельные установки, тепло‑ и массообменные аппараты. Также трудоустраиваются на предприятиях, обслуживающих холодильные установки, тепловые насосы, компрессорное оборудование и системы газоснабжения.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10114", "passing": "216"}, {"id": "10115", "name": "Системы теплоэнергоснабжения городов", "level": "Бакалавриат", "inst": "ИЭВТ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Физика, Химия (по выбору), Информатика (по выбору), Русский язык, Математика (по выбору)", "about": "Программа готовит специалистов по проектированию и эксплуатации систем тепло-, электро-, газо‑ и водоснабжения для городов и промышленных предприятий. Выпускники изучают современные энергетические инфраструктуры, учатся анализировать и разрабатывать схемы энерго‑ и водоснабжения, обеспечивать их функционирование и рационально использовать топливно‑энергетические ресурсы. Они осваивают технико‑экономическое обоснование технических решений, оценивают энергоэффективность объектов и внедряют перспективные технологии для оптимизации работы городских инженерных систем.", "learn": "Котельные установки и парогенераторы | Цифровые двойники в системах теплоснабжения | Экология города и технологии защиты окружающей среды | Современные методы получения и использования холода | Энерготехнологическое оборудование предприятий | Электрооборудование и электроснабжение городов, энергетические системы обеспечения жизнедеятельности городов | Энергетические балансы и схемы теплоснабжения городов | Разработка и эксплуатация городских инженерных сиcтем, технические средства и системы автоматизации городских инженерных систем | Нагнетатели и тепловые двигатели | Источники и системы теплоснабжения", "career": "Выпускники работают в сфере строительства и жилищно‑коммунального хозяйства (проектирование и эксплуатация объектов теплоэнергетики и теплотехники), а также в электроэнергетике. Их профессиональная деятельность связана с тепловыми сетями и системами теплоснабжения, газоснабжения, водоснабжения и водоотведения, электроснабжения городов. Они заняты в организациях, обслуживающих системы холодоснабжения, компрессорные и холодильные установки, тепловые насосы, системы кондиционирования воздуха, вспомогательное теплотехническое оборудование, тепло‑ и массообменные аппараты. Выпускники заняты на объектах возобновляемой энергетики и в компаниях, внедряющих системы защиты окружающей среды.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10115", "passing": "216"}, {"id": "10116", "name": "Информационные системы и технологии в энергетике и промышленности", "level": "Бакалавриат", "inst": "ИЭВТ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Русский язык, Информатика (по выбору), Физика, Химия (по выбору), Математика (по выбору)", "about": "Основное внимание уделяется интеграции информационных систем в управление энергетическими ресурсами, что включает в себя автоматизацию процессов, мониторинг и анализ данных, а также разработку программного обеспечения, необходимого для оптимизации работы энергетических установок. Студенты изучают методы моделирования и прогнозирования, что позволяет им принимать обоснованные решения в условиях динамичного рынка энергетических услуг. Ключевыми аспектами программы являются также вопросы устойчивого развития и энергоэффективности: внедрение инновационных технологий, участие в проектах по модернизации устаревших систем.", "learn": "Участие в проектах по модернизации и обновлению устаревших технологий | Разработка систем управления и контроля за энергетическими ресурсами | Выполнение научных исследований и разработка новых технологий в области энергетики | Анализ и оптимизация процессов теплоэнергетики и теплотехники | Автоматизация процессов сбора и обработки данных в энергетических установках | Разработка и внедрение программного обеспечения для управления энергетическими системами | Мониторинг и диагностика работы энергетических систем | Проектирование и внедрение информационных систем для повышения энергоэффективности", "career": "Специалисты могут работать в следующих сферах: - энергетические компании и холдинги; - научно-исследовательские учреждения; - предприятия электроэнергетики и теплоэнергетики; - консалтинговые компании, предоставляющие услуги в области энергетики; - государственные органы, занимающиеся регулированием энергетических ресурсов; - производственные предприятия, нуждающиеся в оптимизации энергетических процессов.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10116", "passing": "227"}, {"id": "10118", "name": "Новые технологии и материалы в атомной энергетике и промышленности", "level": "Бакалавриат", "inst": "ИЭВТ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 474000, "exam": "Химия (по выбору), Русский язык, Математика (по выбору), Физика, Информатика (по выбору)", "about": "Образовательный процесс выстроен вокруг комплексного изучения всех этапов жизненного цикла атомных станций и сопутствующего оборудования. Особое внимание уделяется глубокому освоению профильных инженерных дисциплин, связанных с проектированием и эксплуатацией основного оборудования АЭС: ядерных реакторов, парогенераторов и турбомашин. Студенты осваивают сложные физико-химические процессы, протекающие в оборудовании, учатся методам защиты от ионизирующих излучений и изучают теорию переноса нейтронов для понимания физики работы реактора. Параллельно с профессиональным блоком происходит развитие компетенций в области естественных наук и математического моделирования.", "learn": "Разработка и соблюдение технологических регламентов эксплуатации ядерных энергетических установок и вспомогательных систем | Контроль за надёжностью и безопасностью работы оборудования, проведение диагностики и анализа причин возможных отказов | Обеспечение радиационной защиты персонала и окружающей среды, а также организация безопасного обращения с радиоактивными веществами и отходами | Применение методов математического моделирования для прогнозирования поведения материалов и физических процессов в оборудовании АЭС | Проведение инженерных расчётов и моделирование физических процессов, протекающих в активной зоне ядерного реактора и в тепломассообменном оборудовании | Решение задач, связанных с водоподготовкой и химическими режимами на атомных станциях для предотвращения коррозии оборудования | Выбор и испытание конструкционных материалов, предназначенных для работы в условиях высоких температур, давлений и ионизирующих излучений", "career": "На действующих АЭС в качестве эксплуатационного или ремонтного персонала; в проектно-конструкторских и инженерных организациях, разрабатывающих новое поколение реакторных установок и оборудования для них; в НИИ и лабораториях, занимающихся вопросами ядерной физики, теплофизики и материаловедения; на предприятиях атомного машиностроения, изготавливающих корпуса реакторов, парогенераторы, турбины и другое сложное оборудование; в организациях, осуществляющих контроль безопасности, надзор за состоянием оборудования и лицензирование в ядерной сфере; в компаниях, работающих в сфере ядерной медицины и промышленной радиографии, где применяются источники ионизирующего излучения.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10118", "passing": ""}, {"id": "10119", "name": "Автоматизация технологических процессов и производств", "level": "Бакалавриат", "inst": "ИЭВТ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Математика, Русский язык, Физика (по выбору), Информатика (по выбору)", "about": "Программа готовит квалифицированных специалистов по автоматизации технологических процессов и производств в нефтяной, газовой промышленности, энергетике и ресурсоснабжении. Обучение проходит на передовом оборудовании для автоматизации и управления. Студенты осваивают программирование встраиваемых систем, анализ данных, построение высокоэффективных и защищённых систем управления промышленными и энергетическими процессами. В том числе изучают применение методов искусственного интеллекта для оптимизации управления в указанных отраслях.", "learn": "Анализ данных | Программирование контроллеров | Системы искусственного интеллекта | Технологические процессы и оборудование промышленности и энергетики | Киберфизические системы | Информационная безопасность автоматизированных систем | Диагностика и надежность автоматизированных систем | Схемотехника автоматизированных систем", "career": "Выпускники трудоустраиваются в промышленности, строительстве, ЖКХ, электро‑ и теплоэнергетике, нефтяной и газовой отраслях. Занимаются автоматизацией производственных и инженерных процессов: внедряют и отлаживают автоматизированное оборудование, обслуживают системы автоматизации технологических процессов на промышленных объектах, в энергетике и городском хозяйстве, работают с инженерно‑техническими сооружениями и инфраструктурой коммунального хозяйства.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10119", "passing": "233"}, {"id": "10120", "name": "Инновационные электротехнические материалы и изделия", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Русский язык, Физика, Математика (по выбору), Информатика (по выбору)", "about": "Программа готовит специалистов для работы в области разработки и производства передовых материалов и изделий: проводов и кабелей, волоконной оптики, композиционных радиопоглощающих покрытий, наноматериалов для водородной энергетики, высокотемпературных оксидных и электротехнических материалов, электроизоляционной техники, керамики для электронной и медицинской техники. Обучение сочетает фундаментальные физические знания с современными технологиями и включает изучение IT‑аспектов. Выпускники освоят исследования, проектирование, конструирование, технологическую подготовку производства и испытания соответствующих изделий и материалов.", "learn": "Информационные технологии в электроматериаловедении | Основы электроизоляционной техники | Основы электросвязи и передачи информации по направляющим системам | Электрические и оптические кабели связи | Химия и физика диэлектриков | Основы кабельной техники, основы технологии изоляционных материалов", "career": "Алиса Выпускники работают в сфере образования и науки (научные исследования), строительства и ЖКХ (проектирование кабельного хозяйства), электроэнергетики, нефтегазовой отрасли (электроснабжение и эксплуатация объектов комплекса) и атомной промышленности (проектирование и эксплуатация электротехнического оборудования). Также они востребованы на промышленных предприятиях по производству волоконно‑оптических кабелей и электротехнических комплексов. Специалисты заняты в работе с электроэнергетическими системами и сетями, станциями и подстанциями, высоковольтным оборудованием, электроизоляционными материалами и системами защиты от перенапряжений.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10120", "passing": "213"}, {"id": "10121", "name": "Электротехнические комплексы беспилотных летательных аппаратов", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Математика (по выбору), Физика, Информатика (по выбору), Русский язык", "about": "Программа направлена на подготовку высококвалифицированных специалистов по разработке и эксплуатации беспилотных аппаратов — летательных, наземных и подводных. Обучающиеся осваивают проектирование источников питания, тяговых электроприводов и бортового электрооборудования для таких систем. В рамках программы углублённо изучаются электротехника, информационные технологии и технический английский язык.", "learn": "Компьютерное моделирование электромеханических преобразователей | Электромеханические системы | Беспилотные летательные аппараты | Моделирование электромеханических систем | Микропроцессорные системы управления БПЛА | Проектирование электромеханических преобразователей | Электронные устройства БПЛА, системы управления электронными устройствами БПЛА, системы электропитания БПЛА | Специальные электрические машины и электропривод на их основе | Конструирование печатных плат, электрических машин, электрооборудования автономных объектов", "career": "Выпускники работают в авиастроении — занимаются проектированием электротехнических комплексов для беспилотных летательных аппаратов. В судостроении они участвуют в создании электрооборудования для беспилотных подводных аппаратов. Также специалисты востребованы в различных отраслях промышленности: проектируют и эксплуатируют электротехнические комплексы, системы электроснабжения, решения для автоматизации и механизации производства. Их компетенции применимы при работе с бортовым электрооборудованием беспилотных систем, специальными электрическими приводами, источниками питания, микропроцессорными средствами управления и электронными преобразователями.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10121", "passing": "213"}, {"id": "10122", "name": "Экономика и управление на предприятиях электротехнической отрасли", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 420000, "exam": "Физика, Информатика (по выбору), Математика (по выбору), Русский язык", "about": "Программа готовит высококвалифицированных специалистов для работы в области электроэнергетики и электротехники с акцентом на экономические и управленческие задачи отрасли. Междисциплинарное обучение включает изучение технологических особенностей сферы, экономическое сопровождение создания и эксплуатации электротехнического оборудования, расчёт себестоимости и ценообразование, планирование производства, анализ финансово‑хозяйственной деятельности предприятий, обоснование инвестиционных программ, а также вопросы межотраслевой интеграции.", "learn": "Экономика и финансы предприятия | Стратегическое планирование и управление | Экономическая оценка инвестиций | Бизнес отовки интеллектуальных систем. Программа ориентирована на профессиональную и научно-исследовательскую деятельность в различных областях информатики и информационных технологий.", "learn": "Обеспечение информационной безопасности: защита данных, разработка криптографических методов и систем для предотвращения кибератак | Создание интеллектуальных систем: разработка решений для автоматизации процессов, робототехники и умных устройств | Управление базами данных: проектирование, администрирование и оптимизация распределенных и локальных баз данных | Разработка и внедрение программного обеспечения: создание приложений, алгоритмов и систем для решения задач в различных областях | Разработка и поддержка компьютерных сетей: настройка и обеспечение стабильной работы сетевых инфраструктур | Проектирование и оптимизация нейронных сетей: разработка моделей искусственного интеллекта для распознавания образов, обработки естественного языка и других задач | Анализ и обработка данных: работа с большими объемами информации, использование методов машинного обучения и статистики для извлечения полезных идей", "career": "Специалисты этого профиля работают в следующих областях: IT-компании: разработка программного обеспечения, создание интеллектуальных систем и приложений; научно-исследовательские центры: изучение и внедрение новых технологий в области искусственного интеллекта и анализа данных; банки и финансовые организации: анализ данных, разработка систем для обнаружения мошенничества и прогнозирования; медицинские учреждения: создание систем для диагностики, анализа медицинских данных и разработки персонализированных решений; телекоммуникационные компании: обеспечение работы сетей, защита данных и разработка интеллектуальных сервисов; государственные структуры: создание безопасных информационных систем.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10125", "passing": "271"}, {"id": "10127", "name": "Информационные технологии и искусственный интеллек 38/programm-trainings/10127", "passing": "248"}, {"id": "10128", "name": "Беспроводные технологии", "level": "Бакалавриат", "inst": "ИРЭ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 420000, "exam": "Физика, Математика (по выбору), Информатика (по выбору), Русский язык", "about": "Цель программы — подготовка инженеров в области проектирования и эксплуатации устройств и систем радиотехники и телекоммуникаций. Выпускники владеют навыками анализа радиоэлектронных схем и устройств, проектирования систем радиосвязи, радионавигации и обработки сигналов, а также используют современное программное обеспечение для моделирования. Программа ориентирована на применение знаний в сфере интернета вещей, телекоммуникаций, радиолокации и беспроводных сетей. Обучение сочетает фундаментальную подготовку в области электродинамики, теории сигналов и электроники с практикой в лабораториях и проектной деятельностью, развивая навыки командной работы и инженерного проектирования.", "learn": "Самостоятельно проводить экспериментальные исследования и использовать основные приемы обработки и представления полученных данных | Применять методы поиска, хранения, обработки, анализа и представления в требуемом формате информации из различных источников и баз данных, соблюдая требования информационной безопасности. | Понимать принципы работы современных информационных технологий и использовать их для решения задач профессиональной деятельности | Осуществлять сбор научно-технической информации для проведения оценочных расчетов отдельных блоков радиоэлектронных устройств (РЭУ) | Осуществлять разработку функциональных схем РЭУ и компьютерное моделирование отдельных блоков РЭУ | Разрабатывать математические модели радиоэлектронных устройств, подсистем радиоэлектронных систем и комплексов", "career": "Выпускники работают в телекоммуникационных компаниях (сотовая, спутниковая и оптоволоконная связь), в сфере радиоэлектроники и приборостроения, разрабатывая радиосистемы, антенные устройства и о т культурный код стран изучаемых языков. Выпускники готовы к реализации образовательных программ в учебных заведениях различного типа, а также к экспертно-аналитической деятельности в международной среде.", "learn": "Теория и методика межкультурного взаимодействия | Основы педагогического мастерства | Анализ и применение на практике действующих образовательных стандартов и программ | Теория изучаемых иностранных языков. | Процессы преподавания и изучения иностранных языков и культур | Разработка и адаптация учебных материалов по иностранным языкам | Применение современных приемов, организационных форм и технологий воспитания, обучения и оценки качества результатов обучения", "career": "Выпускники работают в школах, колледжах и вузах — преподают иностранные языки на уровнях основного и профессионального образования; в языковых центрах и онлайн‑школах — ведут курсы для детей и взрослых. Они востребованы в международных компаниях как лингвисты и переводчики, в научно‑исследовательских институтах — занимаются лингвистикой и педагогикой. Также строят карьеру в сфере межкультурного консалтинга, сопровождают внешнеэкономическую деятельность и участвуют в проектах международного гуманитарного сотрудничества.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10134", "passing": ""}, {"id": "10135", "name": "Разработка компьютерных технологий управления и математического моделирования", "level": "Магистратура", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Программа \"Разработка компьютерных технологий управления и математического моделирования в робототехнике и мехатронике\" знакомит с современными подходами к проектированию и внедрению интеллектуальных систем, а также с методами математического моделирования, которые позволяют оптимизировать процессы управления в сложных механических системах. Особое внимание уделяется развитию навыков программирования и работы с современными инструментами управления, что позволяет будущим специалистам эффективно решать задачи автоматизации и роботизации. Программа также акцентирует внимание на междисциплинарном подходе, объединяющем механические, электрические и информационные технологии.", "learn": "Новые методы теории автоматического управления, искусственного интеллекта и других научных направлений | Разработка экспериментальных образцов мехатронных и робототехнических систем, их модулей и подсистем | Проведение патентных исследований, сопровождающих разработку новых мехатронных и робототехнических систем | Организация и проведение экспериментов на действующих мехатронных и робототехнических системах, их подсистемах и отдельных модулях | Проведение теоретических и экспериментальных исследований в области разработки новых образцов и совершенствования существующих мехатронных и робототехнических систем | Анализ научно-технической информации в области разработки и исследования мехатронных и робототехнических систем | Поиск новых способов управления и обработки информации с применением методов искусственного интеллекта, нечёткой логики, методов мультиагентного управления", "career": "Выпускники могут работать в области проектирования, моделирования и эксплуатации мехатронных и робототехнических систем, разработки электромеханических и электрогидравлических приводов, сенсорных и инерциальных систем навигации, алгоритмов управления и элементов искусственного интеллекта для робототехники, создания автономных мобильных роботов и промышленных роботизированных комплексов, а также проведения инженерных исследований и внедрения цифровых технологий в автоматизированное производство. Они востребованы на предприятиях промышленной автоматизации и робототехники, в машиностроении, приборостроении, авиационно-космической отрасли и научно-исследовательских.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10135", "passing": ""}, {"id": "10137", "name": "Стратегическое управление качеством в организации", "level": "Магистратура", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Содержание программы сконцентрировано на глубоком освоении современных подходов, позволяющих интегрировать принципы менеджмента качества в общую стратегию развития компании. Обучение формирует комплексное видение, где качество рассматривается не как изолированная функция контроля, а как системный элемент, влияющий на экономические результаты, инновационный потенциал и риск-ориентированное мышление. Особое внимание уделяется инструментам, которые обеспечивают адаптивность системы качества к вызовам цифровой трансформации, включая использование передовых аналитических решений.", "learn": "Разработка и внедрение комплексных систем менеджмента качества | Проведение стратегического анализа организации для интеграции принципов качества во все бизнес-процессы | Организация и руководство проектами перестройки бизнес-процессов, направленными на повышение эффективности и снижение потерь | Организация и руководство проектами перестройки бизнес-процессов, направленными на повышение эффективности и снижение потерь | Проведение внутренних проверок и аудита систем менеджмента для оценки их результативности и соответствия установленным целям", "career": "Выпускники работают в: отделах управления качеством, развития и стандартизации крупных промышленных и сервисных компаний; органах по сертификации продукции, систем менеджмента и услуг; консалтинговых компаниях, специализирующихся на внедрении систем менеджмента и организационном развитии; государственных структурах, занимающихся контролем, надзором и техническим регулированием; научно-исследовательских и проектных институтах в сфере методологии менеджмента качества; в качестве руководителей проектов и бизнес-аналитиков в различных отраслях, где востребованы системное мышление и процессный подход.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10137", "passing": ""}, {"id": "10139", "name": "Мегатренды международного энергетического бизнеса", "level": "Магистратура", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 160000, "exam": "Вступительные испытания по профилю", "about": "В рамках программы развивается компетенция прогнозно-аналитической работы, где политико-правовые исследования сочетаются с пониманием экономических механизмов и дипломатических практик. Особое внимание уделяется освоению инструментов управления рисками, обеспечения безопасности критической инфраструктуры и искусству ведения сложных международных переговоров.", "learn": "Анализ долгосрочных глобальных тенденций | Планирование и реализация коммуникационных стратегий | Оценка рисков и угроз для объектов критической инфраструктуры энергетического сектора, с предложением мер по их минимизации | Разработка и оценка решений в сфере энергетики, с учетом правовых аспекотов и экологических обязательств", "career": "Сферы для профессиональной реализации выпускников: энергетические и инжиниринговые корпорации; аналитические и консалтинговые центры, специализирующиеся на международных рынках и глобальных трендах; финансовые институты, инвестирующие в масштабные инфраструктурные проекты; международные организации, занимающиеся вопросами развития, торговли и экологии; научно-образовательные учреждения, где требуются компетенции в области мировой политики и энергетики.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10139", "passing": ""}, {"id": "10144", "name": "Электротехнические комплексы автономных объектов и электрического транспорта", "level": "Аспирантура", "inst": "", "campus": "Москва", "budget": 0, "contract": 1, "cost": 480000, "exam": "Конкурс научного портфолио абитуриента, Специальная дисциплина, соответствующая научной специальности программы подготовки в аспирантуре", "about": "Программа ориентирована на подготовку специалистов в области проектирования и исследования электротехнических комплексов автономных объектов и систем электрического транспорта. Обучающиеся изучают методы обеспечения надежного электроснабжения подвижных и автономных энергетических объектов, особенности работы электрических машин и преобразовательных устройств, а также принципы управления энергетическими установками транспортных систем. Особое внимание уделяется вопросам энергоэффективности, устойчивости режимов работы и интеграции современных источников энергии.", "learn": "Проектирование электротехнических комплексов автономных энергетических объектов | Разработка систем управления транспортными электроустановками | Моделирование энергетических систем электрического транспорта | Анализ режимов работы тяговых электроприводов | Обеспечение надежности и энергоэффективности автономных систем электроснабжения | Применение современных силовых преобразовательных устройств", "career": "Выпускники работают в организациях транспортного машиностроения, энергетических компаниях, научно-исследовательских центрах и проектных организациях. Они участвуют в разработке электрооборудования электрического транспорта, систем электроснабжения автономных объектов, тяговых электроприводов и преобразовательных установок. Выпускники также востребованы в авиационной, железнодорожной и городской транспортной инфраструктуре, а также в вузах и научных организациях в качестве преподавателей и исследователей.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10144", "passing": ""}, {"id": "10148", "name": "Энергетические системы и комплексы: моделирование и проектирование", "level": "Аспирантура", "inst": "", "campus": "Москва", "budget": 0, "contract": 2, "cost": 490000, "exam": "Конкурс научного портфолио абитуриента, Специальная дисциплина, соответствующая научной специальности программы подготовки в аспирантуре", "about": "Программа ориентирована на подготовку исследователей в области математического моделирования, проектирования и оптимизации энергетических систем и комплексов различного назначения. Рассматриваются методы анализа режимов работы энергетических установок, алгоритмы выбора оптимальных параметров оборудования, вопросы повышения эффективности и надежности энергетических систем. Значительное внимание уделяется цифровым технологиям моделирования энергетических процессов и разработке инновационных решений для современных электростанций и энергокомплексов.", "learn": "Разработка математических моделей энергетических систем и комплексов | Оптимизация параметров энергетического оборудования | Применение цифровых инструментов анализа режимов энергоустановок | Исследование надежности энергетических комплексов | Оценка технико-экономической эффективности энергетических решений | Проектирование энергетических систем различного назначения", "career": "Выпускники работают в проектных организациях, научно-исследовательских институтах и энергетических компаниях. Профессиональная деятельность связана с математическим моделированием энергетических процессов, разработкой цифровых моделей электростанций и энергокомплексов, оптимизацией режимов работы оборудования и повышением эффективности энергетических систем. Выпускники востребованы в инжиниринговых центрах, энергетическом машиностроении и образовательных организациях высшего образования.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/10148", "passing": ""}, {"id": "10149", "name": "Котлы, камеры сгорания, парогенераторы АЭС и их вспомогательные элементы", "level": "Аспирантура", "inst": "", "campus": "Москва", "budget": 0, "contract": 2, "cost": 490000, "exam": "Конкурс научного портфолио абитуриента, Специальная дисциплина, соответствующая научной специальности программы подготовки в аспирантуре", "about": "Программа направлена на подготовку исследователей в области разработки, расчета и совершенствования котельных установок, камер сгорания и парогенераторов тепловых и атомных электростанций. Рассматриваются процес
