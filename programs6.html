<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Образовательные программы МЭИ</title>
<style>
  :root{
    --blue:#0a3d7a; --blue-d:#072c59; --red:#e1251b; --ink:#1c2533;
    --muted:#667085; --line:#e6e9ef; --bg:#f5f7fb; --card:#fff;
    --radius:16px; --shadow:0 4px 18px rgba(13,38,76,.07);
    --shadow-h:0 10px 30px rgba(13,38,76,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       color:var(--ink);background:transparent;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  .head h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  .head p{margin:0 0 22px;color:var(--muted);font-size:15px;max-width:760px}

  /* Tabs */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
       font-size:15px;font-weight:600;padding:11px 20px;border-radius:999px;cursor:pointer;
       transition:.18s;display:flex;align-items:center;gap:9px}
  .tab .cnt{font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);
            padding:2px 9px;border-radius:999px;transition:.18s}
  .tab:hover{border-color:#c7d2e3}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:var(--shadow)}
  .tab.active .cnt{background:rgba(255,255,255,.22);color:#fff}

  /* Controls */
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search{position:relative;flex:1;min-width:240px}
  .search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:12px;
       font-size:15px;background:var(--card);outline:none;transition:.18s}
  .search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,61,122,.12)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .filt{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;
        padding:8px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:#c7d2e3;color:var(--ink)}
  .chip.active{color:#fff;border-color:transparent}

  /* Institute section */
  .inst{margin:30px 0 0}
  .inst-h{display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:15px 20px;flex-wrap:wrap;
          background:linear-gradient(135deg,var(--blue),var(--blue-d));border-radius:14px;
          box-shadow:0 6px 20px rgba(10,61,122,.18);border-left:6px solid var(--red)}
  .inst-badge{font-size:15px;font-weight:800;color:var(--blue);background:#fff;padding:6px 13px;
              border-radius:9px;letter-spacing:.02em}
  .inst-name{font-size:19px;font-weight:700;letter-spacing:-.01em;color:#fff}
  .inst-count{font-size:13px;color:#fff;font-weight:700;margin-left:auto;
              background:rgba(255,255,255,.18);padding:5px 13px;border-radius:999px}

  /* Cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
        display:flex;flex-direction:column;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,#0a3d7a);
                opacity:0;transition:.18s}
  .card:hover{box-shadow:var(--shadow-h);transform:translateY(-3px);border-color:transparent}
  .card:hover::before{opacity:1}
  .card .tag{align-self:flex-start;font-size:11px;font-weight:800;color:var(--ac,#0a3d7a);
             background:color-mix(in srgb,var(--ac,#0a3d7a) 12%,#fff);padding:4px 9px;border-radius:6px;margin-bottom:11px}
  .card h3{font-size:16px;font-weight:700;margin:0 0 14px;line-height:1.32;letter-spacing:-.01em}
  .card .facts{margin-top:auto;display:flex;flex-direction:column;gap:7px;font-size:13px}
  .fact{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
  .fact b{color:var(--ink);font-weight:700;text-align:right}
  .more{margin-top:15px;font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px}
  .more svg{transition:.18s}
  .card:hover .more svg{transform:translateX(3px)}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}

  /* Modal */
  .ov{position:fixed;inset:0;background:rgba(10,25,50,.55);backdrop-filter:blur(3px);
      display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
  .ov.show{display:flex}
  .modal{background:#fff;max-width:760px;width:100%;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.3);
         overflow:hidden;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .m-head{padding:26px 30px 22px;color:#fff;position:relative;background:linear-gradient(135deg,var(--ac,#0a3d7a),color-mix(in srgb,var(--ac,#0a3d7a) 60%,#072c59))}
  .m-head .lv{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
  .m-head h2{margin:8px 0 12px;font-size:23px;font-weight:800;line-height:1.22;padding-right:30px}
  .m-head .inst-line{font-size:13.5px;opacity:.92;font-weight:600}
  .x{position:absolute;top:18px;right:18px;width:36px;height:36px;border:none;border-radius:50%;
     background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;line-height:1;transition:.15s}
  .x:hover{background:rgba(255,255,255,.32)}
  .m-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line)}
  .m-stat{background:#fbfcfe;padding:16px 18px}
  .m-stat .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .m-stat .v{font-size:17px;font-weight:800;color:var(--ink)}
  .m-body{padding:8px 30px 30px}
  .sect{padding-top:22px}
  .sect h4{font-size:14px;font-weight:800;color:var(--blue);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sect h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
  .sect p{margin:0;color:#33405a;font-size:14.5px;line-height:1.62}
  .llist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .llist li{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13.5px;color:#33405a}
  .exam{background:#fff7f6;border:1px solid #ffe0dc;border-radius:12px;padding:14px 16px;font-size:14px;color:#5a2b27}
  .m-foot{padding:0 30px 30px}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--blue);color:#fff;text-decoration:none;
       font-weight:700;font-size:15px;padding:13px 24px;border-radius:12px;transition:.18s}
  .btn:hover{background:var(--blue-d)}
  body.lock{overflow:hidden}

  @media(max-width:600px){
    .head h1{font-size:24px}
    .grid{grid-template-columns:1fr}
    .m-head,.m-body,.m-foot{padding-left:20px;padding-right:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Образовательные программы МЭИ</h1>
    <p>Бакалавриат, магистратура и аспирантура для иностранных студентов. Выберите уровень обучения и институт — нажмите на программу, чтобы узнать подробности.</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="controls">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Поиск по названию программы…">
    </div>
    <div class="filt" id="filt"></div>
  </div>

  <div id="content"></div>
</div>

<div class="ov" id="ov">
  <div class="modal" id="modal"></div>
</div>

ежотраслевая интеграция, планирование производства и анализ финансово‑хозяйственной деятельности энергопредприятий.", "learn": "Энергосбережение в теплоэнергетике и теплотехнологии | Финансы, бухгалтерский учет | Основы энергетического бизнеса | Экономическая оценка инвестиций | Цифровые технологии в экономических расчетах | Экономика предприятия, экономика отрасли | Планирование на предприятии | Экономический анализ и диагностика финансово-хозяйственной деятельности | Стратегическое планирование", "career": "Выпускники работают в строительстве и ЖКХ (проектирование и эксплуатация объектов теплоэнергетики и теплотехники), в электроэнергетике, а также в сфере сквозных профессиональных задач по повышению энергетической эффективности. Они востребованы в финансово‑экономических и инвестиционных подразделениях энергетических предприятий, компаниях по проектированию, монтажу и обслуживанию энергообъектов, планово‑экономических отделах промышленных предприятий с собственным энергохозяйством, проектных и научно‑исследовательских институтах, а также в государственных органах энергетического и технологического надзора.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1122", "passing": "233"}, {"id": "1125", "name": "Энергетика предприятий и водородные технологии", "level": "Бакалавриат", "inst": "ИЭВТ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 420000, "exam": "Химия (по выбору), Физика, Русский язык, Информатика (по выбору), Математика (по выбору)", "about": "Программа направлена на подготовку специалистов в области разработки, исследования и эксплуатации систем и комплексов энергообеспечения предприятий промышленности и входящего в их состав оборудования, способных с применением современных информационных средств разрабатывать и внедрять на предприятиях инновационные технологии, обеспечивающие повышение эффективности выработки и использования энергии при производстве энергоемкой продукции, включая технологии энергосбережения, производства, транспортировки, хранения и использования водорода.", "learn": "Основы программирования | Компьютерное моделирование теплофизических процессов | Проектирование промышленных объектов | Технологические процессы и оборудование металлургических производств", "career": "Выпускники работают на промышленных предприятиях с собственным энергохозяйством (в т. ч. в металлургической отрасли), в компаниях, внедряющих энергосберегающие и водородные технологии (производство, транспортировка, хранение и использование водорода), в проектных организациях — занимаются проектированием промышленных объектов и энергосистем. Также в научно‑исследовательских и инжиниринговых центрах, на предприятиях энергетического машиностроения, в сервисных компаниях по обслуживанию оборудования и в отделах автоматизации производств, где применяют навыки программирования для повышения энергоэффективности.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1125", "passing": "227"}, {"id": "1127", "name": "Распределительные электрические сети", "level": "Бакалавриат", "inst": "ИЭЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 420000, "exam": "Физика, Математика (по выбору), Русский язык, Информатика (по выбору)", "about": "Образовательная программа «Распределительные электрические сети» направлена на практико‑ориентированную подготовку специалистов электросетевого комплекса (до 220 кВ включительно). Реализуется с применением целевого обучения в сотрудничестве с профильными организациями. Программа охватывает проектную и эксплуатационную деятельность, фокусируясь на изучении воздушных и кабельных линий электропередачи, силового оборудования трансформаторных подстанций, а также на анализе режимов работы распределительных электрических сетей.", "learn": "Релейная защита и автоматизация электроэнергетических систем | Электроэнергетические системы и сети | Электрическая часть ТЭЦ и подстанций систем электроснабжения | Системы электроснабжения | Электрические машины | Промышленная электроника | Электрические станции и подстанции | Техника безопасности и охрана труда в электроустановках | Токи короткого замыкания | Техника высоких напряжений | Техническое обслуживание и эксплуатация систем электроснабжения | Воздушные линии электропередачи и кабельные линии электропередачи | Проектирование электрических сетей", "career": "Выпускники работают в электросетевых компаниях и на энергетических объектах — занимаются эксплуатацией и проектированием распределительных сетей, воздушных и кабельных линий электропередачи, трансформаторных подстанций. Трудоустраиваются в диспетчерские службы для управления электросетями, в организации по диагностике и оценке состояния силового оборудования (трансформаторов, коммутационных устройств, средств компенсации реактивной мощности, устройств релейной защиты и автоматики). Также востребованы на электрических станциях и в компаниях, обеспечивающих надёжность и качество электроснабжения потребителей.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1127", "passing": "214"}, {"id": "1133", "name": "Электроэнергетика", "level": "Бакалавриат", "inst": "ИЭЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 420000, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Программа направлена на подготовку специалистов в области электроэнергетики. Обучение включает изучение физических основ функционирования и моделирования электроэнергетических систем, их режимов. Студенты осваивают проектирование систем, выбор параметров силового оборудования, систем автоматического управления и устройств релейной защиты и автоматики, а также вопросы изоляции и молниезащиты объектов. Подготовка проходит в специализированных аудиториях и современных лабораториях.", "learn": "Электротехническое материаловедение, электрические машины | Электроэнергетические системы и сети, автоматика электроэнергетических систем | Электрические станции и подстанции, электроснабжение | Релейная защита электроэнергетических систем | Теплоэлектростанции и атомные электростанции, электростанции на основе возобновляемых источников энергии | Электромагнитные и электромеханические переходные процессы в электроэнергетических системах | Вычислительные комплексы в электроэнергетике, расчеты релейной защиты электроэнергетических систем; | Компьютерные технологии решения задач проектирования | Физика молнии и молниезащита, испытательные и электрофизические установки высокого напряжения | Высоковольтные электротехнологии, электропередачи сверхвысокого напряжения", "career": "Выпускники работают в сфере электроэнергетики: на тепловых, атомных и электростанциях на основе возобновляемых источников энергии, в сетевых компаниях и диспетчерских центрах — управляют энергосистемами и эксплуатируют электрические сети. Заняты в проектировании сетей и подстанций, диагностике силового оборудования (трансформаторов, генераторов, линий электропередачи, распределительных устройств). Востребованы в организациях по релейной защите и автоматике, молниезащите и изоляции высоковольтного оборудования, а также в научно‑исследовательских и проектных институтах отрасли.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1133", "passing": "214"}, {"id": "1137", "name": "Гидроэлектростанции", "level": "Бакалавриат", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Русский язык, Физика, Математика (по выбору), Информатика (по выбору)", "about": "Образовательная программа направлена на подготовку инженеров для проектирования, строительства и эксплуатации гидротехнических сооружений и гидроэлектростанций. В процессе обучения студенты изучают гидравлику, гидрологию, возобновляемую энергетику и принципы работы гидротурбинного оборудования. Учебный процесс включает лабораторные работы на физических моделях, полевые практики на действующих ГЭС и компьютерное моделирование водно-энергетических режимов. Выпускники готовы к профессиональной деятельности в сферах гидроэнергетики и водного хозяйства", "learn": "Инженерная и компьютерная графика | Сопротивление материалов, конструкционное материаловедение | Теоретическая механика, теоретические основы электротехники | Электрические станции и подстанции | Электроэнергетические системы и сети | Метрология и информационно-измерительная техника | Техника высоких напряжений | Геодезия, инженерная геология и строительные материалы | ТЭС и АЭС, электростанции на основе возобновляемых источников энергии | Гидротехнические сооружения, электрическая часть гидроэнергетических установок", "career": "Выпускники работают на гидроэлектростанциях всех типов и гидроаккумулирующих электростанциях (ГАЭС), в организациях по проектированию, строительству и эксплуатации плотин, водозаборных и водосбросных сооружений, водохранилищ, водоводов и малых ГЭС. Задействованы на объектах гидроэнергетики — с гидротурбинным оборудованием, гидрогенераторами и системами автоматического управления технологическими процессами (АСУ ТП). Также трудятся в научно‑исследовательских институтах, государственных структурах и компаниях, занимающихся управлением энергохозяйством и развитием гидроэнергетики.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1137", "passing": "214"}, {"id": "1140", "name": "Энергоустановки на основе возобновляемых источников энергии", "level": "Бакалавриат", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Физика, Информатика (по выбору), Русский язык, Математика (по выбору)", "about": "Образовательная программа направлена на подготовку специалистов в области проектирования, эксплуатации и оптимизации энергоустановок, использующих солнечную, ветровую и другие возобновляемые источники энергии. В процессе обучения студенты изучают принципы преобразования энергии, системы накопления энергии и методы управления распределенной генерацией. Учебный процесс сочетает цифровое моделиров ности. Студенты осваивают общетехнические и электротехнические дисциплины, а с 3 курса — специальные предметы по техногенной безопасности. Выпускники умеют проводить экологическую экспертизу предприятий энергетики, виброакустическую диагностику и электронный мониторинг окружающей среды, оценивать условия труда и риски для промышленных объектов, обеспечивать электробезопасность, проектировать системы контроля и защиты окружающей среды.", "learn": "Основы эргономики | Методы и средства защиты водной среды | Виброакустика | Электромеханические системы | Методы и средства защиты атмосферного воздуха | Математическое моделирование электромеханических систем | Электробезопасность | Химия и физика окружающей среды", "career": "Выпускники работают в сфере электро‑ и теплоэнергетики, на промышленных предприятиях, в строительных организациях (в т. ч. в области экологической экспертизы). Они заняты в обеспечении промышленной безопасности, защите человека и среды обитания от антропогенного воздействия, обслуживании электрического хозяйства предприятий — работе с электрооборудованием низкого и высокого напряжения, электротехническими установками и сетями. Специалисты участвуют в реализации электротехнических проектов, контролируют опасные технологические процессы в энергетике и обеспечивают безопасность персонала предприятий энергетики и организаций с собственным электрохозяйством.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1145", "passing": "213"}, {"id": "1154", "name": "Электромеханика, электрические и электронные аппараты", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 135, "cost": 420000, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Программа готовит специалистов для цифровой электроэнергетики и высокотехнологичной промышленности. Обучаясь на основе классической школы электромеханики, студенты осваивают современные инструменты: системы автоматизированного ampus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Информатика (по выбору), Математика (по выбору), Физика, Русский язык", "about": "Программа направлена на подготовку высококвалифицированных кадров в области эксплуатации электрооборудования и проектирования систем электроснабжения предприятий, организаций, учреждений, включая центры обработки данных и объекты ЖКХ. Выпускники обеспечивают бесперебойное электроснабжение с минимальными потерями энергии, владеют компетенциями по разработке, монтажу и эксплуатации электрохозяйства, а также управленческими навыками в сфере электроснабжения и электрохозяйства.", "learn": "Эксплуатация и ремонт электрооборудования | Электроэнергетические системы и сети промышленного электроснабжения | Электроснабжение потребителей и режимы | Переходные процессы в системах электроснабжения | Микропроцессорные средства в электроснабжении | Монтаж и наладка электрооборудования | Приемники электрической энергии", "career": "Выпускники работают в промышленности (проектирование и эксплуатация электроэнергетических систем и комплексов, автоматизация производства), в электроэнергетике и электротехнике, строительстве и ЖКХ (эксплуатация электрохозяйства и систем автоматизации объектов), в металлургическом и нефтегазовом производстве (эксплуатация и проектирование электротехнического оборудования). Они заняты на предприятиях с электрохозяйством, в организациях, обслуживающих системы электроснабжения зданий и предприятий, низко‑ и высоковольтное оборудование, системы учёта электроэнергии, противоаварийную автоматику и устройства ввода резерва.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1158", "passing": "213"}, {"id": "1160", "name": "Электрооборудование летательных аппаратов и автомобилей", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Математика (по выбору), Русский язык, Физика, Информатика (по выбору)", "about": "Программа готовит высококвалифицированных специалистов в области электрооборудования для летательных (в т. ч. космических), подводных аппаратов, автомобилей и иных автономных объектов гражданского, военного и специального назначения. Обучение ведут ведущие исследователи и разработчики инновационной техники. Акцент сделан на практической подготовке по электротехнике, электронике и информационным технологиям. Выпускники трудоустраиваются в высокотехнологичных отраслях, связанных с разработкой и эксплуатацией уникального электрооборудования для различных машин и аппаратов.", "learn": "Основы микропроцессорной техники | Конструирование электрооборудования автономных объектов | Электромеханические системы | Летательные аппараты, автомобили и электромобили и их системы | Основы конструирования машин | Проектирование систем электрооборудования автономных объектов", "career": "Выпускники работают в промышленности (проектирование и эксплуатация электротехнических комплексов и систем электроснабжения, автоматизация и механизация производства), электроэнергетике (в т. ч. в сфере малой и распределённой генерации), авиа‑, автомобиле‑ и судостроении, ракетно‑космической промышленности. Они заняты в проектировании электротехнического оборудования, работе с энергетическими установками, электроприводами автономных объектов (летательных аппаратов, автомобилей и др.), силовой и управляющей электроникой, микропроцессорными системами управления, электрическими и гибридными трансмиссиями, высокоскоростными электрическими машинами и системами генерации для малой энергетики.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1160", "passing": "213"}, {"id": "1162", "name": "Электропривод и автоматика", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 420000, "exam": "Физика, Информатика (по выбору), Русский язык, Математика (по выбору)", "about": "Программа готовит специалистов по разработке и проектированию современных систем электропривода — энергоэффективных и оснащённых интеллектуальными микропроцессорными системами управления. В ходе обучения студенты осваивают общеинженерные и электротехнические дисциплины, углублённо изучают информационные технологии: учатся математическому моделированию электроприводов и их систем управления, а также программированию средств управления. Выпускники смогут создавать решения для широкого спектра технических устройств — от роботов и станков с числовым программным управлением до лифтов, насосов и промышленного оборудования.", "learn": "Элементы систем автоматики | Микропроцессорные средства в электроприводе | Проектирование электротехнических устройств | Моделирование в технике и в электроприводе | Регулирование координат | Энергосбережение средствами электропривода | Электрический привод, логические системы управления электроприводов | Основы микропроцессорной техники", "career": "Выпускники работают в различных отраслях промышленности — занимаются проектированием и эксплуатацией электротехнических комплексов, автоматизацией и механизацией производства. Их компетенции востребованы в нефтегазовой сфере (обслуживание приводов нефте‑ и газоперекачивающего оборудования), в производстве медицинской и авиационной техники (в т. ч. силовых установок беспилотных летательных аппаратов). Специалисты трудятся с электрическими приводами подъёмных механизмов, лифтов, экскаваторов, систем вентиляции и кондиционирования, робототехнических комплексов. Также они задействованы в разработке и обслуживании электрических машин, трансформаторов, электромеханических систем и энерго‑ и ресурс", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1162", "passing": "213"}, {"id": "1164", "name": "Электротехнология", "level": "Бакалавриат", "inst": "ИЭТЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 420000, "exam": "Русский язык, Физика, Математика (по выбору), Информатика (по выбору)", "about": "Программа направлена на подготовку специалистов для проектной деятельности в области электротехнологических установок и систем, включая их источники питания и системы управления. В рамках обучения студенты изучают принципы преобразования электроэнергии в другие виды энергии для технологического применения — в том числе электротермические, электросварочные, электрофизические и иные процессы. Акцент делается на системах автоматического управления, программировании микропроцессорных средств и математическом моделировании процессов. Выпускники востребованы в машиностроении, металлургии, электронной промышленности и смежных отраслях.", "learn": "Электротехнологии термообработки и сварки | Компьютерные методы проектирования | Электроснабжение и электрооборудование электротехнологических установок | Электротехнологические установки индукционного и диэлектрического нагрева | Системы автоматического управления электротехнологическими установками | Электротехнологические установки дугового нагрева и специальных видов нагрева | Проектирование электротехнологических установок с системами электропитания | Электротехнологические установки резистивного нагрева | Моделирование электротехнологических процессов | Микропроцессорные средства автоматизации в электротехнологии", "career": "Выпускники работают в промышленности — занимаются проектированием и эксплуатацией электротехнических комплексов, систем электроснабжения, автоматизацией и механизацией производства. В металлургическом производстве они налаживают и обслуживают электротехнологическое оборудование (электропечи, установки индукционного нагрева, дуговые и плазменные комплексы). В авиастроении проектируют антиобледенительные устройства, в нефтегазовой отрасли — системы обогрева трубопроводов, резервуаров и скважин. В строительстве и ЖКХ выпускники проектируют системы электроснабжения и автоматизации зданий, устройства обогрева и бытовые нагревательные приборы.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1164", "passing": "213"}, {"id": "1173", "name": "Котлы, камеры сгорания и парогенераторы АЭС", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Программа готовит специалистов по проектированию, наладке и обеспечению надёжной работы парогенерирующих установок и их вспомогательного оборудования: паровых и водогрейных котлов, котлов‑утилизаторов, парогенераторов АЭС, горелок, камер сгорания ГТУ и др. Студенты осваивают оборудование для промышленной теплоэнергетики (в т. ч. котлы для закачки пара в нефтяные пласты) и учатся снижать эмиссию вредных веществ. Обучение включает работу с отраслевыми программами Boiler Designer и Ansys CFX — с их помощью ведётся проектирование и исследование теплоэнергетического оборудования: паровых и газовых турбин, станционного оборудования и элементов парогенерирующих установок.", "learn": "Детали машин и основы конструирования | Паровые котлы, водогрейные котлы, котлы-утилизаторы | ТЭС, ТЭЦ, АЭС | Вспомогательные элементы энергетических установок | Котлы для повышения нефтеотдачи, котлы на биотопливе | Энергетические ядерные реакторы | Системы второго контура АЭС | Парогенераторы и реакторы АЭС", "career": "Выпускники работают на тепловых, теплоэлектроцентралях и атомных электростанциях — проектируют и обслуживают энергетические установки на органическом и ядерном топливе: паровые и водогрейные котлы, котлы‑утилизаторы, парогенераторы, камеры сгорания, горелки и прочее оборудование. Трудятся в проектных организациях — создают цифровые двойники оборудования, в монтажных и сервисных компаниях — выполняют пуско‑наладку, оптимизацию, диагностику и ремонт. Участвуют в научно‑исследовательских и опытно‑конструкторских работах в профильных институтах, а также разрабатывают оборудование для повышения нефтеотдачи пластов и работы на биотопливе.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1173", "passing": "215"}, {"id": "1177", "name": "Автоматизированные гидравлические и пневматические системы и агрегаты", "level": "Бакалавриат", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 420000, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Программа готовит специалистов по проектированию и технологии изготовления робототехнических комплексов, систем управления, гидравлических машин и приводов для оборудования наземного, морского и воздушного базирования (в т. ч. специального назначения). Студенты осваивают работу с программными расчётными комплексами (в т. ч. отечественной разработки) и применяют методы нейронных сетей для создания элементов искусственного интеллекта. Выпускники трудятся в машиностроительных КБ — разрабатывают насосное оборудование для ТЭС, АЭС, мелиоративных систем и разных отраслей промышленности, а также проектируют и эксплуатируют гидромеханическое оборудование ГЭС и ГАЭС.", "learn": "Гидроаппаратура | Объемно-роторные гидромашины | Технология гидромашиностроения | Гидравлические турбины | Насосное оборудование тепловых и атомных электростанций, лопастные насосы | Гидравлические приводы и системы автоматики | Пневматические системы и устройства", "career": "Выпускники работают: в производстве машин и оборудования (проектирование энергетического оборудования); в электроэнергетике (энергетическое машиностроение); в атомной промышленности (разработка и эксплуатация тепломеханического и теплообменного оборудования); в нефтегазовой отрасли (создание и обслуживание оборудования для газотранспортных систем). Также трудоустраиваются в сфере науки и образования. Занимаются гидравлическими турбинами, насосами, газо‑ и паротурбинными установками, теплообменниками, системами автоматики, вспомогательным оборудованием энергообъектов, а также диагностикой и ремонтом энергетического оборудования.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1177", "passing": "215"}, {"id": "1179", "name": "Атомные электростанции и установки", "level": "Бакалавриат", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 474000, "exam": "Русский язык, Физика, Информатика (по выбору), Математика (по выбору)", "about": "Программа обеспечивает инженерную подготовку специалистов для работы с ядерными энергетическими установками и технологиями. Обучение сочетает теоретическую подготовку с практическими занятиями — в физических и цифровых лабораториях. Студенты приобретают навыки решения комплексных задач: проектирования, эксплуатации, модернизации и вывода из эксплуатации объектов атомной энергетики. Практическая составляющая позволяет закрепить знания на действующих энергоблоках и профильных предприятиях.", "learn": "Ядерная и нейтронная физика | Турбомашины, парогенераторы, водоподготовка на АЭС | Ядерные энергетические реакторы | Теория переноса нейтронов | Термодинамика | Атомные электростанции | Физико-химические процессы в оборудовании АЭС | Защита от ионизирующих излучений", "career": "Выпускники работают в сфере образования и науки — преподают, занимаются научными исследованиями по ядерной энергетике и теплофизике. В атомной промышленности — на атомных электростанциях и профильных предприятиях: обслуживают и эксплуатируют оборудование (реакторы, турбины, насосы, парогенераторы и др.), работают с системами контроля, управления и безопасности, АСУТП. Занимаются радиационным контролем, обеспечением безопасной эксплуатации объектов, разработкой и соблюдением технической документации. Востребованы и в смежных отраслях промышленности, где применяются ядерные и теплофизические технологии.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1179", "passing": "239"}, {"id": "1185", "name": "Теплофизика", "level": "Бакалавриат", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 474000, "exam": "Физика, Математика (по выбору), Информатика (по выбору), Русский язык", "about": "Программа готовит специалистов‑теплофизиков с глубокой фундаментальной подготовкой и прикладными инженерными навыками для решения научных задач перспективной энергетики. Обучение развивает умение самостоятельно ставить и решать инженерные и научные задачи, находить нестандартные подходы к достижению целей. Выпускники готовы к успешной работе как в проектной, так и в научно‑исследовательской сфере.", "learn": "Термодинамика | Теория теплофизических свойств веществ, экспериментальное исследование свойств веществ | Численное решение задач теплофизики | Новые информационно-измерительные системы и технологии в теплофизике | Тепломассообмен, экспериментальное исследование тепломассообмена | Экспериментальное исследование тепломассообмена", "career": "Выпускники работают в сфере образования и науки — преподают, ведут научные исследования по ядерной энергетике и теплофизике. Востребованы в атомной промышленности: на атомных электростанциях, предприятиях по созданию и эксплуатации ядерных и теплофизических энергетических установок (в т. ч. термоядерных реакторов). Также находят применение в промышленности — в областях, связанных с теплофизическими процессами: при разработке и использовании устройств для выработки и преобразования тепловой и ядерной энергии, работе с элементами конструкций приборов и установок новой техники.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1185", "passing": "239"}, {"id": "1186", "name": "Термоядерные реакторы и плазменные установки", "level": "Бакалавриат", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 0, "exam": "Физика, Русский язык, Математика (по выбору), Информатика (по выбору)", "about": "Программа направлена на подготовку инженеров для решения задач конструирования и эксплуатации оборудования плазменных, термоядерных и гибридных реакторов и установок. Обучение проходит с привлечением опытных специалистов и базируется на работе с уникальной исследовательской инфраструктурой. В рамках программы студенты осваивают инженерные подходы к проектированию и обслуживанию специализированных установок, выполняют практические задания и выпускные работы на современной экспериментальной базе, углубляют профессиональные компетенции через прикладные задачи отрасли.", "learn": "Термоядерные экспериментальные реакторы | Нейтронная физика управляемого термоядерного синтеза | Магнитное удержание плазмы | Методы диагностики плазмы | Топливный цикл термоядерного реактора | Теплообмен и гидродинамика в термоядерных установках | Плазменная техника и технологии", "career": "Выпускники работают в научно‑исследовательских центрах и лабораториях, где проводят эксперименты с плазменными и термоядерными установками. Востребованы на профильных предприятиях — проектируют и конструируют оборудование для реакторов, в инженерных и конструкторских бюро — разрабатывают и модернизируют системы. Задействованы на экспериментальных площадках (тестируют и настраивают оборудование) и в эксплуатирующих организациях, где обеспечивают надёжную работу установок, выполняют техобслуживание и диагностику.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1186", "passing": ""}, {"id": "1191", "name": "Машины и технология высокоэффективных процессов обработки материалов", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 121, "cost": 420000, "exam": "Математика, Физика (по выбору), Русский язык, Информатика (по выбору)", "about": "Программа готовит высококвалифицированных специалистов для исследования и разработки технологий обработки материалов в машиностроении. Студенты осваивают современные методы проектирования и моделирования (математического, физического и компьютерного) технологических процессов, изучают теорию материаловедения и физические основы высокоэффективных технологий обработки. Овладевают методами работы с концентрированными потоками энергии, включая электронно‑лучевые технологии. Знания применимы при создании и совершенствовании технологий изготовления изделий из металлов и сплавов.", "learn": "Материаловедение | Вычислительная техника в инженерных расчетах | Основы технологии машиностроения | Физические основы неразрушающих способов контроля | Технология и оборудование сварки плавлением | Проектирование специализированного оборудования и оснастки для обработки КПЭ | Физико-химические и металлургические процессы при обработке материалов КПЭ | Управление техническими системами | Восстановление деталей машин и элементов энергетического оборудования | Методы контроля механических свойств сварных соединений | Концентрированные потоки энергии и физические основы их генерации | Теоретические основы обработки материалов КПЭ, технология обработки материалов КПЭ", "career": "Выпускники работают на машиностроительных и авиакосмических предприятиях, в научно‑исследовательских и опытно‑конструкторских организациях, сервисных подразделениях. Занимаются проектированием технологической оснастки, разработкой и внедрением технологических процессов — в том числе электронно‑лучевых, лазерных, плазменных и аддитивных. Обеспечивают контроль качества и испытания изделий, выполняют монтаж, наладку, эксплуатацию, диагностику и ремонт оборудования. Управляют производственными проектами в машиностроении и энергетике, работают с нормативной документацией, системами стандартизации и методами неразрушающего контроля.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1191", "passing": "233"}, {"id": "1195", "name": "Динамика и прочность машин, приборов и аппаратуры", "level": "Бакалавриат", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 420000, "exam": "Физика (по выбору), Русский язык, Математика, Информатика (по выбору)", "about": "Программа готовит специалистов по обеспечению механической надёжности и безопасности конструкций технических объектов на всех стадиях жизненного цикла — от проектирования до эксплуатации. Межотраслевая подготовка охватывает ключевые задачи: прочность, устойчивость, долговечность, оптимизация и живучесть элементов конструкций. Студенты осваивают механико‑математические дисциплины, приобретают компетенции для научно‑исследовательской, педагогической и проектно‑конструкторской деятельности. Особое внимание уделяется компьютерному моделированию и проектированию. Студенты работают с высокопроизводительными программными комплексами для решения задач в разных высокотехнологичных отраслях.", "learn": "Статистическая механика и теория надежности | Вычислительная механика и компьютерный инжиниринг | Нелинейные задачи механики сплошной среды | Оптимальное проектирование | Механика контактного взаимодействия и разрушения | CAD/CAE технологии | Устойчивость механических систем | Теория пластичности и ползучести | Механика композиционных материалов | Строительная механика машин | Механика материалов и конструкций", "career": "Выпускники востребованы в науке, образовании, строительстве, ЖКХ и широком спектре отраслей промышленности: атомной, ракетно‑космической, машиностроительной, автомобильной, авиационной, судостроительной и др. Работают над повышением надёжности, долговечности и виброзащиты конструкций, деталей и оборудования, снижением материалоёмкости. Выполняют расчётно‑экспериментальные исследования в области прикладной механики, проектируют новые технологии и технику для энергетики, металлургии, нефтегазового сектора, транспорта и строительства.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/1195", "passing": "233"}, {"id": "2029", "name": "Системы и средства автоматизации, интеллектуального управления и анализа данных", "level": "Бакалавриат", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 420000, "exam": "Математика, Русский язык, Информатика (по выбору), Физика (по выбору)", "about": "Программа готовит специалистов по разработке и эксплуатации систем автоматического управления, мехатронных и робототехнических систем, средств промышленной автоматизации и информационно‑аналитических систем. Студенты получают углублённую общеинженерную подготовку и осваивают современные методы: анализ данных, программирование, технологии искусственного интеллекта. Выпускники умеют проектировать и внедрять автоматизированные системы для решения прикладных задач в промышленности, энергетике и транспорте.", "learn": "Основы теории управления: теория автоматического управления (включая продвинутый уровень), управление в больших системах, методы идентификации объектов управления. | Навыки работы с системами автоматики и мехатронными устройствами: пневмоавтоматика, гидроавтоматика, основы мехатроники и их применение в технических системах. | Владение современными методами обработки информации: нейро‑нечёткие технологии, интеллектуальный и прикладной анализ данных, основы анализа текстовых данных, нейрокомпьютеры. | Практические навыки разработки ПО: программирование микроконтроллеров и контроллеров, разработка ПО систем управления, работа с системным ПО и автоматизированными системами. | Работа с ИТ‑инструментами и системами: информационные технологии, схемотехника систем управления и вычислительных машин, системы управления базами данных. | Методы исследования и оптимизации систем: моделирование систем управления, статистические методы в инженерных исследованиях, методы оптимизации процессов.", "career": "Выпускники работают в сфере связи и информационных технологий — настраивают и запускают базы данных, сопровождают и оптимизируют их функционирование, создают и модифицируют информационные системы, поддерживают инфокоммуникационные системы. В ракетно‑космической промышленности занимаются разработкой бортовой аппаратуры и автоматизацией конструкторско‑технологической подготовки производства. В различных отраслях промышленности обеспечивают соответствие продукции нормам и техническим условиям, выполняют метрологическое обеспечение, внедряют системы автоматизации и управления для повышения эффективности производства.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2029", "passing": "243"}, {"id": "2030", "name": "Интеллектуальные технологии управления в технических системах, обработка и анализ данных", "level": "Бакалавриат", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 2, "cost": 420000, "exam": "Физика (по выбору), Математика, Русский язык, Информатика (по выбору)", "about": "Цель программы – подготовка специалистов широкого профиля в области разработки и эксплуатации систем автоматического управления, информационно-аналитических систем. Преимуществом программы является ориентированность выпускников на решение прикладных задач с использованием современных методов управления, методов анализа данных, сред программирования и технологий искусственного интеллекта. Это преимущество достигается благодаря полученным фундаментальным теоретическим знаниям в сочетании с владением современными информационными технологиями.", "learn": "Моделирование систем управления | Нейро-нечеткие технологии в задачах управления | Идентификация объектов управления | Разработка программного обеспечения систем управления | Программное обеспечение автоматизированных систем | Функциональные узлы и схемотехника систем управления и вычислительных машин | Микроконтроллеры и микропроцессоры в системах управления | Статистические методы в инженерных исследованиях | Нейрокомпьютеры и их применение | Робототехника и гибкие автоматизированные производства | Интеллектуальный и прикладной анализ данных", "career": "Выпускники работают в сфере связи и информационных технологий: развёртывают и сопровождают базы данных, создают информационные системы, поддерживают работоспособность коммуникационных систем. В ракетно‑космической отрасли разрабатывают аппаратуру для космических систем и автоматизируют конструкторско‑технологическую подготовку производства. В промышленности обеспечивают соответствие продукции нормам, выполняют метрологическое обеспечение и внедряют системы автоматизации для повышения эффективности производства.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2030", "passing": "243"}, {"id": "2032", "name": "Корпоративные финансы", "level": "Бакалавриат", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 370000, "exam": "Обществознание (по выбору), Русский язык, Информатика (по выбору), Математика", "about": "Программа направлена на подготовку финансовых и инвестиционных аналитиков в корпоративных структурах, финансовых консультантов, способных принимать эффективные решения, касающиеся финансовых стратегий экономических субъектов. Профессиональные задачи выпускников: анализ и оценка результатов деятельности корпорации, оценка доходности компании в условиях риска, моделирование в области организации финансов компании, проведение финансового анализа, бюджетирование и управление денежными потоками экономических субъектов.", "learn": "Финансовая политика корпораций | Финансовый и управленческий учет | Финансовые рынки и институты | Оперативная финансовая работа в корпорациях | Международные стандарты финансовой отчетности | Корпоративное управление и страхование | Оценка активов корпорации | Комплексные решения корпоративного финансирования | Инвестиционные решения в организации", "career": "Выпускники работают в сфере финансов и экономики: в экспертно‑аналитических службах и центрах экономического анализа, в правительственном секторе и общественных организациях (анализ и прогнозирование социально‑экономических процессов); в компаниях по производству продукции и услуг (анализ спроса, планирование финансовых потоков); в банках и кредитных организациях, страховых и пенсионных фондах, инвестиционных фондах. Также востребованы в аудиторских и консалтинговых компаниях, на финансовых рынках (управление рисками), в экономических и финансовых службах организаций разных отраслей.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2032", "passing": "258"}, {"id": "2033", "name": "Цифровая экономика", "level": "Бакалавриат", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 370000, "exam": "Математика, Обществознание (по выбору), Информатика (по выбору), Русский язык", "about": "Программа направлена на подготовку специалистов в области цифровой экономики и бизнеса. Выпускники будут заниматься стратегическим планированием и интеграцией информационных систем и информационно‑коммуникационных технологий в бизнес‑процессы предприятий, исследовать и анализировать рынок IT‑систем, создавать и вести электронный бизнес. Они освоят сбор, обобщение и обработку больших данных, бизнес‑аналитику, мониторинг IT‑рынка, менеджмент IT‑проектов, а также прогнозирование и оптимизацию бизнес‑процессов на предприятии.", "learn": "Методы экспертных оценок и экономического прогнозирования | Электронная коммерция и цифровые рынки | Управление IT-проектами | Экономическая оценка инвестиций | Digital-маркетинг, блок-чейн технологии | Цифровая трансформация мировой экономики | Интеллектуальный анализ данных | Электронная коммерция и цифровые рынки | Компьютерное моделирование бизнес-процессов", "career": "Выпускники работают в сфере финансов и экономики: в экспертно‑аналитических службах и центрах экономического анализа, правительственных и муниципальных органах, общественных организациях. Востребованы в компаниях по производству продукции и услуг, банках, кредитных и страховых организациях (в т. ч. пенсионных и социальных фондах), инвестиционных фондах, на финансовых рынках. Задействованы в аудите, финансовом консультировании и консалтинге, а также в научно‑исследовательских институтах, IT‑компаниях, цифровых платформах и венчурных фирмах.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2033", "passing": "258"}, {"id": "2034", "name": "Экономика предприятий и организаций", "level": "Бакалавриат", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 370000, "exam": "Математика, Информатика (по выбору), Обществознание (по выбору), Русский язык", "about": "Программа готовит специалистов для экономической и управленческой работы на предприятиях разных отраслей. Выпускники готовы к расчётно‑экономической, научно‑исследовательской и организационно‑управленческой деятельности в экономических, финансовых, маркетинговых и аналитических службах. Они умеют планировать себестоимость и производство, управлять ценообразованием, составлять бизнес‑планы, обосновывать инвестиции, планировать бюджеты и анализировать финансово‑хозяйственную деятельность предприятия.", "learn": "Экономика отрасли | Маркетинговая деятельность предприятия | Экономика и управление качеством | Стратегическое планирование и управление | Финансы предприятия | Экономика энергетики | Управление затратами в организации | Методы эффективного использования кадрового потенциала предприятия", "career": "Выпускники работают: в финансовой сфере (банки, страхование, аудит, консалтинг, финансовые рынки); в экспертно‑аналитических службах и госорганах (анализ и прогнозирование социально‑экономических процессов); в промышленности и бизнесе (планово‑экономические службы, инвестиции, транспорт, логистика, торговля); в образовании и науке (вузы, НИИ). Они занимаются анализом, планированием, финансовым контролем, консультированием и научными исследованиями.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2034", "passing": "258"}, {"id": "2037", "name": "Информационное и программное обеспечение бизнес-процессов", "level": "Бакалавриат", "inst": "ИнЭИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 370000, "exam": "Информатика (по выбору), Обществознание (по выбору), Математика, Русский язык", "about": "Программа даёт фундаментальное образование в области информационно‑коммуникационных технологий, математики, экономики и менеджмента для энергетики и инновационной экономики. Выпускники осваивают анализ больших данных, информационную безопасность, облачные вычисления, системы бизнес‑аналитики и web‑технологии для управления бизнесом. Они готовы к проектной, аналитической и организационно‑управленческой деятельности, включая стратегическое планирование ИТ‑систем и экономическую оценку ИТ‑проектов.", "learn": "ИТ инфрастуктура для бизнеса | Стандартизация, сертификация и управление качеством программного обеспечения | Системы бизнес-аналитики | Облачные вычисления | Менеджмент в ИТ | WEB-технологии для управления бизнесом | Архитектура предприятия | Экономическая оценка ИТ проектов | Программирование, базы данных", "career": "Выпускники работают в банках, инвестиционных и консалтинговых компаниях, аналитических и маркетинговых организациях, структурах государственного и муниципального управления. Они востребованы на предприятиях энергетического комплекса, в крупных промышленных компаниях и организациях разных отраслей, активно внедряющих информационные технологии, — где занимаются анализом бизнес‑процессов, управлением ИТ‑системами, экономической оценкой ИТ‑проектов и оптимизацией информационных инфраструктур.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2037", "passing": "270"}, {"id": "2066", "name": "Реклама и связи с общественностью", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 370000, "exam": "Русский язык, Обществознание, Информатика (по выбору), Иностранный язык (по выбору), История (по выбору)", "about": "Цель образовательной программы — подготовка квалифицированных специалистов в области рекламы, маркетинга и связей с общественностью, обладающих современными знаниями о медиа-среде, навыками разработки и реализации эффективных коммуникационных стратегий, анализа рынка и целевой аудитории, управления брендом и имиджем, а также пониманием правовых и этических аспектов профессиональной деятельности для успешной работы в условиях динамично развивающихся медиа-индустрий.", "learn": "Корпоративные коммуникации: формирование внутреннего и внешнего имиджа компаний | Организация работы отделов рекламы и связей с общественностью в СМИ | Медиапроизводство: создание рекламного, информационного и контентного наполнения для различных каналов связи. | Методы исследования рынка и оценки эффективности рекламных рекламных кампаний | Умение разрабатывать креативные и эффективные рекламные кампании", "career": "Выпускники программы могут работать в рекламных агентствах, PR- и коммуникационных агентствах, маркетинговых отделах коммерческих компаний, а также в средствах массовой информации (телевидение, радио, интернет-издания). Они востребованы в пресс-службах и отделах по связям с общественностью, медиа-компаниях, исследовательских и аналитических центрах. Специалисты смогут занимать позиции менеджеров по рекламе и PR, бренд-менеджеров, маркетологов, медиапланеров, специалистов по коммуникациям, аналитиков рынка, а также участвовать в разработке и реализации рекламных и коммуникационных кампаний, проведении маркетинговых и социологических исследований и управлении имиджем организаций и СМИ.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2066", "passing": ""}, {"id": "2072", "name": "Перевод и переводоведение", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 370000, "exam": "Русский язык, История (по выбору), Литература (по выбору), Обществознание (по выбору), Иностранный язык", "about": "Образовательная программа направлена на подготовку высококвалифицированных переводчиков, владеющих двумя и более иностранными языками и глубокими знаниями в области межкультурной коммуникации. Учебный процесс сочетает фундаментальную гуманитарную подготовку с интенсивным практическим тренингом в области письменного и устного перевода, а также освоением современных информационных технологий в лингвистике. Студенты изучают теорию языка, особенности перевода текстов различных жанров (технических, юридических, художественных) и этику профессионального общения.", "learn": "Официальная и деловая документация на иностранных языках | Специальная терминология в различных профессиональных областях | История и культура стран изучаемого языка | Теория и практика перевода | Системы автоматизированного перевода | Лингвистические технологии в маркетинге и PR", "career": "Выпускники работают преподавателями иностранных языков в школах, вузах и языковых центрах; переводчиками (устными и письменными) в бюро переводов, международных компаниях и государственных структурах; специалистами по межкультурной коммуникации и сопровождению делегаций в сфере дипломатии и международного бизнеса; редакторами и локализаторами контента в СМИ и международных издательствах; гидами и менеджерами по международному туризму; сотрудниками отделов по работе с зарубежными партнёрами в коммерческих организациях.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2072", "passing": ""}, {"id": "2078", "name": "Графический дизайн", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 710000, "exam": "Литература, Рисунок, Портфолио, Русский язык", "about": "Программа готовит специалистов для работы в визуально‑информационной среде: в рекламе, интернет‑проектах, издательском деле, уличной навигации, упаковке и брендинге. В рамках обучения студенты осваивают проектирование фирменного стиля — от разработки логотипов и шрифтов до создания фирменных паттернов и деловой документации. Они учатся оформлять рекламные плакаты, веб‑сайты, сувенирную продукцию, упаковку и вывески, работают с фотографикой и иллюстрациями. Выпускники приобретают навыки визуализации идей, работы с графическими редакторами и современными дизайн‑инструментами, что позволяет им эффективно выделять бренды, организации и события в современной информационной среде.", "learn": "Владение техниками графики и типографики, подбор и адаптация шрифтов | Работа с фотографикой и иллюстрациями, в т. ч. для медиа‑ и арт‑дизайна | Проектирование фирменного стиля (разработка логотипов, фирменных шрифтов и паттернов, деловой документации, сувенирной продукции) | Создание визуальных решений для рекламы, веб‑ресурсов, печатных изданий (журналы, плакаты), упаковки, вывесок и уличной навигации | Дизайн объектов предметно‑пространственной среды: от полиграфии и товаров народного потребления до элементов навигации и интерьеров | Разработка визуальных коммуникаций и систем корпоративной идентификации | Использование профессиональных графических редакторов и инструментов цифрового дизайна", "career": "Выпускники работают в сфере образования и науки — в детских садах, школах, колледжах, вузах и центрах дополнительного образования, а также в научно‑исследовательских организациях; в сфере культуры и искусства — в дизайн‑студиях, художественных мастерских, музеях и культурно‑просветительских учреждениях; в IT‑компаниях и телекоммуникационных организациях; в архитектурных и проектных бюро, геодезических фирмах; в СМИ, издательствах и полиграфических компаниях; на предприятиях лёгкой и текстильной промышленности — как дизайнеры одежды и текстиля; в автомобилестроении — в отделах промышленного дизайна; а также в компаниях разных отраслей — на позициях дизайнеров широкого профиля.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2078", "passing": ""}, {"id": "2079", "name": "Дизайн интерьера", "level": "Бакалавриат", "inst": "ГПИ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 710000, "exam": "Литература, Портфолио, Русский язык, Рисунок", "about": "Цель программы – обеспечение качественной подготовки профессионалов в области дизайна, которые на основе теоретических знаний и практических навыков способны осуществлять художественную, проектную деятельность в области создания дизайнерской продукции, проектирования объектов дизайна, решения дизайн-задач.", "learn": "Разработка комплексных дизайн‑проектов: от концепции до технической документации и финальной визуализации | Разработка дизайн‑решений в сферах графического, интерьерного, промышленного, медиа‑ и арт‑дизайна | Создание систем визуальной коммуникации и корпоративной идентификации — включая навигацию и фирменные стили | Подбор отделочных и декоративных материалов с учётом их функциональных и эстетических свойств | Проектирование предметно‑пространственной и архитектурно‑дизайнерской среды (жилые и общественные помещения, объекты медиасреды и др.) с учётом утилитарных и эстетических потребностей | Планировка и зонирование пространств, проектирование инженерных систем (освещение, вентиляция и т. д.) в контексте дизайна интерьера | Владение программами 3D‑визуализации и проектирования для создания эскизов, чертежей и рендеров", "career": "Выпускники работают в образовательных и научных организациях (детсады, школы, вузы, НИИ), учреждениях культуры и искусства (музеи, галереи, дизайн‑студии), IT‑компаниях и телеком‑организациях. Востребованы в архитектурных и проектных бюро, СМИ, издательствах и полиграфических предприятиях. Также они востребованы на предприятиях лёгкой и текстильной промышленности (дизайн одежды и текстиля), в автомобилестроении (промышленный дизайн) и в компаниях разных отраслей — на позициях дизайнеров широкого профиля.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/2079", "passing": ""}, {"id": "8818", "name": "Математическое и программное обеспечение вычислительных машин и компьютерных сетей", "level": "Магистратура", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 408000, "exam": "Вступительные испытания по профилю", "about": "Углублённая программа подготовки даёт возможность освоить современные технологии программирования, различные языки и системы программирования, досконально разбираться в структуре современных операционных систем, баз данных и знаний, изучить архитектуры современных вычислительных машин, включая параллельные и распределенные системы, освоить сетевые технологии, методы искусственного интеллекта и технологии конструирования перспективных интеллектуальных систем различного назначения.", "learn": "Программная инженерия и системное программирование | Языки программирования, алгоритмы, библиотеки и пакеты программ | Математическое и программное обеспечение компьютерных сетей | Системы искусственного интеллекта и технологии разработки интеллектуальных систем | Математические модели сложных систем: теория, алгоритмы, приложения; математические и компьютерные методы обработки изображений", "career": "Выпускники программы работают в сфере связи, информационных и коммуникационных технологий — занимаются проектированием и разработкой ПО, тестированием программных решений, созданием и поддержкой информационно‑коммуникационных систем и баз данных. Они участвуют в разработке интернет‑ресурсов, системном программировании и работе с технологиями больших данных. Также специалисты востребованы в атомной промышленности — в подразделениях, где требуются компетенции в области ИТ‑обеспечения, цифровизации процессов и проектирования специализированных информационных систем.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8818", "passing": ""}, {"id": "8819", "name": "Математическое и компьютерное моделирование", "level": "Магистратура", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 408000, "exam": "Вступительные испытания по профилю", "about": "Программа направлена на подготовку высококвалифицированных специалистов в области прикладной математики и информатики, имеющих фундаментальное математическое образование и способных осуществлять математическое и компьютерное моделирование разнообразных физических, технологических, экономических, биологических и других процессов. Значительное внимание уделяется современным информационным технологиям, методам хранения, передачи и обработки информации, сетевым технологиям, использованию параллельных вычислительных систем.", "learn": "Математические методы и программное обеспечение защиты информации | Языки программирования, алгоритмы, библиотеки и пакеты программ | Математическое и информационное обеспечение экономической деятельности | Математическое и программное обеспечение компьютерных сетей | Математическое моделирование с использованием аппарата уравнений математической физики, теории вероятностей и математической статистики, дискретной математики", "career": "Выпускники программы заняты в следующих сферах: ракетно-космическая промышленность, информационные технологии и разработка программного обеспечения, телекоммуникации и информационно-коммуникационные системы, промышленная автоматизация, авиационная и энергетическая отрасли, научно-исследовательская и проектно-конструкторская деятельность, обработка и анализ данных, высокопроизводительные вычисления, системы информационной безопасности и криптографической защиты информации, а также математическое и компьютерное моделирование физических, технологических, экономических и биологических процессов.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8819", "passing": ""}, {"id": "8820", "name": "Информационные технологии и системы искусственного интеллекта", "level": "Магистратура", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 408000, "exam": "Вступительные испытания по профилю", "about": "Программа предназначена для подготовки высококвалифицированных специалистов, обладающих фундаментальными знаниями и практическими навыками в области информационных технологий, с особым акцентом на разработку и применение систем искусственного интеллекта. Обучение включает изучение теорий и методов искусственного интеллекта, машинного обучения, интеллектуальных систем, обработки больших данных, нейронных сетей, а также современных программных средств и платформ.", "learn": "Анализ больших данных | Моделирование и оптимизация информационных систем | Основы программирования в сфере ИИ и средств разработки | Машинное обучение | Нейронные сети и глубокое обучение | Обработка естественного языка | Основы искусственного интеллекта", "career": "Выпускники программы востребованы в IT-компаниях, научных центрах, исследовательских командах, а также в сферах робототехники, автоматизации, аналитики данных, технологий распознавания образов и обработки естественного языка.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8820", "passing": ""}, {"id": "8821", "name": "Цифровые технологии", "level": "Магистратура", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Программа магистратуры «Цифровые технологии» направлена на подготовку специалистов в области информационных технологий. Обучение включает проектирование и эксплуатацию вычислительной техники, компьютерных сетей, систем цифровой обработки информации и управления. Особое внимание уделяется вопросам компьютерной безопасности, работе с современными информационно-телекоммуникационными технологиями в условиях инновационного развития экономики.", "learn": "Управление развитием инфокоммуникационных систем организации | Обеспечение безопасности информационных систем на программном и аппаратном уровне | Работа с базами данных и системами обработки больших объемов информации | Разработка и модернизация программного обеспечения вычислительных систем, включая создание оригинальных алгоритмов и программных средств | Проектирование и оптимизация компьютерных сетей различной сложности с учетом современных технологий", "career": "Выпускники востребованы в сфере информационных и коммуникационных технологий. Они работают над проектированием и разработкой средств вычислительной техники, созданием информационных систем и их модернизацией. Специалисты могут заниматься разработкой программного обеспечения, администрированием баз данных, обеспечением безопасности компьютерных систем. Возможные должности включают системных программистов, администраторов информационных систем, разработчиков веб-приложений, специалистов по интеграции решений и поддержке информационно-коммуникационных сетей.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8821", "passing": ""}, {"id": "8825", "name": "Интеллектуальные технологии управления в технических системах, обработка и анализ данных", "level": "Магистратура", "inst": "ИВТИ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Программа направлена на подготовку специалистов в области разработки и эксплуатации современных технических систем автоматического управления и информационно-аналитических комплексов. Обучение включает работу с передовыми методами управления, анализа данных и программирования, а также освоение технологий искусственного интеллекта. Студенты учатся применять современные информационные технологии с учётом тенденций инновационного развития экономики. Выпускники также получают подготовку к научно-исследовательской деятельности, которая включает проведение исследований в сфере автоматизации процессов, разработку инновационных решений в области управления техническими системами.", "learn": "Системы управления, контроля, технического диагностирования, автоматизации и информационного обслуживания | Информационные и информационно-аналитические системы | Системы обработки и анализа данных, поддержки принятия решений | Методы и средства их проектирования, моделирования, экспериментальной обработки, подготовки к производству и техническому обслуживанию", "career": "- Связь, информационные и коммуникационные технологии (в сфере создания (модификации) и сопровождения информационных систем, поддержания в работоспособном состоянии с заданным качеством инфокоммуникационных систем и (или) их составляющих); - Ракетно-космическая промышленность (в сферах: разработки аппаратуры бортовых космических систем; проектирования, модификации и сопровождения информационных систем); - Сквозные виды профессиональной деятельности в промышленности.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8825", "passing": ""}, {"id": "8826", "name": "Гидроэнергетика и возобновляемые источники энергии", "level": "Магистратура", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 5, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Программа предназначена для подготовки высококвалифицированных инженеров и исследователей в области гидроэнергетики и использования возобновляемых источников энергии. Основная цель — сформировать у студентов комплексное понимание теоретических основ, технологий и методов эксплуатации гидроэнергетических объектов, а также навыки проектирования, моделирования и оптимизации энергетических систем с учетом экологических, экономических и технологических аспектов.", "learn": "Проектирование и эксплуатация гидроэлектростанций | Энергетическая безопасность и эффективность | Моделирование и автоматизация гидросистем | Теоретическая электроэнергетика и электроника | Гидроэнергетические установки и техно-экономика | Возобновляемая энергетика и интеграция систем | Экология и управление природными ресурсами | Электрические машины и трансформаторы", "career": "Выпускники программы смогут работать в энергетических компаниях, проектных институтах, научных и образовательных учреждениях, занимающихся разработкой и внедрением гидроэнергетических технологий, а также в сферах экологического мониторинга и управления природными ресурсами. Возможные должности: инженер-энергетик, специалист по эксплуатации гидроэлектростанций, разработчик автоматизированных систем, научный сотрудник.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8826", "passing": ""}, {"id": "8827", "name": "Исследование и проектирование автоматизированных гидравлических и пневмат. систем, машин и агрегатов", "level": "Магистратура", "inst": "ИГВИЭ", "campus": "Москва", "budget": 0, "contract": 3, "cost": 450000, "exam": "Вступительные испытания по профи гетике и теплофизике)", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8896", "passing": ""}, {"id": "8898", "name": "Теплофизика и молекулярная физика", "level": "Магистратура", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 498000, "exam": "Вступительные испытания по профилю", "about": "Цель программы — подготовка специалистов в области исследования и применения на практике явлений молекулярной физики, разработки, внедрения и контроля использования инновационных технологий в ядерной и тепловой энергетике.", "learn": "Атомные электрические станции, термоядерные реакторы и другие ядерные, теплофизические энергетические установки как объекты человеческой деятельности, связанной с их созданием и эксплуатацией | Разработка новых методов экспериментального и расчетно-теоретического исследований тепловых процессов | Теплофизические процессы, протекающие в устройствах для выработки, преобразования и использования тепловой и ядерной энергии, элементах конструкций приборов, аппаратов и установок | Новые информационно-измерительные системы и технологии в теплофизике", "career": "Профессиональная деятельность связана с исследованием теплообмена в элементах энергетических установок, экспериментальным и расчетным определением теплофизических свойств веществ, а также разработкой методик для получения надежных научных данных в области ядерной энергетики и теплофизики. Выпускники работают в сферах проектирования и конструирования, научных исследований и инженерного применения теплофизических процессов. Возможна деятельность в промышленности, атомной отрасли, а также в образовании и науке, включая профессиональное обучение и проведение исследований.", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8898", "passing": ""}, {"id": "8899", "name": "Физико-технические проблемы атомной энергетики", "level": "Магистратура", "inst": "ИТАЭ", "campus": "Москва", "budget": 0, "contract": 1, "cost": 498000, "exam ости энергетических процессов, а также на экологических аспектах использования различных видов топлива.", "learn": "Ядерные реакторы и энергетические установки, теплообменные аппараты | Вспомогательное оборудование, обеспечивающее функционирование энергетических объектов | Установки и аппараты по производству, преобразованию и потреблению различных форм энергии, в том числе: паровые и водогрейные котлы и котлы-утилизаторы, парогенераторы, камеры сгорания", "career": "Образование и наука (в сферах: профессионального обучения, профессионального образования, дополнительного образования; научных исследований); - Электроэнергетика (в сфере энергетического машиностроения) - Атомная промышленность (в сфере разработки и эксплуатации двигателей внутреннего сгорания, тепломеханического и теплообменного основного и вспомогательного оборудования) - Производство машин и оборудования (в сфере проектирования энергетического оборудования); - Сквозные виды профессиональной деятельности в промышленности (в сфере обеспечения безопасной эксплуатации оборудования, работающего под избыточным давлением)", "link": "https://studyinrussia.ru/ru/university-show/338/programm-trainings/8940", "passing": ""}, {"id": "8941", "name": "Газотурбинные, паротурбинные установки и двигатели", "level": "Магистратура", "inst": "ЭнМИ", "campus": "Москва", "budget": 0, "contract": 0, "cost": 450000, "exam": "Вступительные испытания по профилю", "about": "Подготовка высококвалифицированных специалистов, обладающих фундаментальными и прикладными знаниями, умениями и навыками для решения задач инженерных исследований и инженерного проектирования газотурбинных и паротурбинных установок.", "learn": "Современные технологии проектирования, эксплуатации и обслуживания энергетических установок | Вспомогательное оборудование, обеспечивающее функционирование стационарных и мобильных энергетических установок | Газотурбинные, паротурбинные, комбинированные установки и двигатели различного назначения, а также их компонен
