  <div id="detailView" style="display:none"></div>
</div>

<script>
const DATA = [
  {"id":"1027","name":"Mathematical Methods and Software for Computers and Computer Networks","level":"Bachelor’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":5,"cost":410000,"exam":"Mathematics, Physics (optional), Russian language, Computer science (optional)","about":"The program provides a fundamental education, preparing students for professional work in computer science, advanced IT, applied mathematics, artificial intelligence, and mathematical modeling for the energy and innovation industries. It trains professional programmers capable of developing system and application software, as well as conducting research in various fields of applied mathematics and computer science.","learn":"Managing Large Software Projects | Fundamentals of Building Translators | Data Protection | Research of Information Systems Using Methods of Mathematical Forecasting and Systems Analysis | Fundamentals of Artificial Intelligence | Programming Languages and Methods | Data Structures and Programming Methods | Software Engineering | Cryptographic Methods of Information Security","career":"Graduates can work in the ICT field, developing and testing software, creating and administering information systems and databases, and managing internet resources. They are in demand in the nuclear industry, particularly in IT at nuclear power plants and software maintenance. Employment is also possible in artificial intelligence, mathematical modeling, complex systems analysis, high-performance computing, cybernetics, optimization, and systems analysis, as well as information security, bioinformatics, and network technologies.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1027","passing":"256","directionCode":"01.03.02","direction":"Applied Mathematics and Informatics"},
  {"id":"1035","name":"Mathematical Modelling","level":"Bachelor’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":3,"cost":410000,"exam":"Mathematics, Computer Science (optional), Russian Language, Physics (optional)","about":"The program aims to train highly qualified specialists in applied mathematics and computer science, with a fundamental mathematical background and the ability to participate in the mathematical modeling of various processes and the development of systems and application software. Special emphasis is placed on mathematical modeling and computational experimentation methods and their application in research, design, and production.","learn":"Function Theory and Functional Analysis | Mathematical Models in Natural Science | Mathematical Methods of Cryptography | Databases and Information Systems | Functional Analysis | Programming Technologies | Network Technologies","career":"Graduates can work in science and education, conducting research, as well as in information and communications technology, such as software design, development, and testing. They are in demand in the nuclear, rocket and space, and aircraft industries, where they specialize in mathematical modeling. They can also find employment in information systems development, software engineering and systems programming, complex systems analysis, data and image processing, information security, network technologies, economic modeling, and the creation of applied internet technologies.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1035","passing":"256","directionCode":"01.03.02","direction":"Applied Mathematics and Informatics"},
  {"id":"1055","name":"Computing Machines, Complexes, Systems and Networks","level":"Bachelor’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":75,"cost":450000,"exam":"Computer Science (optional), Mathematics, Physics (optional), Russian Language","about":"The program is designed to train specialists in information and telecommunications technologies with fundamental knowledge and modern professional competencies. Students study cloud and distributed computing technologies, distributed ledger systems, information system architecture and software, and methods for collecting, processing, and analyzing data. Particular attention is paid to computer hardware, computer networks, computer security, and information protection. Specialization in the senior years allows students to gain practical skills in their chosen field.","learn":"Microprocessor Systems and Web Technologies | Programming Technology | Business Process Modeling | Data Analysis and AI Methods | Administration of Secure Operating Systems | ERP System Architecture, Cross-Platform Business Application Development | Digital Signal Processors and Digital Signal Processing | Modeling of Multi-Agent Interaction Systems | Computer Vision and Image Processing Methods | Computing Systems | Methods and Tools for Information Security and Transmission","career":"Graduates can work in the field of information and communications technology, developing software, computing equipment, computer networks, control systems, and data processing, including solutions using supercomputer technologies. They are in demand in organizations involved in the design of computing equipment and network infrastructure, the development of system and application software, as well as in companies using information technology and computer networks to solve industrial and applied problems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1055","passing":"248","directionCode":"09.03.01","direction":"Informatics and Computer Engineering"},
  {"id":"1071","name":"Information Systems and Technologies in Design and Manufacturing","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":2,"cost":450000,"exam":"Physics (optional), Computer Science (optional), Mathematics, Russian language","about":"The program is aimed at training specialists in the development and application of information technology, including the use of automated design systems and scientific research, their modification and adaptation to solve specific problems in order to improve the speed and quality of design and production of science-intensive high-tech products.","learn":"Computational Methods | Modeling of Technical Systems | Artificial Intelligence in Computer-Aided Design Systems | Programming Automated Equipment and Industrial Robots | Working with Databases","career":"Areas and spheres of professional activity of graduates: IT companies engaged in the development and implementation of computer-aided design systems; IT departments and design bureaus of manufacturing and research organizations engaged in the development and manufacture of knowledge-intensive high-tech equipment for enterprises in the fuel and energy complex, the aviation and rocket and space industries, and related sectors of the economy; IT departments and technology bureaus of manufacturing organizations engaged in the manufacture of high-tech knowledge-intensive products using software-controlled equipment and robotic systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1071","passing":"253","directionCode":"09.03.01","direction":"Informatics and Computer Engineering"},
  {"id":"1074","name":"Applied Informatics in Economics","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Mathematics, Computer Science (optional), Physics (optional), Russian language","about":"The program is aimed at training qualified specialists in applied informatics capable of developing, implementing, and maintaining information and analytical systems for the economy. The training develops general and professional competencies necessary for project work, data analysis, business process automation, and the creation of modern information solutions.","learn":"Enterprise architecture | ICT in the electric power industry, economic evaluation of IT projects | Econometrics | Organization and software for information networks and systems | Design of network and mobile applications | Analysis and modeling of business processes; Web technologies for business management (e-business);","career":"Graduates can work in information and communications technology, designing, developing, implementing, and maintaining information systems and digital services for economics and business. They are in demand in research and production organizations across various industries, including energy, e-business, and the digital economy. They can also work in areas such as business process analysis and modeling, network and mobile application development, cloud computing, information systems management, and IT project performance evaluation.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1074","passing":"261","directionCode":"09.03.03","direction":"Applied Informatics"},
  {"id":"1076","name":"Security of Automated Systems","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Mathematics, Physics (optional), Computer Science (optional), Russian language","about":"To train highly qualified and competitive specialists in information security and data protection for the country's innovative economy and energy sector. These specialists are capable of ensuring, using a systems approach, the security of an organization's information systems (assets) from malicious software, hardware, and information attacks. Training is based on an effective combination of fundamental and applied education, utilizing advanced educational technologies.","learn":"Information System Security Audit | Information Security in Cyber-Physical Systems | Information Security Incident Management | Systems and Network Administration | Security of Critical Information Infrastructure of Energy Facilities","career":"Areas and spheres of professional activity of the graduate: Communications, information and communication technologies (in the field of engineering and technology, covering a set of problems associated with ensuring the security of information technology objects in the context of the existence of threats in the information sphere).","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1076","passing":"261","directionCode":"10.03.01","direction":"Information Security"},
  {"id":"1078","name":"Computer System Security","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Physics (optional), Mathematics, Computer Science (optional), Russian language","about":"The program is aimed at training highly professional and competitive specialists in the field of information security and information protection for the innovative economy and energy sector, capable of ensuring, based on a systems approach, the security of the organization's information system (assets) from malicious software, hardware, and information influences.","learn":"Information System Security Audit | Cybersecurity Technologies for Information Systems | Computer Audit Technologies | Enterprise Information Security Systems | Wireless Network Security | Information Security in Cyber-Physical Systems | Information Security Incident Management | Security of Critical Information Infrastructure of Energy Facilities | Proactive Information System Security Technologies","career":"Graduates work in organizations involved in information security and critical infrastructure protection, including data centers, information security departments and services, research and educational institutions, and critical information infrastructure facilities, including energy companies and industrial process control systems (APCS). Their primary areas of employment include protecting information systems, telecommunications networks, and cybersecurity management.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1078","passing":"","directionCode":"10.03.01","direction":"Information Security"},
  {"id":"1092","name":"Materials for Electronics and Nanoelectronics","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":35,"cost":420000,"exam":"Computer Science (optional), Physics, Russian Language, Mathematics (optional)","about":"The program is designed to train specialists in materials science and micro- and nanoelectronics technologies. Students study semiconductor materials and structures, electronic components, and quantum electronics materials and components. The program combines fundamental physical and chemical training with mastery of modern information technologies and high-tech electronic system design methods. Particular attention is paid to researching material properties, developing new electronic components, and applying high-tech technologies to micro- and nanoelectronics.","learn":"Physical Fundamentals of Semiconductor Nanomaterials | Methods for Studying Semiconductor Surfaces | Modern Software and Information Support for Modeling and Designing Products in Your Professional Field | Fundamentals of Electronic Component Technology and Design | Physics of Semiconductor Devices and Integrated Circuits, Physics and Technology of Disordered Semiconductors | Nanoelectronics","career":"Graduates work in the electronics, micro-, and nanoelectronics industries, designing, manufacturing, and operating electronic devices, encapsulated systems, and microelectromechanical systems. They are in demand at companies manufacturing electronic and optical equipment, and in the rocket and space industry, where they develop and support electronic devices for space technology. Specialists also work in communications, information technology, and communications engineering, at research institutes and educational institutions, conducting research and development of new materials and electronic components.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1092","passing":"217","directionCode":"11.03.04","direction":"Electronics and Nanoelectronics"},
  {"id":"1097","name":"Laser and Optical Measurement Electronics","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Physics, Computer Science (optional), Mathematics (optional), Russian Language","about":"The program is designed to train specialists in the design and calculation of optoelectronic and optolaser measurement systems. Students study optics, quantum electronics, photonics, signal processing methods, and machine vision technologies. The program combines fundamental training with practical work on modern laboratory benches, including laser systems and interferometers. Particular attention is paid to the application of optical methods in scientific research, as well as solving problems of digitalization, data analysis, and the development of intelligent systems based on photonic technologies.","learn":"Computer image processing | Digital image filtering | Physical optics, applied optics, optoelectronic measuring systems | Laser radiation metrology, lasers in medicine and biology, semiconductor lasers | Nano-optics | Gas and solid-state lasers | Fiber-optic communication lines","career":"Graduates work in organizations developing and manufacturing optoelectronic, optolaser, and quantum-optical systems. They are in demand in the rocket and space industry, in companies creating orientation, navigation, and stabilization devices for aircraft, as well as in space communications and space control. They also work in the optical engineering and laser industries, developing quantum communication systems, semiconductor lasers, optical components, and measuring systems. They also work in research centers developing machine vision, image processing algorithms, mathematical modeling, and inertial navigation systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1097","passing":"217","directionCode":"11.03.04","direction":"Electronics and Nanoelectronics"},
  {"id":"1098","name":"Microelectronics and Solid-State Electronics","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Mathematics (optional), Physics, Russian language, Computer science (optional)","about":"This program is designed to train qualified specialists for the electronics and related industries that utilize modern science-intensive technologies, including nanoelectronics. The training focuses on developing competencies in the development, design, and operation of electronic devices and systems, as well as mastering advanced engineering methods and digital technologies. Particular attention is paid to practice-oriented training, working with modern equipment, and solving applied problems in high-tech manufacturing.","learn":"Development of RTL descriptions of digital electronic circuits in Verilog | Verification of digital integrated circuits | Development and design of semiconductor infrared receivers | Design of integrated circuit topologies | Programming of microcontrollers and FPGAs","career":"Graduates work in the field of semiconductor electronics and microelectronics, conducting research, development, and design of integrated circuits. They work in companies and research institutes creating digital electronic circuits, RTL descriptions in Verilog, and verifying digital circuits using test environments. Specialists work with microcontrollers and FPGAs, design integrated circuit topologies, and develop solid-state electronics and nanomaterials components. Graduates are involved in the development of infrared semiconductor photodetectors, including photodiodes, photoresistors, and photodetector arrays for modern high-tech systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1098","passing":"217","directionCode":"11.03.04","direction":"Electronics and Nanoelectronics"},
  {"id":"1100","name":"Industrial Electronics","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Physics, Computer Science (optional), Mathematics (optional), Russian Language","about":"The program is designed to train specialists for the electronics and related industries focused on implementing high-tech solutions. Students gain fundamental knowledge in electronics, microelectronics, circuit design, and industrial automation, as well as practical skills in operating electronic equipment, its diagnostics, repair, and modernization. The program covers energy conservation, environmental safety, and the application of modern industrial technologies. Graduates are prepared to develop, manufacture, and operate modern electronic devices and systems.","learn":"Circuitry | Control Systems Development | Electronic Equipment Design | Simulation and Mathematical Modeling Environments | Development of Electronic Boards, Microcontrollers, and Software (Broad Profile) | 3D Modeling Environments for Technical Devices","career":"Graduates work in the electronics and instrumentation industries, designing and developing electronic equipment, printed circuit boards, microcontroller systems, and control systems. They are in demand by companies developing power electronics, industrial automation, and embedded systems, as well as in the IT field, where they specialize in programming and modeling electronic devices.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1100","passing":"217","directionCode":"11.03.04","direction":"Electronics and Nanoelectronics"},
  {"id":"1101","name":"Lighting Technology and Light Sources","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The program is designed to train specialists in the development of modern lighting fixtures and energy-efficient light sources. Students study the physics of light, optical materials, lighting control methods, the fundamentals of lighting design, and digital technologies in lighting engineering. Particular attention is paid to computer modeling of lighting systems and the design of lighting for urban, industrial, and public facilities. The program combines fundamental physics and engineering training with practical and creative engineering challenges. Graduates are in demand in the lighting industry, design organizations, and intelligent lighting systems.","learn":"Light-emitting diodes, lighting fixtures | Design and production technology of lighting fixtures | Fundamentals of lighting engineering, computer graphics, measurements in lighting engineering | Sources of optical radiation, control gear and lighting control systems | Mathematical modeling of the human visual system | Lighting installations | Installation and operation of lighting installations","career":"Graduates work in lighting and electrical engineering companies, design bureaus, and engineering centers developing lighting fixtures, energy-efficient light sources, and lighting control systems. They are in demand by organizations designing functional, decorative, and industrial lighting, as well as agricultural irradiation systems. Specialists specialize in computer modeling of lighting systems, photometric measurements, and equipment testing. Graduates also work in research organizations, manufacturing facilities, and in the field of intelligent lighting systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1101","passing":"217","directionCode":"11.03.04","direction":"Electronics and Nanoelectronics"},
  {"id":"1110","name":"Biotechnical and Medical Devices and Systems","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":75,"cost":420000,"exam":"Mathematics, Russian language, Computer science (optional), Physics (optional), Chemistry (optional)","about":"The program is designed to train specialists in the development and maintenance of medical electronic equipment—from simple heart rate and blood pressure monitors to complex systems like CT scanners. Students study biology, physiology, and biophysics, and also gain in-depth knowledge of electronics: digital and analog circuit design, signal processing, microelectronics, and microwave electronics. The program also includes computer science and computing technology for working with modern diagnostic and therapeutic systems.","learn":"Information Transfer in Biotechnical Systems | Introduction to Medical Electronics | Modeling Software | Ecology, Biochemistry, and Fundamentals of Biology, Chemistry | Structural and Biomaterials | Circuits and Signals in Medical Electronics | Biotechnical Systems for Medical Purposes | Digital and Microprocessor Technology, Digital Signal Processing | Diagnostic Information Acquisition and Therapeutic Effect Delivery","career":"Graduates work in research institutes (conducting research and developing medical devices and biotechnical systems), companies developing and producing medical equipment, organizations testing and registering medical devices, companies involved in the promotion of medical equipment and marketing research, medical institutions (installing, setting up and servicing equipment), and also in laboratories - they carry out medical-biological and scientific-technical research using information technology.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1110","passing":"218","directionCode":"12.03.04","direction":"Biotechnical Systems and Technologies"},
  {"id":"1112","name":"Automation of Technological Processes in Thermal Power Engineering","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Physics, Chemistry (optional), Mathematics (optional), Computer Science (optional), Russian language","about":"The program is designed to train specialists in the development, research, and operation of automated control systems (ACS) in thermal power and heat engineering. Students master the principles of APCS design, their technical foundation, and the mathematical and information support required. The training includes practical training to develop professional competencies. Graduates are prepared for employment at thermal and nuclear power plants, engineering and manufacturing companies, research and educational institutions—in the areas of design, maintenance, testing, and commissioning of automation systems for thermal power facilities.","learn":"Nuclear Power Plant Operation Technology | Management and Innovation in Thermal Power Engineering | Metrology, Thermal Measurements, and Metrological Support for Enterprises | Information Support for Control Systems | Programming Languages for Automated Process Control Systems | Computers and Networks, Automatic Control Theory, and Automation Equipment","career":"Graduates work in education and science, IT, construction and housing and utilities (design and operation of thermal power facilities), the oil and gas industry (raw material flow management, equipment operation), electric power, nuclear, rocket and space, and aviation industries (design of energy and thermal systems), metallurgy, and mechanical engineering. They also find employment at thermal power plants, nuclear power plants, distributed and small-scale energy facilities, public utilities, and industrial enterprises—in the areas of thermal equipment operation, water treatment, and process automation.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1112","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"1116","name":"Thermal Power Plants","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Physics, Chemistry (optional), Mathematics (optional), Computer Science (optional), Russian language","about":"The program is designed to train specialists in the design, operation, and maintenance of thermal and nuclear power plants, steam and gas turbine units, boiler houses, and heating networks. Students master advanced energy technologies, including alternative and renewable energy. Graduates are prepared for employment with energy companies, design organizations, and housing and utilities services, and are skilled in operating thermal and mechanical equipment and conducting energy audits.","learn":"Steam Power Boilers | Operating Modes and Operation of Thermal Power Plants | Steam Turbine Thermal Power Plants | Fundamentals of District Heating | Environmental Technologies at Thermal Power Plants | Thermal Mechanical and Auxiliary Equipment of Power Plants | Gas Turbine and Combined Cycle Technologies at Thermal Power Plants","career":"Graduates work in the construction and housing and utilities sectors (design and operation of thermal power facilities), in the electric power industry, at enterprises involved in the extraction, processing, and transportation of oil and gas, in the nuclear industry (design and operation of turbine equipment), in metallurgical production, as well as in organizations with cross-cutting types of professional activity - anywhere that requires competencies in the field of thermal power engineering and heat engineering.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1116","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"1117","name":"Water and Fuel Technology at Thermal and Nuclear Power Plants","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Russian language, Physics, Computer science (optional), Chemistry (optional), Mathematics (optional)","about":"The program is aimed at training specialists to ensure the reliable operation of power equipment. Students study water treatment processes (demineralization, softening, and boiler water deaeration), chemical analysis of water, oils, and fuel, as well as the optimization of water chemistry and chemical control systems at thermal and nuclear power plants.","learn":"Power Boilers and Heat Supply Systems | Water Treatment | Specialized Water Treatment at Nuclear Power Plants | Thermal Power Plant and Nuclear Power Plant Turbines | Power Fuel | Water Chemistry at Thermal Power Plants and Nuclear Power Plants | Environmentally Safe Technologies at Thermal Power Plants | Power Fuel and Oils","career":"Graduates work in industry (ensuring the safe operation of equipment operating under excess pressure), in the construction and housing and communal services sectors (designing and operating thermal power and heat engineering facilities), in the nuclear industry (operating heat-mechanical and heat-exchange equipment), in education and science (conducting scientific research), and in the electric power industry (in the fields of thermal power and heat engineering).","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1117","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"1120","name":"Autonomous Energy Systems","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Physics, Chemistry (optional), Mathematics (optional), Computer Science (optional), Russian language","about":"The program is designed to prepare undergraduate students for the design, research, and operation of autonomous energy systems capable of efficiently generating, converting, and storing electrical and thermal energy. Students receive engineering training in thermal power engineering and heat technology, and study electrochemistry, chemical power sources, and energy-saving autonomous energy systems. Particular attention is paid to energy efficiency, environmental safety, and decentralized energy supply. Graduates are in demand in the energy, manufacturing, transportation, and industries using hydrogen and electrochemical technologies.","learn":"Hydrogen and Electrochemical Energy | Energy-Saving Autonomous Energy | Thermal Processes in Electrochemical Systems | Fundamentals of Hydrogen Technologies | Physicochemical Research Methods | Corrosion and Material Protection in Energy | Theoretical Electrochemistry, Environmental Chemistry | Energy Saving in Electrochemical Technologies | Theoretical Foundations of Chemical Current Sources","career":"Graduates work in thermal power engineering and thermal technology, autonomous and distributed energy systems, hydrogen energy, and electrochemical technologies. They design and operate hybrid energy systems, energy storage systems, and power supply systems for remote facilities, focusing on energy conservation and improving energy efficiency. They find employment in industrial energy companies, transportation companies (with fuel cell and battery-based systems), research and development organizations, and engineering design organizations, as well as working with electrolyzers, hybrid power plants, and hydrogen systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1120","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"1122","name":"Economics and Management of Energy Enterprises","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Physics, Mathematics (optional), Computer Science (optional), Russian language","about":"The program trains highly qualified specialists for work in thermal power engineering and heat technology, with a focus on the economic and managerial challenges of energy companies. The program is based on an interdisciplinary approach: students study the technological specifics of the industry, master the calculation of costs and tariffs for heat and electricity, cost management, justification of investment programs, and the modernization of energy facilities. Intersectoral integration, production planning, and analysis of the financial and economic performance of energy companies are also covered.","learn":"Energy Saving in Thermal Power Engineering and Thermal Technology | Finance, Accounting | Fundamentals of the Energy Business | Economic Evaluation of Investments | Digital Technologies in Economic Calculations | Enterprise Economics, Industry Economics | Enterprise Planning | Economic Analysis and Diagnostics of Financial and Economic Activities | Strategic Planning","career":"Graduates work in construction and housing and utilities (design and operation of thermal power and heating engineering facilities), in the electric power industry, and in cross-cutting professional tasks aimed at improving energy efficiency. They are in demand in the financial, economic, and investment departments of energy companies, companies designing, installing, and servicing energy facilities, planning and economic departments of industrial enterprises with their own energy systems, design and research institutes, and in government energy and technological oversight agencies.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1122","passing":"233","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"1125","name":"Industrial Energy Systems and Hydrogen Technologies","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":3,"cost":420000,"exam":"Chemistry (optional), Physics, Russian language, Computer science (optional), Mathematics (optional)","about":"The program is aimed at training specialists in the development, research, and operation of energy supply systems and complexes for industrial enterprises and the equipment included therein. These specialists are capable, using modern information technology, of developing and implementing innovative technologies at enterprises that improve the efficiency of energy generation and use in the production of energy-intensive products, including technologies for energy conservation, production, transportation, storage, and use of hydrogen.","learn":"Programming Basics | Computer Modeling of Thermophysical Processes | Industrial Facility Design | Technological Processes and Equipment for Metallurgical Production","career":"Graduates work at industrial enterprises with their own energy systems (including in the metallurgical industry), at companies implementing energy-saving and hydrogen technologies (hydrogen production, transportation, storage, and use), and at design organizations designing industrial facilities and energy systems. They also work at research and engineering centers, at power engineering companies, in equipment maintenance companies, and in industrial automation departments, where they apply programming skills to improve energy efficiency.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1125","passing":"227","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"1127","name":"Electric Power Distribution Networks","level":"Bachelor’s","inst":"IEPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Physics, Mathematics (optional), Russian language, Computer science (optional)","about":"The \"Electric Distribution Networks\" educational program is aimed at providing practical training for specialists in the electric grid industry (up to and including 220 kV). It is implemented through targeted training in collaboration with specialized organizations. The program covers design and operational activities, focusing on the study of overhead and cable transmission lines, transformer substation power equipment, and the analysis of distribution grid operating modes.","learn":"Relay Protection and Automation of Electric Power Systems | Electric Power Systems and Networks | Electrical Part of Thermal Power Plants and Substations of Power Supply Systems | Power Supply Systems | Electrical Machines | Industrial Electronics | Power Plants and Substations | Occupational Health and Safety in Electrical Installations | Short-Circuit Currents | High-Voltage Technology | Maintenance and Operation of Power Supply Systems | Overhead Power Lines and Cable Power Lines | Electrical Network Design","career":"Graduates work in electric grid companies and energy facilities, operating and designing distribution networks, overhead and cable transmission lines, and transformer substations. They are often employed in dispatching services to manage electric grids, and in organizations that diagnose and assess the condition of power equipment (transformers, switching devices, reactive power compensation devices, relay protection devices, and automation). They are also in demand at power plants and in companies that ensure the reliability and quality of power supply to consumers.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1127","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1133","name":"Electrical Power Engineering","level":"Bachelor’s","inst":"IEPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The program is aimed at training specialists in the electric power industry. The curriculum covers the physical principles of the operation and modeling of electric power systems and their operating modes. Students master system design, the selection of power equipment parameters, automatic control systems, relay protection and automation devices, and facility insulation and lightning protection. Training takes place in specialized classrooms and modern laboratories.","learn":"Electrical Materials Science, Electrical Machines | Electric Power Systems and Networks, Automation of Electric Power Systems | Power Plants and Substations, Power Supply | Relay Protection of Electric Power Systems | Thermal Power Plants and Nuclear Power Plants, Power Plants Based on Renewable Energy Sources | Electromagnetic and Electromechanical Transients in Electric Power Systems | Computing Complexes in the Electric Power Industry, Calculations of Relay Protection for Electric Power Systems; | Computer Technologies for Solving Design Problems | Lightning Physics and Lightning Protection, High-Voltage Testing and Electrophysical Installations | High-Voltage Electrical Technologies, Ultra-High Voltage Power Transmission","career":"Graduates work in the electric power industry: at thermal, nuclear, and renewable energy power plants, in grid companies and control centers, managing power systems and operating electrical networks. They are involved in network and substation design and power equipment diagnostics (transformers, generators, transmission lines, switchgear). They are in demand in organizations specializing in relay protection and automation, lightning protection, and high-voltage equipment insulation, as well as in research and design institutes in the industry.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1133","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1137","name":"Hydroelectric Power Plants","level":"Bachelor’s","inst":"IHRE","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Russian language, Physics, Mathematics (optional), Computer science (optional)","about":"The educational program is aimed at training engineers for the design, construction, and operation of hydraulic structures and hydroelectric power plants. During their studies, students study hydraulics, hydrology, renewable energy, and the operating principles of hydroelectric turbine equipment. The curriculum includes laboratory work on physical models, field training at operating hydroelectric power plants, and computer modeling of water and energy systems. Graduates are prepared for professional work in hydroelectric power and water management.","learn":"Engineering and Computer Graphics | Strength of Materials, Structural Materials Science | Theoretical Mechanics, Theoretical Foundations of Electrical Engineering | Electric Power Plants and Substations | Electric Power Systems and Networks | Metrology and Information Measuring Technology | High-Voltage Engineering | Geodesy, Engineering Geology, and Construction Materials | Thermal and Nuclear Power Plants, Renewable Energy Power Plants | Hydraulic Structures, Electrical Parts of Hydroelectric Power Plants","career":"Graduates work at all types of hydroelectric power plants and pumped-storage power plants (PSPPs), in organizations involved in the design, construction, and operation of dams, water intake and spillway structures, reservoirs, water pipelines, and small hydroelectric power plants. They are involved in hydroelectric facilities, including hydroturbine equipment, hydrogenerators, and automated process control systems (APCS). They also work in research institutes, government agencies, and companies involved in energy management and hydroelectric development.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1137","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1140","name":"Power Plants Based on Renewable Energy Sources","level":"Bachelor’s","inst":"IHRE","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Physics, Computer Science (optional), Russian Language, Mathematics (optional)","about":"The educational program is aimed at training specialists in the design, operation, and optimization of power plants using solar, wind, and other renewable energy sources. During their studies, students explore the principles of energy conversion, energy storage systems, and distributed generation management methods. The curriculum combines digital modeling of wind farm and solar power plant operating modes with practical training at existing green energy facilities. Graduates are prepared for professional careers in energy companies, design institutes, and service companies specializing in renewable energy.","learn":"Engineering and Computer Graphics | Metrology and Information Measuring Technology | Structural Materials Science, Electrical Materials Science | Electric Power Plants and Substations, Electric Power Systems and Networks | Relay Protection of Electric Power Systems | High-Voltage Engineering, Power Supply, Thermal Power Plants and Nuclear Power Plants | Geodesy, Engineering Geology, and Construction Materials | Renewable Energy Power Plants, Electrical Parts of Renewable Energy Plants | Primary and Auxiliary Equipment of Renewable Energy Power Plants","career":"Graduates work at solar (SPP), wind (WPP), small hydro and geothermal (GeoPP) power plants, as well as bioenergy installations and hybrid energy systems. They are involved in the development, installation, and maintenance of wind and solar power plants, the operation of energy storage systems (ESS), and solar thermal systems. Furthermore, specialists are in demand in energy management, research organizations, and structures related to renewable energy.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1140","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1145","name":"Industrial Safety in Electrical Power Engineering and Electrical Engineering","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Computer Science (optional), Mathematics (optional), Russian Language, Physics","about":"The program trains highly qualified specialists in life safety, occupational health and safety, and industrial and environmental safety. Students master general technical and electrical engineering disciplines, and, starting in their third year, specialized courses in technological safety. Graduates are skilled in conducting environmental assessments of energy companies, conducting vibroacoustic diagnostics and electronic environmental monitoring, assessing working conditions and risks at industrial facilities, ensuring electrical safety, and designing environmental control and protection systems.","learn":"Fundamentals of Ergonomics | Methods and Means of Protecting the Aquatic Environment | Vibroacoustics | Electromechanical Systems | Methods and Means of Protecting Atmospheric Air | Mathematical Modeling of Electromechanical Systems | Electrical Safety | Chemistry and Physics of the Environment","career":"Graduates work in the electric and thermal power industry, at industrial enterprises, and in construction organizations (including in environmental assessment). They are involved in ensuring industrial safety, protecting people and the environment from anthropogenic impacts, and maintaining electrical systems at enterprises—working with low- and high-voltage electrical equipment, electrical installations, and networks. Specialists participate in the implementation of electrical engineering projects, monitor hazardous technological processes in the energy sector, and ensure the safety of personnel at energy enterprises and organizations with their own electrical systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1145","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1154","name":"Electromechanics, Electrical and Electronic Devices","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":135,"cost":420000,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The program trains specialists for the digital electric power industry and high-tech industries. Based on a classical electromechanics background, students master modern tools: computer-aided design systems, electrical machine calculation software, numerical field modeling, digital twins, model-based design (in Engee, SimInTech, and the Julia language), power electronics using SiC/GaN components, and predictive diagnostics systems using machine learning. Graduates are skilled in the design and operation of electrical machines, transformers, switching and electronic devices, and intelligent control systems.","learn":"Modeling of Electronic Devices | High-Voltage Devices, Power Electronics | Design of Electrical Machines | Electrical Devices and Complexes in the Electric Power Industry | Fundamentals of Designing Power Transformers for the Electric Power Industry | Electronic Devices for Systems with Renewable Energy Sources | Control Systems for Intelligent Objects | Methods for Calculating Electromagnetic Fields of Electrical Facilities | Mathematical Modeling of Electrical Facilities | Thermal Phenomena in Electrical Devices | Electromechanical Systems of Electrical Machines and Devices","career":"Graduates work in the electric power industry and electrical engineering, focusing on power generation, transmission, and distribution, as well as servicing digital substations and renewable energy systems. They are in demand in the rocket and space industry, shipbuilding (electrical equipment design), oil and gas, and metallurgy. Their skills are in demand in urban and highway electric transport, electric vehicles, and unmanned vehicles. Specialists design and maintain electrical machines, transformers, switching equipment, predictive diagnostic systems, and equipment for housing and utilities, the agro-industrial complex, and industry.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1154","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1158","name":"Electrical Equipment and Power Systems for Enterprises, Organizations and Institutions","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Computer Science (elective), Mathematics (elective), Physics, Russian Language","about":"The program is aimed at training highly qualified personnel in the operation of electrical equipment and the design of power supply systems for enterprises, organizations, and institutions, including data centers and housing and utilities facilities. Graduates ensure uninterrupted power supply with minimal energy losses, possess competencies in the design, installation, and operation of electrical systems, and possess management skills in the field of power supply and electrical systems.","learn":"Operation and Repair of Electrical Equipment | Electric Power Systems and Industrial Power Networks | Consumer Power Supply and Modes | Transient Processes in Power Supply Systems | Microprocessor-Based Devices in Power Supply | Installation and Commissioning of Electrical Equipment | Electrical Energy Receivers","career":"Graduates work in industry (design and operation of electric power systems and complexes, industrial automation), electric power and electrical engineering, construction and housing and utilities (operation of electrical systems and facility automation systems), and metallurgy and oil and gas production (operation and design of electrical equipment). They are employed at enterprises with electrical systems, in organizations servicing power supply systems for buildings and enterprises, low- and high-voltage equipment, electricity metering systems, emergency control systems, and reserve input devices.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1158","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1160","name":"Electrical Equipment of Aircraft and Automobiles","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Mathematics (optional), Russian language, Physics, Computer science (optional)","about":"The program trains highly qualified specialists in electrical equipment for aircraft (including spacecraft), underwater vehicles, automobiles, and other autonomous civilian, military, and special-purpose vehicles. Training is conducted by leading researchers and developers of innovative technology. An emphasis is placed on practical training in electrical engineering, electronics, and information technology. Graduates find employment in high-tech industries related to the development and operation of unique electrical equipment for various machines and devices.","learn":"Fundamentals of Microprocessor Technology | Design of Electrical Equipment for Autonomous Objects | Electromechanical Systems | Aircraft, Automobiles, and Electric Vehicles and Their Systems | Fundamentals of Machine Design | Design of Electrical Equipment Systems for Autonomous Objects","career":"Graduates work in industry (design and operation of electrical systems and power supply systems, automation and mechanization of production), electric power (including small-scale and distributed generation), aircraft, automobile, and shipbuilding, and the rocket and space industries. They are involved in the design of electrical equipment, working with power plants, electric drives for autonomous vehicles (aircraft, automobiles, etc.), power and control electronics, microprocessor control systems, electric and hybrid transmissions, high-speed electric machines, and generation systems for small-scale power generation.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1160","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1162","name":"Electric Drives and Automation","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Physics, Computer Science (optional), Russian Language, Mathematics (optional)","about":"The program trains specialists in the development and design of modern electric drive systems—energy-efficient and equipped with intelligent microprocessor control systems. During their studies, students master general engineering and electrical engineering disciplines and undertake an in-depth study of information technology, learning the mathematical modeling of electric drives and their control systems, as well as control programming. Graduates will be able to create solutions for a wide range of technical devices—from robots and CNC machines to elevators, pumps, and industrial equipment.","learn":"Elements of automation systems | Microprocessor means in electric drives | Design of electrical devices | Modeling in engineering and in electric drives | Coordinate control | Energy saving by means of electric drives | Electric drive, logical control systems for electric drives | Fundamentals of microprocessor technology","career":"Graduates work in various industries, designing and operating electrical systems, and automating and mechanizing production. Their skills are in demand in the oil and gas industry (maintaining drives for oil and gas pumping equipment), and in the production of medical and aviation equipment (including power plants for unmanned aerial vehicles). Specialists work with electric drives for lifting mechanisms, elevators, excavators, ventilation and air conditioning systems, and robotic systems. They are also involved in the development and maintenance of electrical machines, transformers, electromechanical systems, and energy and resource systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1162","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1164","name":"Electrotechnology","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Russian language, Physics, Mathematics (optional), Computer science (optional)","about":"The program is designed to train specialists for project work in the field of electrical engineering installations and systems, including their power supplies and control systems. Students study the principles of converting electrical energy into other forms of energy for technological applications, including electrothermal, electric welding, electrophysical, and other processes. Emphasis is placed on automatic control systems, microprocessor programming, and mathematical process modeling. Graduates are in demand in mechanical engineering, metallurgy, the electronics industry, and related industries.","learn":"Electrical Heat Treatment and Welding Technologies | Computer-Aided Design Methods | Power Supply and Electrical Equipment for Electrical Process Installations | Electrical Process Installations for Induction and Dielectric Heating | Automatic Control Systems for Electrical Process Installations | Electrical Process Installations for Arc Heating and Special Types of Heating | Design of Electrical Process Installations with Power Supply Systems | Electrical Process Installations for Resistive Heating | Modeling of Electrical Processes | Microprocessor-Based Automation in Electrical Technology","career":"Graduates work in industry, designing and operating electrical systems, power supply systems, and automating and mechanizing production. In metallurgy, they set up and maintain electrical equipment (electric furnaces, induction heating units, arc and plasma systems). In aircraft manufacturing, they design anti-icing devices, and in the oil and gas industry, they design heating systems for pipelines, tanks, and wells. In construction and housing and utilities, graduates design power supply systems and building automation systems, heating devices, and household heaters.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1164","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"1173","name":"Boilers, Combustion Chambers and Steam Generators of Nuclear Power Plants","level":"Bachelor’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The program trains specialists in the design, commissioning, and reliable operation of steam generating units and their auxiliary equipment: steam and hot water boilers, waste heat boilers, nuclear power plant steam generators, burners, gas turbine combustion chambers, and more. Students master industrial thermal power equipment (including boilers for steam injection into oil reservoirs) and learn how to reduce harmful emissions. The training includes work with industry-specific software such as Boiler Designer and Ansys CFX, which are used to design and study thermal power equipment, including steam and gas turbines, station equipment, and steam generating unit components.","learn":"Machine Parts and Design Basics | Steam Boilers, Hot Water Boilers, Waste Heat Boilers | Thermal Power Plants, Combined Heat and Power Plants, Nuclear Power Plants | Auxiliary Elements of Power Plants | Enhanced Oil Recovery Boilers, Biofuel Boilers | Nuclear Power Reactors | Secondary Circuit Systems of Nuclear Power Plants | Steam Generators and Nuclear Power Plant Reactors","career":"Graduates work at thermal, combined heat and power plants, and nuclear power plants, designing and servicing fossil and nuclear fuel power plants: steam and hot water boilers, waste heat boilers, steam generators, combustion chambers, burners, and other equipment. They work in design organizations, creating digital twins of equipment, and in installation and service companies, performing commissioning, optimization, diagnostics, and repair. They participate in research and development at specialized institutes, and also develop equipment for enhanced oil recovery and biofuel applications.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1173","passing":"215","directionCode":"13.03.03","direction":"Power Machinery Engineering"},
  {"id":"1177","name":"Automated Hydraulic and Pneumatic Systems and Units","level":"Bachelor’s","inst":"IHRE","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The program trains specialists in the design and manufacturing technology of robotic systems, control systems, hydraulic machines, and drives for land-, sea-, and air-based equipment (including special-purpose equipment). Students master the use of computational software systems (including domestically developed ones) and apply neural network methods to create artificial intelligence elements. Graduates work in mechanical engineering design bureaus, developing pumping equipment for thermal power plants, nuclear power plants, irrigation systems, and various industries, as well as designing and operating hydromechanical equipment for hydroelectric and pumped storage power plants.","learn":"Hydraulic Equipment | Positive Displacement Rotary Hydraulic Machines | Hydraulic Engineering Technology | Hydraulic Turbines | Pumping Equipment for Thermal and Nuclear Power Plants, Vane Pumps | Hydraulic Drives and Automation Systems | Pneumatic Systems and Devices","career":"Graduates work in the following fields: machinery and equipment manufacturing (power equipment design); electric power engineering (power engineering); the nuclear industry (development and operation of thermal-mechanical and heat-exchange equipment); and the oil and gas industry (creation and maintenance of equipment for gas transportation systems). They also find employment in science and education. They work with hydraulic turbines, pumps, gas and steam turbine units, heat exchangers, automation systems, auxiliary equipment for power facilities, as well as the diagnostics and repair of power equipment.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1177","passing":"215","directionCode":"13.03.03","direction":"Power Machinery Engineering"},
  {"id":"1179","name":"Nuclear Power Plants and Installations","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":2,"cost":474000,"exam":"Russian language, Physics, Computer science (optional), Mathematics (optional)","about":"The program provides engineering training for specialists working with nuclear power plants and technologies. The program combines theoretical training with practical exercises in physics and digital laboratories. Students acquire skills in solving complex problems: the design, operation, modernization, and decommissioning of nuclear power facilities. The practical component allows them to consolidate their knowledge at operating power units and specialized facilities.","learn":"Nuclear and Neutron Physics | Turbomachinery, Steam Generators, and Water Treatment at Nuclear Power Plants | Nuclear Power Reactors | Neutron Transport Theory | Thermodynamics | Nuclear Power Plants | Physicochemical Processes in Nuclear Power Plant Equipment | Protection from Ionizing Radiation","career":"Graduates work in education and science, teaching and conducting research in nuclear energy and thermal physics. In the nuclear industry, they work at nuclear power plants and related facilities, maintaining and operating equipment (reactors, turbines, pumps, steam generators, etc.), working with control, management, and safety systems, as well as automated process control systems. They also perform radiation monitoring, ensure the safe operation of facilities, and develop and maintain technical documentation. They are also in demand in related industries that utilize nuclear and thermal physics technologies.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1179","passing":"239","directionCode":"14.03.01","direction":"Nuclear Power Engineering and Thermophysics"},
  {"id":"1185","name":"Thermal Physics","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":3,"cost":474000,"exam":"Physics, Mathematics (optional), Computer Science (optional), Russian language","about":"The program trains thermal physics specialists with deep fundamental training and applied engineering skills to address scientific challenges in the advanced energy sector. The program develops the ability to independently formulate and solve engineering and scientific problems, and to find innovative approaches to achieving goals. Graduates are prepared for successful careers in both project-based and research fields.","learn":"Thermodynamics | Theory of thermophysical properties of substances, experimental study of the properties of substances | Numerical solution of problems of thermal physics | New information-measuring systems and technologies in thermal physics | Heat and mass transfer, experimental study of heat and mass transfer | Experimental study of heat and mass transfer","career":"Graduates work in education and science, teaching and conducting research in nuclear energy and thermal physics. They are in demand in the nuclear industry, working at nuclear power plants and at facilities developing and operating nuclear and thermal power plants (including fusion reactors). They also find employment in industry in areas related to thermal processes: developing and using devices for generating and converting thermal and nuclear energy, and working with structural elements of devices and installations for new technologies.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1185","passing":"239","directionCode":"14.03.01","direction":"Nuclear Power Engineering and Thermophysics"},
  {"id":"1186","name":"Thermonuclear Reactors and Plasma Installations","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":2,"cost":0,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The program is designed to train engineers to tackle the design and operation of plasma, fusion, and hybrid reactors and facilities. Training is provided by experienced specialists and is based on work with a unique research infrastructure. Students master engineering approaches to the design and maintenance of specialized facilities, complete practical assignments and final theses on a modern experimental base, and deepen their professional competencies through applied industry challenges.","learn":"Thermonuclear Experimental Reactors | Neutron Physics of Controlled Thermonuclear Fusion | Magnetic Plasma Confinement | Plasma Diagnostic Methods | Thermonuclear Reactor Fuel Cycle | Heat Transfer and Hydrodynamics in Thermonuclear Installations | Plasma Engineering and Technology","career":"Graduates work in research centers and laboratories, conducting experiments with plasma and fusion facilities. They are in demand at specialized enterprises, designing and constructing reactor equipment, and in engineering and design bureaus, developing and modernizing systems. They are also employed at experimental sites (testing and adjusting equipment) and in operating organizations, where they ensure the reliable operation of facilities, perform maintenance, and perform diagnostics.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1186","passing":"","directionCode":"14.03.01","direction":"Nuclear Power Engineering and Thermophysics"},
  {"id":"1191","name":"Machinery and Technologies for High-Efficiency Materials Processing","level":"Bachelor’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":121,"cost":420000,"exam":"Mathematics, Physics (optional), Russian language, Computer science (optional)","about":"The program trains highly qualified specialists for the research and development of materials processing technologies in mechanical engineering. Students master modern design and modeling methods (mathematical, physical, and computer) for technological processes, study the theory of materials science, and the physical foundations of highly efficient processing technologies. They also master methods of working with concentrated energy flows, including electron beam technologies. This knowledge is applicable to the development and improvement of manufacturing technologies for metal and alloy products.","learn":"Materials Science | Computer Science in Engineering Calculations | Fundamentals of Mechanical Engineering Technology | Physical Principles of Non-Destructive Testing | Fusion Welding Technology and Equipment | Design of Specialized Equipment and Tooling for Processing KPE | Physicochemical and Metallurgical Processes in Processing KPE Materials | Control of Technical Systems | Restoration of Machine Parts and Elements of Power Equipment | Methods of Monitoring the Mechanical Properties of Welded Joints | Concentrated Energy Flows and the Physical Principles of Their Generation | Theoretical Foundations of Processing KPE Materials, KPE Materials Processing Technology","career":"Graduates work in mechanical engineering and aerospace companies, research and development organizations, and service departments. They design process tooling and develop and implement technological processes, including electron beam, laser, plasma, and additive manufacturing. They ensure quality control and product testing, and perform equipment installation, setup, operation, diagnostics, and repair. They manage production projects in mechanical engineering and the energy sector, working with regulatory documentation, standardization systems, and non-destructive testing methods.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1191","passing":"233","directionCode":"15.03.01","direction":"Mechanical Engineering"},
  {"id":"1195","name":"Dynamics and Strength of Machines, Instruments and Equipment","level":"Bachelor’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Physics (optional), Russian language, Mathematics, Computer science (optional)","about":"The program trains specialists in ensuring the mechanical reliability and safety of technical structures at all stages of the life cycle—from design to operation. Interdisciplinary training covers key issues: strength, stability, durability, optimization, and survivability of structural elements. Students master mechanical and mathematical disciplines and acquire competencies for research, teaching, and design work. Particular attention is paid to computer modeling and design. Students work with high-performance software systems to solve problems in various high-tech industries.","learn":"Statistical Mechanics and Reliability Theory | Computational Mechanics and Computer-Aided Engineering | Nonlinear Problems of Continuum Mechanics | Optimal Design | Mechanics of Contact Interaction and Fracture | CAD/CAE Technologies | Stability of Mechanical Systems | Theory of Plasticity and Creep | Mechanics of Composite Materials | Structural Mechanics of Machines | Mechanics of Materials and Structures","career":"Graduates are in demand in science, education, construction, housing and utilities, and a wide range of industries, including nuclear, rocket and space, mechanical engineering, automotive, aviation, shipbuilding, and others. They work to improve the reliability, durability, and vibration protection of structures, components, and equipment, while reducing material consumption. They conduct computational and experimental research in applied mechanics and design new technologies and equipment for the energy, metallurgy, oil and gas, transportation, and construction industries.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/1195","passing":"233","directionCode":"15.03.03","direction":"Applied Mechanics"},
  {"id":"2029","name":"Automation, Intelligent Control and Data Analysis Systems and Tools","level":"Bachelor’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":3,"cost":420000,"exam":"Mathematics, Russian language, Computer science (optional), Physics (optional)","about":"The program trains specialists in the development and operation of automatic control systems, mechatronic and robotic systems, industrial automation equipment, and information and analytical systems. Students receive in-depth general engineering training and master modern methods, including data analysis, programming, and artificial intelligence technologies. Graduates are able to design and implement automated systems to solve applied problems in industry, energy, and transportation.","learn":"Fundamentals of control theory: automatic control theory (including advanced level), control in large systems, methods of identification of controlled objects. | Skills in working with automation systems and mechatronic devices: pneumatic automation, hydraulic automation, basics of mechatronics and their application in technical systems. | Mastery of modern methods of information processing: neuro-fuzzy technologies, intelligent and applied data analysis, basics of text data analysis, neurocomputers. | Practical skills in software development: programming microcontrollers and controllers, developing control system software, working with system software and automated systems. | Working with IT tools and systems: information technology, circuit design of control systems and computers, database management systems. | Methods of system research and optimization: control system modeling, statistical methods in engineering research, process optimization methods.","career":"Graduates work in communications and information technology, setting up and launching databases, maintaining and optimizing their operation, creating and modifying information systems, and supporting information and communications systems. In the rocket and space industry, they develop onboard equipment and automate design and engineering preparation for production. In various industries, they ensure product compliance with standards and specifications, provide metrological support, and implement automation and control systems to improve production efficiency.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2029","passing":"243","directionCode":"27.03.04","direction":"Control in Engineering Systems"},
  {"id":"2030","name":"Intelligent Control Technologies in Engineering Systems, Data Processing and Analysis","level":"Bachelor’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Physics (optional), Mathematics, Russian language, Computer science (optional)","about":"The program's goal is to train broad-based specialists in the development and operation of automatic control systems and information and analytical systems. A key advantage of the program is its graduates' focus on solving applied problems using modern control methods, data analysis techniques, programming environments, and artificial intelligence technologies. This advantage is achieved through the acquisition of fundamental theoretical knowledge combined with mastery of modern information technologies.","learn":"Control System Modeling | Neuro-Fuzzy Technologies in Control Problems | Identification of Control Objects | Development of Control System Software | Software for Automated Systems | Functional Units and Circuitry of Control Systems and Computers | Microcontrollers and Microprocessors in Control Systems | Statistical Methods in Engineering Research | Neurocomputers and Their Applications | Robotics and Flexible Automated Manufacturing | Intelligent and Applied Data Analysis","career":"Graduates work in communications and information technology, deploying and maintaining databases, creating information systems, and maintaining the functionality of communications systems. In the rocket and space industry, they develop equipment for space systems and automate design and engineering preparation for production. In industry, they ensure product compliance with standards, provide metrological support, and implement automation systems to improve production efficiency.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2030","passing":"243","directionCode":"27.03.04","direction":"Control in Engineering Systems"},
  {"id":"2032","name":"Corporate Finance","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":0,"cost":370000,"exam":"Social Studies (optional), Russian Language, Computer Science (optional), Mathematics","about":"The program is designed to train financial and investment analysts in corporate structures and financial consultants capable of making effective decisions regarding the financial strategies of economic entities. Graduates' professional tasks include analyzing and evaluating corporate performance, assessing company profitability under risk, modeling corporate finance, conducting financial analysis, budgeting, and managing the cash flows of economic entities.","learn":"Corporate Financial Policy | Financial and Management Accounting | Financial Markets and Institutions | Operational Financial Work in Corporations | International Financial Reporting Standards | Corporate Governance and Insurance | Corporate Asset Valuation | Integrated Corporate Finance Solutions | Investment Decisions in Organizations","career":"Graduates work in finance and economics: in expert analytical services and economic analysis centers, in the government sector and public organizations (analysis and forecasting of socio-economic processes); in companies producing goods and services (demand analysis, cash flow planning); in banks and credit institutions, insurance and pension funds, and investment funds. They are also in demand in audit and consulting firms, in financial markets (risk management), and in economic and financial services departments of organizations in various industries.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2032","passing":"258","directionCode":"38.03.01","direction":"Economics"},
