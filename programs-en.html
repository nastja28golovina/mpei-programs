  {"id":"10135","name":"Development of Computer Control Technologies and Mathematical Modeling in Robotics and Mechatronics","level":"Master’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":2,"cost":450000,"exam":"Entrance examination in the chosen field of study","about":"The \"Development of Computer Control Technologies and Mathematical Modeling in Robotics and Mechatronics\" program introduces students to modern approaches to the design and implementation of intelligent systems, as well as mathematical modeling methods that optimize control processes in complex mechanical systems. Particular attention is paid to developing programming skills and working with modern control tools, enabling future specialists to effectively solve automation and robotics problems. The program also emphasizes an interdisciplinary approach integrating mechanical, electrical, and information technologies.","learn":"New Methods in Automatic Control Theory, Artificial Intelligence, and Other Scientific Areas | Development of Experimental Models of Mechatronic and Robotic Systems, Their Modules, and Subsystems | Patent Research Supporting the Development of New Mechatronic and Robotic Systems | Organizing and Conducting Experiments on Existing Mechatronic and Robotic Systems, Their Subsystems, and Individual Modules | Theoretical and Experimental Research into the Development of New Models and Improvement of Existing Mechatronic and Robotic Systems | Analysis of Scientific and Technical Information in the Development and Research of Mechatronic and Robotic Systems | Searching for New Methods of Control and Information Processing Using Artificial Intelligence, Fuzzy Logic, and Multi-Agent Control","career":"Graduates can work in the design, modeling, and operation of mechatronic and robotic systems, the development of electromechanical and electrohydraulic drives, sensor and inertial navigation systems, control algorithms, and artificial intelligence elements for robotics, the creation of autonomous mobile robots and industrial robotic systems, as well as engineering research and the implementation of digital technologies in automated production. They are in demand in industrial automation and robotics industries, mechanical engineering, instrument making, the aerospace industry, and research and development.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10135","passing":"","directionCode":"15.04.06","direction":"Mechatronics and Robotics"},
  {"id":"10137","name":"Strategic Quality Management in an Organization","level":"Master’s","inst":"EEI","campus":"Moscow","budget":0,"contract":2,"cost":450000,"exam":"Entrance examination in the chosen field of study","about":"The program focuses on a thorough understanding of modern approaches that enable the integration of quality management principles into a company's overall development strategy. The training fosters a comprehensive understanding, where quality is viewed not as an isolated control function, but as a systemic element that impacts economic performance, innovative potential, and risk-based thinking. Particular attention is paid to tools that ensure the adaptability of the quality system to the challenges of digital transformation, including the use of advanced analytical solutions.","learn":"Development and implementation of integrated quality management systems | Conducting strategic analysis of the organization to integrate quality principles into all business processes | Organizing and managing business process restructuring projects aimed at improving efficiency and reducing losses | Organizing and managing business process restructuring projects aimed at improving efficiency and reducing losses | Conducting internal audits and management systems to assess their effectiveness and compliance with established goals","career":"Graduates work in: quality management, development, and standardization departments of large industrial and service companies; product, management systems, and service certification bodies; consulting companies specializing in the implementation of management systems and organizational development; government agencies involved in control, supervision, and technical regulation; research and design institutes specializing in quality management methodology; and as project managers and business analysts in various industries where systems thinking and a process-based approach are in demand.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10137","passing":"","directionCode":"27.04.02","direction":"Quality Management"},
  {"id":"10139","name":"Megatrends in the International Energy Business","level":"Master’s","inst":"EEI","campus":"Moscow","budget":0,"contract":1,"cost":160000,"exam":"Entrance examination in the chosen field of study","about":"The program develops forecasting and analytical skills, combining political and legal research with an understanding of economic mechanisms and diplomatic practices. Particular attention is paid to mastering risk management tools, ensuring the security of critical infrastructure, and the art of conducting complex international negotiations.","learn":"Analysis of long-term global trends | Planning and implementation of communication strategies | Assessment of risks and threats to critical infrastructure facilities in the energy sector, with proposals for measures to minimize them | Development and evaluation of energy solutions, taking into account legal aspects and environmental obligations","career":"Areas of professional development for graduates include: energy and engineering corporations; analytical and consulting centers specializing in international markets and global trends; financial institutions investing in large-scale infrastructure projects; international organizations focused on development, trade, and environmental issues; and scientific and educational institutions that require expertise in global politics and energy.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10139","passing":"","directionCode":"41.04.05","direction":"International Relations"},
  {"id":"10144","name":"Electrical Systems for Autonomous Platforms and Electric Transport","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":1,"cost":480000,"exam":"Applicant's scientific portfolio competition, Special discipline corresponding to the scientific specialty of the postgraduate training program","about":"The program is designed to train specialists in the design and research of electrical systems for autonomous vehicles and electric transport systems. Students study methods for ensuring reliable power supply to mobile and autonomous energy assets, the operating principles of electrical machines and converters, and the principles of controlling power plants in transport systems. Particular attention is paid to energy efficiency, operational stability, and the integration of modern energy sources.","learn":"Design of Electrical Systems for Autonomous Power Facilities | Development of Control Systems for Transport Electrical Installations | Modeling of Electric Transport Energy Systems | Analysis of Operating Modes of Electric Traction Drives | Ensuring Reliability and Energy Efficiency of Autonomous Power Supply Systems | Application of Modern Power Converter Devices","career":"Graduates work in transport engineering organizations, energy companies, research centers, and design organizations. They participate in the development of electrical equipment for electric vehicles, power supply systems for autonomous vehicles, traction drives, and converter units. Graduates are also in demand in the aviation, rail, and urban transport infrastructure sectors, as well as in universities and research organizations as teachers and researchers.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10144","passing":""},
  {"id":"10148","name":"Energy Systems and Complexes: Modeling and Design","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":2,"cost":490000,"exam":"Applicant's scientific portfolio competition, Special discipline corresponding to the scientific specialty of the postgraduate training program","about":"The program is designed to train researchers in the fields of mathematical modeling, design, and optimization of energy systems and complexes for various purposes. It examines methods for analyzing power plant operating modes, algorithms for selecting optimal equipment parameters, and issues related to improving the efficiency and reliability of energy systems. Significant attention is paid to digital technologies for modeling energy processes and the development of innovative solutions for modern power plants and energy complexes.","learn":"Development of mathematical models of energy systems and complexes | Optimization of power equipment parameters | Application of digital tools for analyzing power plant modes | Study of the reliability of energy complexes | Evaluation of the technical and economic efficiency of energy solutions | Design of energy systems for various purposes","career":"Graduates work in design organizations, research institutes, and energy companies. Their professional work involves mathematical modeling of energy processes, developing digital models of power plants and energy complexes, optimizing equipment operation, and improving the efficiency of energy systems. Graduates are in demand in engineering centers, power engineering, and higher education institutions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10148","passing":""},
  {"id":"10149","name":"Boilers, Combustion Chambers, Steam Generators of Nuclear Power Plants and Their Auxiliary Elements","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":2,"cost":490000,"exam":"Applicant's scientific portfolio competition, Special discipline corresponding to the scientific specialty of the postgraduate training program","about":"The program is aimed at training researchers in the development, calculation, and improvement of boiler systems, combustion chambers, and steam generators for thermal and nuclear power plants. It examines heat transfer, fuel combustion, fluid dynamics of working environments, and improving equipment reliability. Particular attention is paid to operational safety, resource conservation, environmental friendliness of power plants, and the improvement of auxiliary systems at power units.","learn":"Analysis of fuel combustion processes in power plants | Evaluation of the reliability of power unit equipment | Development of solutions to improve the efficiency of boiler plants | Analysis of the operating characteristics of NPP steam generators | Calculation of thermal processes in boilers and steam generators | Modeling of hydrogasdynamic processes in combustion chambers","career":"Graduates work in power engineering organizations, design institutes, and research centers for thermal and nuclear energy. Their professional activities involve the calculation and design of boiler systems, combustion chambers, and steam generators, the analysis of heat transfer and fuel combustion processes, and improving the reliability and efficiency of power equipment. Graduates are in demand by energy companies, engineering organizations, and universities.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10149","passing":""},
  {"id":"10150","name":"Thermal Power Plants, Their Energy Systems and Units","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":1,"cost":490000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is designed to train researchers in the design, modeling, and efficiency improvement of thermal power plants and their primary equipment. It examines the processes of converting thermal energy into electrical energy, methods for optimizing power unit operating modes, increasing equipment reliability and service life, and implementing modern resource-saving and environmental safety technologies. Significant attention is paid to improving thermal power plant power units and systems.","learn":"Modeling Thermal Power Plant Operating Modes | Optimizing Power Unit and Power Aggregate Parameters | Analyzing Thermal Power Plant Equipment Reliability | Developing Solutions to Improve Power Unit Efficiency | Studying Thermal Processes in Power Plants | Assessing the Environmental Performance of Thermal Power Plants","career":"Graduates work in energy companies, design institutes, and thermal power research organizations. Their professional activities involve designing and analyzing thermal power plant operating modes, optimizing power unit parameters, improving equipment reliability, and implementing resource-saving technologies. Graduates are in demand in the power engineering industry, engineering companies, and higher education institutions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10150","passing":""},
  {"id":"10153","name":"Industrial Design","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":0,"cost":190000,"exam":"Drawing (creative challenge), Portfolio (creative challenge), Russian language, Literature","about":"The Industrial Design program teaches students how to create convenient and aesthetically pleasing everyday objects—from furniture and lamps to household appliances and equipment. Students master the design of products with new features, 3D modeling and visualization, material selection, and user experience and market analysis. Graduates are able to develop products from sketch to prototype, considering ergonomics, technological limitations, environmental standards, and design trends to make life more comfortable and beautiful.","learn":"Preparation of technical documentation and presentations for design projects | Selection of materials and technologies taking into account functional, aesthetic, and economic parameters | Proficiency in 3D modeling, visualization, and graphic editors | Development of design solutions in the fields of graphic, interior, industrial, and media design. | Analysis of user needs and market trends for the development of relevant design products | Creation of visual communication systems and corporate identity (corporate styles, logos, navigation). | Design of subject-spatial and information-communication environments (interiors, navigation, media resources, etc.) taking into account utilitarian and aesthetic requirements.","career":"Graduates work in educational and scientific organizations (schools, universities, research institutes), cultural and artistic institutions (museums, galleries, creative studios), IT and telecommunications companies, architectural and design firms, surveying organizations, media, publishing houses, and printing companies. They are also in demand in the light and textile industries (fashion and textile design), the automotive industry (industrial design), and diversified companies as designers in various fields.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10153","passing":"","directionCode":"54.03.01","direction":"Design"},
  {"id":"10154","name":"Media Design","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":0,"cost":190000,"exam":"","about":"The Media Design program teaches design of media environments: internet content, TV, video, animation, and photography. Its concept is based on media synthesis—a response to the development of digital technologies in the hypermodern era. Students master video, animation, photography, design for TV and web platforms, principles of visual communication, and the integration of various media formats. Graduates create multidimensional projects combining graphics, video, and interactive elements, and work with modern tools for shaping media environments.","learn":"Development of design solutions in the fields of graphic, interior, industrial, media and art design | Proficiency in design tools: 3D modeling programs, graphic editors, animation and video editing tools | Creation of visual communications: from printing and typography to navigation systems and corporate identity | Working with media content: video design, digital animation, design of online resources and TV materials | Layout, design and structural organization of spaces and complexes of objects taking into account ergonomics and aesthetics | Design of subject-spatial and information-communication environments (interiors, navigation, media resources, corporate styles) taking into account utilitarian and aesthetic requirements.","career":"Graduates work in education and science (universities, schools, research institutes), cultural and artistic institutions (galleries, museums, creative studios), IT companies, and telecommunications organizations. They are hired by architectural firms, surveying firms, media outlets, publishing houses, and printing companies. Specialists are in demand in the light and textile industries (textile and apparel design), the automotive industry (industrial design), and companies across various industries in design positions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10154","passing":"","directionCode":"54.03.01","direction":"Design"},

ices), in research institutes (development of diagnostic methods and photonic technologies), in service and repair centers (after-sales service of technical systems), as well as in companies developing information-measuring systems and software for diagnostics.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10188","passing":"","directionCode":"12.03.01","direction":"Instrumentation"},

ineering"},

  {"id":"10199","name":"Mechanics of Fluids, Gases and Plasmas","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":1,"cost":490000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is aimed at training researchers in the field of fundamental physical and mathematical sciences, studying the laws of motion and equilibrium of continuous media (liquids, gases, and ionized gases—plasma) under the action of external and internal forces, as well as heat and mass transfer processes within them. Approaches to kinetic theory and continuum mechanics are considered, as are the processes and phenomena accompanying the flow of homogeneous and multiphase media under mechanical, thermal, electromagnetic, and other influences, as well as those occurring during the interaction of fluids with moving or stationary bodies.","learn":"Conducting experimental studies of dynamic processes in continuous media | Analysis of heat and mass transfer, turbulence, and flow stability | Mathematical modeling of liquid, gas, and plasma flows in natural and technical systems | Developing models of aerodynamic, energy, and technological processes | Applying numerical methods to solve problems of hydrodynamics and gas dynamics | Studying multiphase media, shock waves, and flows with chemical reactions","career":"Graduates work in research organizations, universities, design bureaus, and engineering centers focused on hydrodynamics, aerodynamics, gas dynamics, and plasma physics. They contribute to the development of mathematical flow models, the study of heat and mass transfer processes, the design of energy and aerospace systems, and the analysis of natural and man-made processes. Graduates are in demand in the energy, aerospace, instrumentation, ecology, and higher education institutions as teachers and researchers.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10199","passing":""},

  {"id":"10205","name":"Electrical Systems and Equipment: Power Supply Systems for Consumers","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":1,"cost":480000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is designed to train specialists in the design, research, and operation of power supply systems for industrial enterprises, transport facilities, and infrastructure complexes. Students study methods for analyzing electrical grid conditions, ensuring power supply reliability, managing power flows, and improving consumer energy efficiency. Particular attention is paid to issues of power quality, digitalization of power supply systems, and the integration of distributed generation.","learn":"Implementation of intelligent power supply management systems | Analysis of electrical network operating modes | Ensuring the reliability and quality of electricity | Developing solutions to improve the energy efficiency of enterprises | Calculation and design of consumer power supply systems | Modeling of distribution energy systems","career":"Graduates work in energy companies, design organizations, grid companies, and industrial holdings. They design and operate power supply systems for enterprises and infrastructure facilities, analyze electrical network conditions, and implement modern energy management solutions. Graduates are also in demand at research organizations and universities as researchers and teachers in the field of electric power and electrical systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10205","passing":""},
  {"id":"10206","name":"Power Systems and Equipment: Renewable Energy Power Plants","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":5,"cost":490000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is aimed at training researchers in the development, modeling, and optimization of power plants based on renewable energy sources. It examines the principles of energy conversion from water flows, solar radiation, wind, biomass, and geothermal resources, as well as methods for increasing the efficiency of power plants and their integration into modern energy systems. Particular attention is paid to issues of reliability, resource conservation, environmental safety, and hybrid energy systems using traditional and alternative energy sources.","learn":"Reliability and efficiency analysis of renewable energy power plants | Evaluation of environmental and technical-economic characteristics of energy solutions | Study of operating modes of wind, solar and hydroelectric power plants | Optimization of parameters of hybrid energy complexes | Design of systems for integrating renewable energy sources into energy complexes | Development of mathematical models of power plants based on renewable energy sources","career":"Graduates work in research centers, design organizations, and energy companies developing and implementing renewable energy systems. Their professional work involves designing hybrid energy systems, analyzing the operating modes of renewable energy systems, and improving their efficiency and reliability. Graduates are in demand in power engineering, the distributed generation industry, engineering companies, and higher education institutions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10206","passing":""},
  {"id":"10207","name":"Power Systems and Equipment: Boilers, Combustion Chambers, Nuclear Power Plant Steam Generators and Auxiliary Components","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":0,"cost":450000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program \"Energy Systems and Complexes. Boilers, Combustion Chambers, Steam Generators for Nuclear Power Plants, and Their Auxiliary Components\" is designed to train researchers in the development, calculation, and improvement of boiler systems, combustion chambers, and steam generators for thermal and nuclear power plants. Heat transfer processes, fuel combustion, fluid dynamics of working environments, and improving equipment reliability are considered. Particular attention is paid to operational safety, resource conservation, environmental friendliness of power plants, and the improvement of auxiliary systems for power units.","learn":"Calculation of thermal processes in boilers and steam generators | Analysis of fuel combustion processes in power plants | Modeling of hydrogasdynamic processes in combustion chambers | Evaluation of the reliability of power unit equipment | Development of solutions to improve the efficiency of boiler plants | Analysis of the operational characteristics of NPP steam generators","career":"Graduates work in power engineering organizations, design institutes, and research centers for thermal and nuclear energy. Their professional activities involve the calculation and design of boiler systems, combustion chambers, and steam generators, the analysis of heat transfer and fuel combustion processes, and improving the reliability and efficiency of power equipment. Graduates are in demand by energy companies, engineering organizations, and universities.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10207","passing   {"id":"10208","name":"Power Systems and Equipment: Fuel and Coolant Technologies","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":1,"cost":490000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is aimed at training researchers in the properties, preparation, and efficient use of energy fuels and coolants in power plants. It covers the physicochemical processes of combustion, heat and mass transfer, water chemistry of power equipment, and fuel and coolant preparation technologies for thermal and nuclear power plants. Particular attention is paid to improving the efficiency of fuel and energy resource use, reducing pollutant emissions, and ensuring the reliable operation of power plants.","learn":"Analysis of the physicochemical combustion processes of energy fuels | Study of water-chemistry regimes of power plants | Modeling of heat and mass transfer processes in energy systems | Increasing the efficiency of fuel and energy resources | Development of fuel and coolant preparation modes | Assessment of the environmental characteristics of energy technologies","career":"Graduates work in energy companies, research organizations, and design institutes for thermal and nuclear power. Their professional activities involve developing fuel and coolant preparation technologies, ensuring water chemistry for power plants, analyzing combustion processes and heat and mass transfer, and improving fuel efficiency. Graduates are in demand in power engineering, industry laboratories, and higher education institutions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10208","passing":""},
  {"id":"10209","name":"Power Systems and Equipment: Thermal Power Plants, Their Power Systems and Equipment","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":0,"cost":450000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program \"Energy Systems and Complexes. Thermal Power Plants, Their Energy Systems and Units\" is designed to train researchers in the design, modeling, and efficiency improvement of thermal power plants and their primary equipment. It examines the processes of converting thermal energy into electrical energy, methods for optimizing power unit operating modes, increasing equipment reliability and service life, and implementing modern resource-saving and environmental safety technologies. Significant attention is paid to improving thermal power plant energy units and systems.","learn":"Modeling Thermal Power Plant Operating Modes | Optimizing Power Unit and Power Aggregate Parameters | Analyzing Thermal Power Plant Equipment Reliability | Developing Solutions to Improve Power Unit Efficiency | Studying Thermal Processes in Power Plants | Assessing the Environmental Performance of Thermal Power Plants","career":"Graduates work in energy companies, design institutes, and thermal power research organizations. Their professional activities involve designing and analyzing thermal power plant operating modes, optimizing power unit parameters, improving equipment reliability, and implementing resource-saving technologies. Graduates are in demand in the power engineering industry, engineering companies, and higher education institutions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10209","passing":""},
  {"id":"10210","name":"Theoretical and Applied Heat Engineering: Industrial Power Engineering and Energy Conservation","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":2,"cost":480000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is aimed at training researchers in the field of improving the energy efficiency of industrial enterprises and developing systems for the rational use of fuel and energy resources. Methods for analyzing energy consumption, optimizing thermal processes, improving heat supply systems, and implementing energy-saving technologies are covered. Particular attention is paid to the mathematical modeling of energy systems, reducing energy losses, improving the reliability of energy supply to enterprises, and developing low-waste energy solutions.","learn":"Analysis of the energy consumption structure of industrial enterprises | Optimization of operating modes of heat supply systems | Development of solutions to reduce energy losses | Development of measures to save energy and improve energy efficiency | Modeling of energy technology systems of enterprises | Evaluation of the efficiency of fuel and energy resources","career":"Graduates work in energy departments at industrial enterprises, design organizations, and research centers. Their professional work involves analyzing energy consumption, developing energy-saving technologies, optimizing heating systems, and improving energy efficiency. Graduates are in demand in metallurgy, mechanical engineering, the oil and gas industry, energy, engineering companies, and higher education institutions.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10210","passing":""},
  {"id":"10211","name":"Theoretical and Applied Heat Engineering: Thermophysics","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":2,"cost":480000,"exam":"A special discipline corresponding to the scientific specialty of the postgraduate training program, a competition for the applicant's scientific portfolio","about":"The program is aimed at training researchers in the field of fundamental and applied processes of energy, mass, and momentum transfer in various media. It examines the thermophysical properties of substances, convective and radiative heat exchange processes, phase transitions, and heat and mass transfer in single- and multiphase systems. Particular attention is paid to the development of physical and mathematical models of thermophysical processes and their application in the creation of energy-efficient thermal engineering systems and installations for various purposes.","learn":"Study of thermophysical properties of substances and heat carriers | Analysis of convective and radiative heat transfer | Development of mathematical models of thermophysical processes | Study of phase transformations in heat and power processes | Application of thermophysical analysis methods to engineering systems | Modeling of heat and mass transfer processes in continuous media","career":"Graduates work in research organizations, engineering centers, and universities. Their professional activities involve studying heat and mass transfer processes, developing mathematical models of thermophysical phenomena, creating energy-efficient heating systems, and analyzing the properties of working fluids. Graduates are in demand in the energy, nuclear, mechanical engineering, aerospace, and higher education sectors.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10211","passing":""},

  {"id":"10216","name":"International Relations","level":"PhD","inst":"","campus":"Moscow","budget":0,"contract":1,"cost":470000,"exam":"Applicant's scientific portfolio competition, Special discipline corresponding to the scientific specialty of the postgraduate training program","about":"The program is aimed at training researchers in the fields of international relations, world politics, and global processes. It examines theoretical and applied aspects of the formation of world order, international security, state foreign policy, and the activities of international organizations. Particular attention is paid to the analysis of regional subsystems of international relations, geopolitical processes, international political economy, migration, and humanitarian issues.","learn":"Conducting a comparative analysis of regional subsystems of international relations | Researching foreign policy strategies of states and international organizations | Analyzing factors of international security and contemporary international conflicts | Studying geopolitical processes and the transformation of the world order | Researching international economic and integration processes | Conducting an international political analysis of global and regional processes","career":"Graduates work in research centers, higher education institutions, government agencies, analytical bodies, and international organizations. Their professional activities involve researching global and regional political processes, preparing analytical materials on international security and foreign policy, and providing expert support for international cooperation and integration projects. Graduates are in demand in international analytics, diplomacy, public administration, and expert consulting in global politics.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10216","passing":""},

const INST_FULL = {"ITCS":"Institute of Information Technologies and Computer Science","IRE":"V. A. Kotelnikov Institute of Radio Engineering and Electronics","IEPE":"Institute of Electrical Power Engineering","IEEE":"Institute of Electrical Engineering and Electrification","ITNPE":"Institute of Thermal and Nuclear Power Engineering","IPMM":"Institute of Power Machinery and Mechanics","IEEHT":"Institute of Energy Efficiency and Hydrogen Technologies","IHRE":"Institute of Hydropower and Renewable Energy","EEI":"Engineering-Economic Institute","IHAS":"Institute of Humanities and Applied Sciences","IDAE":"Institute of Distance and Additional Education"};
const INST_ORDER = ["ITCS", "IRE", "IEPE", "IEEE", "ITNPE", "IPMM", "IEEHT", "IHRE", "EEI", "IHAS", "IDAE"];
const INST_COLOR = {"ITCS": "#2563eb", "IRE": "#7c3aed", "IEPE": "#dc2626", "IEEE": "#ea580c", "ITNPE": "#0891b2", "IPMM": "#0d9488", "IEEHT": "#16a34a", "IHRE": "#0284c7", "EEI": "#ca8a04", "IHAS": "#db2777", "IDAE": "#475569"};
const LEVELS = ["Bachelor’s","Master’s","PhD"];
const DEFAULT_AC = "#204B71";
const BUDGET_TEXT = "No program-specific cap within the overall limit";

let state = {level: "Bachelor’s", inst: "all", direction: "", q: ""};

const fmtMoney = n => (n==null) ? "—" : n.toLocaleString("en-US") + " RUB";
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function levelCounts(){
  const c={}; LEVELS.forEach(l=>c[l]=0);
  DATA.forEach(p=>{if(c[p.level]!=null)c[p.level]++});
  return c;
}
function instColor(code){return DEFAULT_AC;} // MPEI blue

function renderTabs(){
  const c=levelCounts();
  document.getElementById("tabs").innerHTML = LEVELS.map(l=>
    `<button class="tab ${l===state.level?'active':''}" data-l="${l}">${l}<span class="cnt">${c[l]}</span></button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    state.level=b.dataset.l;
    state.inst="all";
    state.direction="";
    renderTabs();
    renderFilters();
    renderDirectionFilter();
    renderContent();
  });
}

function institutesFor(level){
  const set=new Set(DATA.filter(p=>p.level===level && p.inst).map(p=>p.inst));
  return INST_ORDER.filter(i=>set.has(i));
}

function renderFilters(){
  const insts=institutesFor(state.level);
  const box=document.getElementById("filt");
  if(insts.length===0){box.innerHTML="";return;}
  let h=`<button class="chip ${state.inst==='all'?'active':''}" data-i="all" style="${state.inst==='all'?'background:var(--blue)':''}">All institutes</button>`;
  h+=insts.map(i=>
    `<button class="chip ${state.inst===i?'active':''}" data-i="${i}" title="${esc(INST_FULL[i]||'')}" style="${state.inst===i?'background:var(--blue)':''}">${i}</button>`
  ).join("");
  box.innerHTML=h;
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    state.inst=b.dataset.i;
    renderFilters();
    renderDirectionFilter();
    renderContent();
  });
}

function renderDirectionFilter(){
  const available = new Map();
  DATA.forEach(p=>{
    if(p.level!==state.level || !p.directionCode) return;
    if(state.inst!=="all" && p.inst!==state.inst) return;
    available.set(p.directionCode, p.direction);
  });

  const select = document.getElementById("direction");
  if(!available.has(state.direction)) state.direction="";
  document.getElementById("directionFilter").hidden = available.size===0;
  const options = [...available].sort(([a],[b])=>a.localeCompare(b));
  select.replaceChildren(
    new Option("All fields of study", ""),
    ...options.map(([code,name])=>new Option(code+" "+name, code))
  );
  select.value = state.direction;
}

function cardHTML(p){
  const ac=instColor(p.inst);
  const tag = p.inst ? p.inst : "Research specialty";
  const facts=[];
  if(p.budget!=null) facts.push(`<div class="fact"><span>Tuition-free places</span><b class="bnd">${BUDGET_TEXT}</b></div>`);
  if(p.contract!=null) facts.push(`<div class="fact"><span>Tuition-based places</span><b>${p.contract}</b></div>`);
  if(p.cost!=null) facts.push(`<div class="fact"><span>Tuition per year</span><b>${fmtMoney(p.cost)}</b></div>`);
  return `<div class="card" style="--ac:${ac}" data-id="${p.id}">
    <span class="tag">${esc(tag)}</span>
    <h3>${esc(p.name)}</h3>
    ${p.directionCode?`<p class="direction">${esc(p.directionCode)} ${esc(p.direction)}</p>`:""}
    ${facts.length?`<div class="facts">${facts.join("")}</div>`:""}
    <div class="more">View details <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>`;
}

function renderContent(){
  const root=document.getElementById("content");
  let list=DATA.filter(p=>p.level===state.level);
  if(state.inst!=="all") list=list.filter(p=>p.inst===state.inst);
  if(state.direction) list=list.filter(p=>p.directionCode===state.direction);
  if(state.q){const q=state.q.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q));}

  if(list.length===0){root.innerHTML=`<div class="empty">No programs found</div>`;bindCards();return;}

  const hasInst = list.some(p=>p.inst);
  if(!hasInst){
    root.innerHTML=`<div class="grid">${list.map(cardHTML).join("")}</div>`;
    bindCards();return;
  }
  // Group programs by institute
  let html="";
  const insts = (state.inst==="all") ? institutesFor(state.level).filter(i=>list.some(p=>p.inst===i)) : [state.inst];
  insts.forEach(i=>{
    const items=list.filter(p=>p.inst===i);
    if(!items.length)return;
    html+=`<section class="inst">
      <div class="inst-h">
        <span class="inst-badge">${i}</span>
        <span class="inst-name">${esc(INST_FULL[i]||i)}</span>
        <span class="inst-count">${items.length} ${items.length===1?'program':'programs'}</span>
      </div>
      <div class="grid">${items.map(cardHTML).join("")}</div>
    </section>`;
  });
  // Render programs without an institute
  const noInst=list.filter(p=>!p.inst);
  if(noInst.length){html+=`<section class="inst"><div class="grid">${noInst.map(cardHTML).join("")}</div></section>`;}
  root.innerHTML=html;
  bindCards();
}

function bindCards(){
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{ location.hash = "p"+c.dataset.id; });
}

function renderDetail(p){
  const ac=instColor(p.inst);
  const stats=[];
  if(p.budget!=null) stats.push(`<div class="m-stat"><div class="k">Tuition-free places</div><div class="v sm">${BUDGET_TEXT}</div></div>`);
  if(p.contract!=null) stats.push(`<div class="m-stat"><div class="k">Tuition-based places</div><div class="v">${p.contract}</div></div>`);
  if(p.cost!=null) stats.push(`<div class="m-stat"><div class="k">Tuition per year</div><div class="v">${fmtMoney(p.cost)}</div></div>`);
  if(p.campus) stats.push(`<div class="m-stat"><div class="k">Campus</div><div class="v">${esc(p.campus)}</div></div>`);

  // Split the topics into a list using pipes or semicolons
  let learnHTML="";
  if(p.learn){
    const items=p.learn.split(/\s*[|;]\s*/).map(s=>s.trim()).filter(Boolean);
    if(items.length>1){
      learnHTML=`<ul class="llist">${items.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
    }else{
      learnHTML=`<p>${esc(p.learn)}</p>`;
    }
  }
  const instLine = p.inst ? `<div class="inst-line">${esc(INST_FULL[p.inst]||p.inst)} (${esc(p.inst)})</div>` : "";

  let body="";
  if(p.about) body+=`<div class="sect"><h4>About the program</h4><p>${esc(p.about)}</p></div>`;
  if(learnHTML) body+=`<div class="sect"><h4>What you will learn</h4>${learnHTML}</div>`;
  if(p.career) body+=`<div class="sect"><h4>Where graduates work</h4><p>${esc(p.career)}</p></div>`;
  if(p.exam) body+=`<div class="sect"><h4>Entrance examinations</h4><div class="exam">${esc(p.exam)}</div></div>`;

  document.getElementById("detailView").innerHTML=`
    <div class="detail">
      <button class="back" onclick="backToList()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Back to programs
      </button>
      <div class="detail-card">
        <div class="m-head" style="--ac:${ac}">
          <div class="lv">${esc(p.level)}</div>
          <h2>${esc(p.name)}</h2>
          ${p.directionCode?`<p class="direction">${esc(p.directionCode)} ${esc(p.direction)}</p>`:""}
          ${instLine}
        </div>
        ${stats.length?`<div class="m-stats">${stats.join("")}</div>`:""}
        <div class="m-body">${body}</div>
        ${p.link?`<div class="m-foot"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Read more on studyinrussia.ru
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg></a></div>`:""}
      </div>
    </div>`;
  document.getElementById("listView").style.display="none";
  document.getElementById("detailView").style.display="block";
  window.scrollTo(0,0);
}

function showList(){
  document.getElementById("detailView").style.display="none";
  document.getElementById("detailView").innerHTML="";
  document.getElementById("listView").style.display="block";
}

function backToList(){ history.back(); }

function router(){
  const m=(location.hash||"").match(/^#p(.+)$/);
  if(m){
    const p=DATA.find(x=>String(x.id)===decodeURIComponent(m[1]));
    if(p){ renderDetail(p); return; }
  }
  showList();
}

window.addEventListener("hashchange",router);
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;renderContent();});

document.getElementById("direction").addEventListener("change",e=>{
  state.direction=e.target.value;
  renderContent();
});

renderTabs();renderFilters();renderDirectionFilter();renderContent();router();
</script>
  <!-- ====== IFRAME HEIGHT AND MODAL POSITION ====== -->
<script>
(function () {
  // --- 1. Send the content height to the parent page ---
  var lastH = 0;
  function sendHeight() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== lastH) {
      lastH = h;
      parent.postMessage({ mpeiType: 'height', height: h }, '*');
    }
  }
  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
  setInterval(sendHeight, 800); // Fallback for asynchronous rendering or font loading
  sendHeight();

  // --- 2. Center the modal in the user's viewport ---
  // (A fixed overlay inside a tall iframe would be outside the viewport)
  var overlay = document.getElementById('modalOverlay');
  var info = null;

  window.addEventListener('message', function (e) {
    if (e.data && e.data.mpeiType === 'pageInfo') { info = e.data; place(); }
  });

  function place() {
    if (!overlay || !overlay.classList.contains('open') || !info) return;
    var top = info.scrollY - info.offsetTop; // Top of the viewport relative to the iframe
    overlay.style.position = 'absolute';
    overlay.style.top = Math.max(0, top) + 'px';
    overlay.style.bottom = 'auto';
    overlay.style.left = '0';
    overlay.style.width = '100%';
    overlay.style.height = info.viewportH + 'px';
  }
  function reset() {
    if (!overlay) return;
    overlay.style.position = overlay.style.top = overlay.style.bottom =
      overlay.style.left = overlay.style.width = overlay.style.height = '';
  }
  if (overlay) {
    new MutationObserver(function () {
      if (overlay.classList.contains('open')) {
        parent.postMessage({ mpeiType: 'getPageInfo' }, '*');
        place();
      } else { reset(); }
    }).observe(overlay, { attributes: true, attributeFilter: ['class'] });
  }
})();
</script>
