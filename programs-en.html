<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Programs at MPEI</title>
<style>
  :root{
    --blue:#204B71; --blue-d:#163551; --red:#A22B3C; --ink:#1c2533;
    --muted:#667085; --line:#e6e9ef; --bg:#f5f7fb; --card:#fff;
    --radius:16px; --shadow:0 4px 18px rgba(13,38,76,.07);
    --shadow-h:0 10px 30px rgba(13,38,76,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       color:var(--ink);background:transparent;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  .head h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  .head p{margin:0 0 18px;color:var(--muted);font-size:15px;max-width:760px}

  /* Notice */
  .notice{display:flex;gap:13px;align-items:flex-start;background:#fff5f4;border:1px solid #ffd9d4;
          border-left:5px solid var(--red);border-radius:12px;padding:14px 18px;margin:0 0 22px}
  .notice .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;
              font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;line-height:1}
  .notice .nt{font-size:14px;color:#5a2b27;line-height:1.5}
  .notice .nt b{color:var(--red);font-weight:800}

  /* Tabs */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);
       font-size:15px;font-weight:600;padding:11px 20px;border-radius:999px;cursor:pointer;
       transition:.18s;display:flex;align-items:center;gap:9px}
  .tab .cnt{font-size:12px;font-weight:700;background:var(--bg);color:var(--muted);
            padding:2px 9px;border-radius:999px;transition:.18s}
  .tab:hover{border-color:#c7d2e3}
  .tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:var(--shadow)}
  .tab.active .cnt{background:rgba(255,255,255,.22);color:#fff}

  /* Controls */
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search,.direction-filter{position:relative;flex:1;min-width:240px}
  .direction-filter[hidden]{display:none}
  .search input,.direction-filter select{display:block;width:100%;height:44px;margin:0;
       padding:0 14px;border:1px solid var(--line);border-radius:12px;
       font:inherit;font-size:15px;color:var(--ink);background:var(--card);transition:.18s}
  .search input{padding-left:42px}
  .direction-filter select{-webkit-appearance:none;appearance:none;min-width:0;
       padding-right:42px;text-overflow:ellipsis;cursor:pointer}
  .search input:focus,.direction-filter select:focus{outline:none;border-color:var(--blue);
       box-shadow:0 0 0 3px rgba(32,75,113,.16)}
  .search svg,.direction-filter svg{position:absolute;top:50%;transform:translateY(-50%);
       color:var(--muted);pointer-events:none}
  .search svg{left:14px}
  .direction-filter svg{right:14px}
  .filt{display:flex;gap:8px;flex-wrap:wrap}
  .direction-filter:not([hidden]) + .filt{flex-basis:100%}
  .card .direction{margin:-6px 0 14px;color:var(--muted);font-size:13px;line-height:1.4}
  .m-head .direction{margin:0 0 8px;font-size:14px;font-weight:600}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;
        padding:8px 13px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:#c7d2e3;color:var(--ink)}
  .chip.active{color:#fff;border-color:transparent}

  /* Institute section */
  .inst{margin:30px 0 0}
  .inst-h{display:flex;align-items:center;gap:14px;margin:0 0 18px;padding:15px 20px;flex-wrap:wrap;
          background:linear-gradient(135deg,var(--blue),var(--blue-d));border-radius:14px;
          box-shadow:0 6px 20px rgba(32,75,113,.22);border-left:6px solid var(--red)}
  .inst-badge{font-size:15px;font-weight:800;color:var(--blue);background:#fff;padding:6px 13px;
              border-radius:9px;letter-spacing:.02em}
  .inst-name{font-size:19px;font-weight:700;letter-spacing:-.01em;color:#fff}
  .inst-count{font-size:13px;color:#fff;font-weight:700;margin-left:auto;
              background:rgba(255,255,255,.18);padding:5px 13px;border-radius:999px}

  /* Cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
        display:flex;flex-direction:column;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac,#204B71);
                opacity:0;transition:.18s}
  .card:hover{box-shadow:var(--shadow-h);transform:translateY(-3px);border-color:transparent}
  .card:hover::before{opacity:1}
  .card .tag{align-self:flex-start;font-size:11px;font-weight:800;color:var(--ac,#204B71);
             background:color-mix(in srgb,var(--ac,#204B71) 12%,#fff);padding:4px 9px;border-radius:6px;margin-bottom:11px}
  .card h3{font-size:16px;font-weight:700;margin:0 0 14px;line-height:1.32;letter-spacing:-.01em}
  .card .facts{margin-top:auto;display:flex;flex-direction:column;gap:7px;font-size:13px}
  .fact{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
  .fact b{color:var(--ink);font-weight:700;text-align:right}
  .fact b.bnd{font-size:11.5px;font-weight:600;color:#33405a;max-width:62%;line-height:1.3}
  .more{margin-top:15px;font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:6px}
  .more svg{transition:.18s}
  .card:hover .more svg{transform:translateX(3px)}

  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}

  /* Detail page */
  .detail{max-width:1000px;margin:0 auto;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .back{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
        color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;padding:10px 16px;border-radius:10px;
        margin-bottom:16px;transition:.15s}
  .back:hover{border-color:var(--blue);background:#f3f7fc}
  .detail-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .m-head{padding:28px 34px 24px;color:#fff;position:relative;background:linear-gradient(135deg,var(--ac,#204B71),color-mix(in srgb,var(--ac,#204B71) 60%,#163551))}
  .m-head .lv{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
  .m-head h2{margin:8px 0 12px;font-size:26px;font-weight:800;line-height:1.2}
  .m-head .inst-line{font-size:13.5px;opacity:.92;font-weight:600}
  .x{position:absolute;top:18px;right:18px;width:36px;height:36px;border:none;border-radius:50%;
     background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;line-height:1;transition:.15s}
  .x:hover{background:rgba(255,255,255,.32)}
  .m-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;padding:22px 34px 6px}
  .m-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .m-stat .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .m-stat .v{font-size:17px;font-weight:800;color:var(--ink);line-height:1.2}
  .m-stat .v.sm{font-size:13px;font-weight:700;line-height:1.3}
  .m-body{padding:10px 34px 30px}
  .sect{padding-top:22px}
  .sect h4{font-size:14px;font-weight:800;color:var(--blue);margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sect h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
  .sect p{margin:0;color:#33405a;font-size:14.5px;line-height:1.62}
  .llist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .llist li{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13.5px;color:#33405a}
  .exam{background:#fff7f6;border:1px solid #ffe0dc;border-radius:12px;padding:14px 16px;font-size:14px;color:#5a2b27}
  .m-foot{flex:0 0 auto;padding:16px 30px;border-top:1px solid var(--line);background:#fbfcfe}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--blue);color:#fff;text-decoration:none;
       font-weight:700;font-size:15px;padding:13px 24px;border-radius:12px;transition:.18s}
  .btn:hover{background:var(--blue-d)}
  body.lock{overflow:hidden}

  @media(max-width:600px){
    .head h1{font-size:24px}
    .grid{grid-template-columns:1fr}
    .direction-filter{flex-basis:100%;min-width:0}
    .m-head,.m-body,.m-foot,.m-stats{padding-left:20px;padding-right:20px}
    .m-head h2{font-size:21px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="listView">
    <div class="head">
      <h1>Study Programs at MPEI</h1>
      <p>Explore bachelor’s, master’s, and PhD programs for international students. Choose a level of study and an institute, then select a program to learn more.</p>

    <div class="tabs" id="tabs"></div>

    <div class="controls">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

      </div>
      <div class="filt" id="filt"></div>
