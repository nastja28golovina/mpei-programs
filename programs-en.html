  {"id":"2034","name":"Economics of Enterprises and Organizations","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":0,"cost":370000,"exam":"Mathematics, Computer Science (optional), Social Science (optional), Russian Language","about":"The program trains specialists for economic and managerial work at enterprises across various industries. Graduates are prepared for calculation and economic, scientific research, and organizational management work in economic, financial, marketing, and analytical departments. They are skilled in cost and production planning, pricing management, business planning, investment justification, budget planning, and financial and economic analysis.","learn":"Industry Economics | Enterprise Marketing Activities | Economics and Quality Management | Strategic Planning and Management | Enterprise Finances | Energy Economics | Cost Management in an Organization | Methods for Effective Use of an Enterprise's Human Resources","career":"Graduates work in the financial sector (banking, insurance, auditing, consulting, financial markets); in expert-analytical services and government agencies (analysis and forecasting of socio-economic processes); in industry and business (economic planning services, investments, transport, logistics, trade); in education and science (universities, research institutes). They are engaged in analysis, planning, financial control, consulting, and scientific research.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2034","passing":"258","directionCode":"38.03.01","direction":"Economics"},
  {"id":"2037","name":"Information and Software Support for Business Processes","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":3,"cost":370000,"exam":"Computer Science (optional), Social Science (optional), Mathematics, Russian Language","about":"The program provides a fundamental education in information and communications technology, mathematics, economics, and management for the energy and innovation industries. Graduates master big data analysis, information security, cloud computing, business intelligence systems, and web technologies for business management. They are prepared for project-based, analytical, and organizational management activities, including strategic IT systems planning and economic evaluation of IT projects.","learn":"IT Infrastructure for Business | Software Standardization, Certification, and Quality Management | Business Intelligence Systems | Cloud Computing | IT Management | Web Technologies for Business Management | Enterprise Architecture | Economic Evaluation of IT Projects | Programming, Databases","career":"Graduates work in banks, investment and consulting firms, analytical and marketing organizations, and state and municipal government agencies. They are in demand in the energy sector, large industrial companies, and organizations across various industries actively implementing information technology, where they analyze business processes, manage IT systems, conduct economic evaluations of IT projects, and optimize information infrastructures.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2037","passing":"270","directionCode":"38.03.05","direction":"Business Informatics"},
  {"id":"2066","name":"Advertising and Public Relations","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":1,"cost":370000,"exam":"Russian language, Social science, Computer science (optional), Foreign language (optional), History (optional)","about":"The goal of this educational program is to train qualified specialists in advertising, marketing, and public relations who possess up-to-date knowledge of the media environment, skills in developing and implementing effective communications strategies, market and target audience analysis, brand and image management, and an understanding of the legal and ethical aspects of professional activity for successful work in the dynamically developing media industries.","learn":"Corporate communications: shaping the internal and external image of companies | Organizing the work of advertising and public relations departments in the media | Media production: creating advertising, information, and content for various communication channels | Methods of market research and evaluating the effectiveness of advertising campaigns | Ability to develop creative and effective advertising campaigns","career":"Graduates of the program can work in advertising agencies, PR and communications agencies, marketing departments of commercial companies, and in the media (television, radio, online publications). They are in demand in press offices and public relations departments, media companies, research and analytical centers. Specialists will be able to hold positions as advertising and PR managers, brand managers, marketers, media planners, communications specialists, and market analysts. They can also participate in the development and implementation of advertising and communications campaigns, conduct marketing and sociological research, and manage the image of organizations and media.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2066","passing":"","directionCode":"42.03.01","direction":"Advertising and Public Relations"},
  {"id":"2072","name":"Translation and Translation Studies","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":1,"cost":370000,"exam":"Russian language, History (optional), Literature (optional), Social science (optional), Foreign language","about":"The educational program is aimed at training highly qualified translators proficient in two or more foreign languages and with a deep understanding of intercultural communication. The curriculum combines fundamental humanities training with intensive practical training in written and interpreting translation, as well as mastery of modern information technologies in linguistics. Students study language theory, the specifics of translating texts across various genres (technical, legal, and literary), and the ethics of professional communication.","learn":"Official and business documentation in foreign languages | Specialized terminology in various professional fields | History and culture of the countries of the studied language | Theory and practice of translation | Computer-aided translation systems | Linguistic technologies in marketing and PR","career":"Graduates work as foreign language teachers in schools, universities, and language centers; translators and interpreters in translation agencies, international companies, and government agencies; intercultural communication specialists and delegation support in diplomacy and international business; editors and content localizers in the media and international publishing houses; guides and international tourism managers; and employees of foreign partner relations departments in commercial organizations.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2072","passing":"","directionCode":"45.03.02","direction":"Linguistics"},

ng companies; in enterprises of the light and textile industries – as fashion and textile designers; in the automotive industry – in industrial design departments; and also in companies of various industries – in positions of general designers.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2078","passing":"","directionCode":"54.03.01","direction":"Design"},
  {"id":"2079","name":"Interior Design","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":1,"cost":710000,"exam":"Literature, Portfolio, Russian Language, Drawing","about":"The program's goal is to provide high-quality training for design professionals who, based on theoretical knowledge and practical skills, are capable of performing artistic and design work in the field of creating design products, designing design objects, and solving design problems.","learn":"Development of comprehensive design projects: from concept to technical documentation and final visualization | Development of design solutions in the fields of graphic, interior, industrial, media, and art design | Creation of visual communication and corporate identity systems, including navigation and corporate styles | Selection of finishing and decorative materials, taking into account their functional and aesthetic properties | Design of subject-spatial and architectural-design environments (residential and public spaces, media environment objects, etc.) taking into account utilitarian and aesthetic needs | Planning and zoning of spaces, design of engineering systems (lighting, ventilation, etc.) in the context of interior design | Proficiency in 3D visualization and design programs for creating sketches, drawings, and renderings","career":"Graduates work in educational and scientific organizations (kindergartens, schools, universities, research institutes), cultural and artistic institutions (museums, galleries, design studios), IT companies, and telecom organizations. They are in demand in architectural and design firms, media outlets, publishing houses, and printing companies. They are also sought after in the light and textile industries (fashion and textile design), the automotive industry (industrial design), and companies across various industries as general designers.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/2079","passing":"","directionCode":"54.03.01","direction":"Design"},
  {"id":"8818","name":"Mathematical Methods and Software for Computers and Computer Networks","level":"Master’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":3,"cost":408000,"exam":"Entrance examination in the chosen field of study","about":"The advanced training program provides the opportunity to master modern programming technologies, various programming languages and systems, thoroughly understand the structure of modern operating systems, databases and knowledge, study the architecture of modern computers, including parallel and distributed systems, master network technologies, artificial intelligence methods and technologies for designing promising intelligent systems for various purposes.","learn":"Software Engineering and Systems Programming | Programming Languages, Algorithms, Libraries, and Software Packages | Mathematical and Software Support for Computer Networks | Artificial Intelligence Systems and Intelligent Systems Development Technologies | Mathematical Models of Complex Systems: Theory, Algorithms, and Applications; Mathematical and Computerized Image Processing Methods","career":"Graduates of the program work in the field of communications and information and communications technology, designing and developing software, testing software solutions, and creating and supporting information and communications systems and databases. They are also involved in developing internet resources, systems programming, and working with big data technologies. These specialists are also in demand in the nuclear industry, where expertise in IT support, process digitalization, and the design of specialized information systems is required.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/8818","passing":"","directionCode":"01.04.02","direction":"Applied Mathematics and Informatics"},

  {"id":"8891","name":"Industrial Electronics and Microprocessor Technology","level":"Master’s","inst":"IRE","campus":"Moscow","budget":0,"contract":1,"cost":450000,"exam":"Entrance examination in the chosen field of study","about":"The program is designed to train specialists for the electronics and related industries. The curriculum focuses on mastering modern science-intensive technologies, including nanoelectronics. The program develops competencies in the design, research, and operation of electronic devices, as well as the development of manufacturing processes.","learn":"Design and modernization of electronic devices using modern research and modeling methods | Conducting scientific research in the field of electronics and nanoelectronics | Using specialized software for modeling and designing electronic products | Development and optimization of technological processes for the production of electronic products | Working with diagnostic and technological equipment","career":"Graduates are in demand in the electronics industry and related sectors that utilize high-tech technologies. They work in research centers and manufacturing companies specializing in the development of electronic devices and components. Specialists can design microprocessor systems, develop new materials for electronics, and create nanoelectronic devices.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/8891","passing":"","directionCode":"11.04.04","direction":"Electronics and Nanoelectronics"},

  {"id":"10108","name":"Mathematical and Computer Modeling in Mechanics","level":"Bachelor’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":5,"cost":410000,"exam":"Russian language, Mathematics, Computer science (optional), Physics (optional)","about":"The program is aimed at training highly qualified specialists in applied mechanics, mathematics, and computer science. They possess fundamental mechanical and mathematical training, possess advanced information technology, and are capable of participating in the mathematical and computer modeling of mechanical systems and processes, as well as in the development of systems and software. Special attention is paid to mathematical modeling methods, computer implementation of mathematical models, modern information technology, and its application in research, design, and production.","learn":"Process and interpret data obtained during field or computational experiments, prepare technical reports and conclusions | Conduct reliability analysis and optimization of mechanical systems, search for optimal shapes and materials for future products | Conduct complex engineering calculations based on methods of mathematical physics and numerical algorithms | Design and conduct virtual experiments: creating digital twins of real objects to analyze their strength, stability, and dynamics | Develop and implement specialized software for solving problems of continuum mechanics and solid mechanics | Model multicomponent and multiphase processes: for example, fluid flow, the interaction of structures with liquids and gases, or the propagation of vibrations","career":"Graduates can work in education and science, teaching and conducting research, architecture and design, and performing mathematical and computer modeling of complex systems and structures. They are in demand in the oil and gas, nuclear, rocket and space industries, shipbuilding, automotive, and aircraft manufacturing, where they apply methods of mathematical modeling, computational mechanics, numerical methods, and reliability analysis. Work in cross-cutting industrial activities is also possible, including research and development, algorithm development, software development, and models of mechanical systems and processes.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10108","passing":"256","directionCode":"01.03.03","direction":"Mechanics and Mathematical Modeling"},
  {"id":"10109","name":"Gas and Steam Turbine Units and Engines","level":"Bachelor’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Russian language, Physics, Mathematics (optional), Computer science (optional)","about":"The program trains highly qualified specialists in the design, construction, and operation of steam and gas turbine units and engines. The program combines theoretical training with practical skills: students work in a modern laboratory, conduct aerodynamic research on turbomachine components, and master CAD/CAE systems and 3D design methods. Particular attention is paid to computational fluid dynamics: students learn to model flows, analyze calculation results, and optimize designs taking into account hydrodynamic and aerodynamic loads.","learn":"Automatic Control of Turbomachinery Plants | Fundamentals of CAD/CAE Applications for Designing Turbomachinery Components | Gas Turbine and Steam Turbine Plants, Combined Plants | Bladed Turbomachinery, Compressor Machines | Design of Turbomachinery Components and Assemblies, Strength of Materials and Turbomachinery Components | Fluid and Gas Mechanics | Heat Exchangers for Power Plants","career":"Graduates work as: design engineers and designers of power equipment; scientific researchers and researchers (including in research and development); installation installers and adjusters; technicians and engineers for the operation, maintenance, diagnostics, repair, and modernization of equipment; and managers and project managers in the energy sector. They are employed at thermal and nuclear power plants, power engineering enterprises, in design and service organizations, as well as at small-scale power generation facilities and compressor units.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10109","passing":"215","directionCode":"13.03.03","direction":"Power Machinery Engineering"},
  {"id":"10110","name":"Fundamental and Applied Problems in Mechatronics and Robotics","level":"Bachelor’s","inst":"IPMM","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Mathematics, Russian language, Physics (optional), Computer science (optional)","about":"The program is aimed at training specialists in the development of intelligent control systems and robotic systems. Students learn to create control algorithms for mechatronic units and distributed robotic systems to automate complex processes in industry, energy, transportation, aerospace, and the social sector.","learn":"Robot and Mechatronic Device Control | Robot and Mechatronic Systems Control and Modeling | Industrial Robotics | CAD/CAE Technologies in Robotics and Mechatronics | Hydropneumatic Drive of Mechatronic and Robotic Devices | Computational Methods of Computer Modeling in Mechanics | Electric Drive of Mechatronic and Robotic Devices | Fundamentals of Computer Modeling and Design of Robotic Devices and Systems | Electrical Engineering and Electronics | Automatic Control Theory | Mathematical Analysis | Theoretical Mechanics | Mechanics of Materials and Structures","career":"Graduates work in education, science, the rocket and space and aviation industries, automotive and shipbuilding, nuclear power, and mechanical engineering. They develop and implement robots and mechatronic systems, creating software, designing autonomous vehicles and intelligent systems, and automating production. They apply their skills to the creation of exoskeletons and prosthetics, unmanned vehicles, extreme robots for hazardous environments, and robotic assembly lines and logistics. This field encompasses scientific research, design, project management, and technical support.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10110","passing":"233","directionCode":"15.03.06","direction":"Mechatronics and Robotics"},
  {"id":"10111","name":"Hydropower and Renewable Energy Sources","level":"Bachelor’s","inst":"IHRE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Physics, Russian language, Mathematics (optional), Computer science (optional)","about":"The educational program covers the design, construction, and operation of hydroelectric power plants and power plants based on solar, wind, and other renewable energy sources. Students study hydraulics, hydrology, wind and solar energy, energy storage systems, and the management of hybrid energy systems. The program includes laboratory work, computer modeling of plant operating modes, and practical training at hydroelectric and green energy facilities. Graduates are prepared to work for energy companies, design, and operating organizations in the renewable energy sector.","learn":"Energy Systems and Resources | Electrical Materials, Industrial Electronics | Microelectronics and Microprocessor Technology | Operation and Repair of Hydropower Equipment | Wind Energy and Wind Turbines | Solar Energy and Solar Installations | Biomass and Biogas Plants | Energy Security and Ecology, Energy Efficiency and Energy Saving | Engineering Thermodynamics | Hydraulic Machines and Installations | Energy Policy and Planning, Economics and Management in the Energy Sector | Theory and Calculation of Hydroturbines, Design of Hydroelectric Power Plants","career":"Graduates of the program can work in hydropower, electric power systems and networks, wind and solar energy, energy facility automation, power plant design, energy efficiency and energy audits, as well as research and implementation of innovative technologies in the energy sector. They are in demand at hydroelectric power plants and other power generation facilities, in grid and generating companies, in energy equipment manufacturing companies, in design and engineering organizations, research institutes, and in government energy-related agencies.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10111","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"10112","name":"Construction and Operation of Thermal and Nuclear Power Plants (with a Second Qualification in Civil Engineering, 08.03.01)","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Russian language, Physics, Computer science (optional), Chemistry (optional), Mathematics (optional)","about":"The program is designed to train specialists in the construction and operation of thermal and nuclear power plants. Students receive engineering training in thermal power engineering and construction, mastering energy facility construction technologies and thermal-mechanical equipment installation techniques (steam and gas turbines, steam generators, and heat exchangers). Particular attention is paid to managing operational conditions while adhering to safety requirements. A key feature of the program is the award of a second qualification in 08.03.01 \"Construction,\" which expands graduates' competencies and enables them to professionally engage in power plant construction.","learn":"Construction Supervision Using BAS | Steam Power Boilers, Combined Cycle and Gas Turbine Equipment for Thermal Power Plants | Engineering Networks and Systems, Fundamentals of Technical Operation of Construction Projects | Fundamentals of Information Modeling Technologies | Specialized Construction Materials for Power Facilities | Architectural, Construction, and Design Solutions for Power Facilities | Fundamentals of District Heating | Steam Turbine Thermal Power Plants, Environmental Technologies at Thermal Power Plants, Operating Modes and Operation of Thermal Power Plants | Thermal Mechanical and Auxiliary Equipment of Power Plants | Thermal Power Plant Design, Engineering, Organization, and Management of Thermal Power Plant Construction","career":"Graduates work in construction and housing and utilities (design and operation of thermal power and heat engineering facilities), electric power, architectural and construction design, and project management for nuclear power facilities. They work at thermal and nuclear power plants, small-scale and renewable energy facilities, boiler houses, power units, combined-cycle and gas turbine units. Their areas of expertise include working with steam and gas turbines, nuclear power plant steam generators, heat and mass transfer units, heating networks, and auxiliary power equipment.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10112","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"10113","name":"Modeling of Processes in Nuclear Reactors","level":"Bachelor’s","inst":"ITNPE","campus":"Moscow","budget":0,"contract":2,"cost":474000,"exam":"Computer Science (optional), Physics, Mathematics (optional), Russian Language","about":"The program develops engineering skills for the development, calculation, and safety justification of nuclear power reactor equipment. Practical training takes place in three formats: laboratory physics experiments, numerical modeling, and analytical problem solving. Students work with unique equipment—a hydrodynamic and thermal physics rig with reactor parameters, and a subcritical rig—and master nuclear industry software systems, studying neutron physics, thermal hydraulics, dynamics, and strength within a unified approach.","learn":"Heat Transfer | Nuclear Reactor and Nuclear Power Plant Design | Thermodynamics | Nuclear and Neutron Physics | Modeling the Stress-Strain State of Mechanical Systems | Fundamentals of Nuclear Power Plant Safety","career":"Graduates work in research institutes, nuclear industry enterprises, and experimental sites, conducting research on neutronic and thermal processes, designing and developing nuclear power and research facilities, and substantiating their safety. They are in demand in design bureaus and engineering centers, where they create facility designs and refine technical solutions, as well as participate in testing components and systems on test benches.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10113","passing":"","directionCode":"14.05.01","direction":"Nuclear Reactors and Materials"},
  {"id":"10114","name":"Energy Supply and Engineering Systems of Buildings and Structures","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Russian language, Computer science (optional), Physics, Mathematics (optional), Chemistry (optional)","about":"The program is designed to train engineering systems designers and information modeling (IM) specialists—professionals in the implementation of information modeling (IM) technologies in the construction industry. The demand for such specialists is growing due to the industry's active transition to digital technologies. Graduates will learn to create digital models of buildings and their engineering systems at the design stage, perform engineering analysis, and optimize key performance indicators, including energy consumption and energy efficiency.","learn":"Heating, Ventilation, and Air Conditioning | Heat and Gas Supply for Buildings and Structures | Heat and Mass Transfer and Heat and Mass Transfer Equipment for Enterprises | Alternative and Renewable Energy Sources | Fundamentals of Designing and Manufacturing Heat Exchange Equipment | Designing Engineering Systems for Buildings and Structures | Fundamentals of Mathematical Modeling of Microclimate Formation Processes","career":"Graduates work in the design, construction, and operation of heat production and utilization equipment: at thermal and nuclear power plants, small-scale and renewable energy facilities, and in the housing and utilities sector. They work in heating, ventilation, air conditioning, water supply, and heat supply systems, including heating networks and stations, boiler units, and heat and mass transfer equipment. They also find employment at companies servicing refrigeration units, heat pumps, compressor equipment, and gas supply systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10114","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"10115","name":"Urban Heat Supply Systems","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Physics, Chemistry (optional), Computer Science (optional), Russian Language, Mathematics (optional)","about":"The program trains specialists in the design and operation of heat, electricity, gas, and water supply systems for cities and industrial enterprises. Graduates study modern energy infrastructures, learn to analyze and develop energy and water supply systems, ensure their operation, and rationally use fuel and energy resources. They master the feasibility study of technical solutions, evaluate the energy efficiency of facilities, and implement advanced technologies to optimize the operation of urban engineering systems.","learn":"Boiler Plants and Steam Generators | Digital Twins in Heat Supply Systems | Urban Ecology and Environmental Protection Technologies | Modern Methods of Cold Production and Utilization | Energy and Technology Equipment for Enterprises | Electrical Equipment and Power Supply for Cities, Energy Systems for Urban Life Support | Energy Balances and Heat Supply Schemes for Cities | Development and Operation of Urban Engineering Systems, Technical Equipment and Automation Systems for Urban Engineering Systems | Superchargers and Heat Engines | Heat Sources and Systems","career":"Graduates work in construction and housing and utilities (design and operation of thermal power and heat engineering facilities), as well as in the electric power industry. Their professional activities involve heating networks and heat supply systems, gas supply, water supply and sanitation, and urban power supply. They work in organizations servicing refrigeration systems, compressor and refrigeration units, heat pumps, air conditioning systems, auxiliary heating equipment, and heat and mass transfer units. Graduates are employed at renewable energy facilities and by companies implementing environmental protection systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10115","passing":"216","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"10116","name":"Information Systems and Technologies in Energy and Industry","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Russian language, Computer science (optional), Physics, Chemistry (optional), Mathematics (optional)","about":"The program focuses on the integration of information systems into energy resource management, including process automation, data monitoring and analysis, and software development to optimize power plant operations. Students learn modeling and forecasting methods, enabling them to make informed decisions in a dynamic energy services market. Key aspects of the program also include sustainable development and energy efficiency, including the implementation of innovative technologies and participation in projects to modernize legacy systems.","learn":"Participation in projects to modernize and update obsolete technologies | Development of energy resource management and control systems | Carrying out scientific research and developing new technologies in the field of energy | Analysis and optimization of thermal power and heat engineering processes | Automation of data collection and processing in power plants | Development and implementation of software for managing energy systems | Monitoring and diagnostics of energy systems | Design and implementation of information systems to improve energy efficiency","career":"Specialists can work in the following areas: - energy companies and holdings; - research institutions; - electric power and heat power enterprises; - consulting companies providing services in the field of energy; - government agencies involved in the regulation of energy resources; - manufacturing enterprises in need of optimization of energy processes.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10116","passing":"227","directionCode":"13.03.01","direction":"Thermal Power Engineering and Heat Engineering"},
  {"id":"10118","name":"New Technologies and Materials in Nuclear Energy and Industry","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":2,"cost":474000,"exam":"Chemistry (optional), Russian language, Mathematics (optional), Physics, Computer science (optional)","about":"The educational process is built around a comprehensive study of all stages of the nuclear power plant lifecycle and associated equipment. Particular attention is paid to in-depth mastery of specialized engineering disciplines related to the design and operation of key NPP equipment: nuclear reactors, steam generators, and turbomachines. Students master the complex physical and chemical processes occurring in the equipment, learn methods of protection against ionizing radiation, and study neutron transport theory to understand the physics of reactor operation. Alongside the professional module, students develop competencies in the natural sciences and mathematical modeling.","learn":"Development of and compliance with process regulations for the operation of nuclear power plants and auxiliary systems | Monitoring the reliability and safety of equipment, conducting diagnostics and analyzing the causes of possible failures | Ensuring radiation protection for personnel and the environment, as well as organizing the safe handling of radioactive substances and waste | Application of mathematical modeling methods to predict the behavior of materials and physical processes in NPP equipment | Carrying out engineering calculations and modeling of physical processes occurring in the core of a nuclear reactor and in heat and mass transfer equipment | Solving problems related to water treatment and chemical modes at nuclear power plants to prevent equipment corrosion | Selection and testing of structural materials intended for operation under conditions of high temperatures, pressures and ionizing radiation","career":"At operating nuclear power plants as operating or repair personnel; in design, engineering, and construction organizations developing new generation reactor systems and equipment for them; in research institutes and laboratories dealing with nuclear physics, thermal physics, and materials science; at nuclear engineering enterprises manufacturing reactor vessels, steam generators, turbines, and other complex equipment; in organizations implementing safety monitoring, equipment supervision, and licensing in the nuclear field; in companies working in the field of nuclear medicine and industrial radiography, where sources of ionizing radiation are used.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10118","passing":"","directionCode":"14.03.01","direction":"Nuclear Power Engineering and Thermophysics"},
  {"id":"10119","name":"Automation of Industrial Processes and Production","level":"Bachelor’s","inst":"IEEHT","campus":"Moscow","budget":0,"contract":2,"cost":420000,"exam":"Mathematics, Russian language, Physics (optional), Computer science (optional)","about":"The program trains qualified specialists in the automation of technological processes and production in the oil, gas, energy, and resource supply industries. Training is conducted using cutting-edge automation and control equipment. Students master embedded systems programming, data analysis, and the construction of highly efficient and secure industrial and energy process control systems. They also study the application of artificial intelligence methods to optimize management in these industries.","learn":"Data Analysis | Controller Programming | Artificial Intelligence Systems | Technological Processes and Equipment for Industry and Energy | Cyber-Physical Systems | Information Security of Automated Systems | Diagnostics and Reliability of Automated Systems | Circuit Design of Automated Systems","career":"Graduates find employment in manufacturing, construction, housing and utilities, electric and thermal power, and the oil and gas industries. They work in the automation of production and engineering processes: they implement and debug automated equipment, maintain process automation systems at industrial facilities, in the energy sector, and in municipal services, and work with engineering structures and public utility infrastructure.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10119","passing":"233","directionCode":"15.03.04","direction":"Automation of Industrial Processes and Production"},
  {"id":"10120","name":"Innovative Electrical Materials and Products","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Russian language, Physics, Mathematics (optional), Computer science (optional)","about":"The program trains specialists for work in the development and production of advanced materials and products: wires and cables, fiber optics, composite radar-absorbing coatings, nanomaterials for hydrogen energy, high-temperature oxide and electrical materials, electrical insulation technology, and ceramics for electronic and medical equipment. The program combines fundamental physics knowledge with modern technologies and includes IT aspects. Graduates will master research, design, engineering, pre-production technology, and testing of relevant products and materials.","learn":"Information Technology in Electrical Materials Science | Fundamentals of Electrical Insulation Technology | Fundamentals of Telecommunications and Information Transmission via Guide Systems | Electrical and Optical Communication Cables | Chemistry and Physics of Dielectrics | Fundamentals of Cable Technology, Fundamentals of Insulating Materials Technology","career":"Alisa Graduates work in education and science (scientific research), construction and housing and utilities (cable system design), electric power, oil and gas (power supply and facility operation), and the nuclear industry (electrical equipment design and operation). They are also in demand at industrial facilities manufacturing fiber-optic cables and electrical systems. Specialists work with electric power systems and networks, stations and substations, high-voltage equipment, electrical insulating materials, and surge protection systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10120","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"10121","name":"Electrical Systems for Unmanned Aerial Vehicles","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Mathematics (optional), Physics, Computer Science (optional), Russian language","about":"The program is designed to train highly qualified specialists in the development and operation of unmanned aerial vehicles (UAVs)—airborne, ground-based, and underwater. Students master the design of power supplies, traction electric drives, and onboard electrical equipment for such systems. The program includes in-depth study of electrical engineering, information technology, and technical English.","learn":"Computer Simulation of Electromechanical Converters | Electromechanical Systems | Unmanned Aerial Vehicles | Simulation of Electromechanical Systems | Microprocessor Control Systems for UAVs | Design of Electromechanical Converters | UAV Electronic Devices, UAV Electronic Device Control Systems, UAV Power Supply Systems | Specialized Electrical Machines and Electric Drives Based on Them | Design of Printed Circuit Boards, Electrical Machines, and Electrical Equipment for Autonomous Objects","career":"Graduates work in the aircraft industry, designing electrical systems for unmanned aerial vehicles. In shipbuilding, they contribute to the creation of electrical equipment for unmanned underwater vehicles. These specialists are also in demand in various industries, designing and operating electrical systems, power supply systems, and automation and mechanization solutions for production. Their skills are applicable to onboard electrical equipment for unmanned systems, specialized electric drives, power supplies, microprocessor controls, and electronic converters.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10121","passing":"213","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"10122","name":"Economics and Management at Enterprises in the Electrical Engineering Industry","level":"Bachelor’s","inst":"IEEE","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Physics, Computer Science (optional), Mathematics (optional), Russian Language","about":"The program trains highly qualified specialists for work in the electric power and electrical engineering industries, focusing on the economic and managerial challenges of the industry. Interdisciplinary training includes the study of technological aspects of the industry, economic support for the creation and operation of electrical equipment, cost calculation and pricing, production planning, analysis of enterprise financial and economic performance, investment program justification, and cross-industry integration.","learn":"Economics and Finance of the Enterprise | Strategic Planning and Management | Economic Evaluation of Investments | Business Planning at Electrical Engineering Enterprises | Accounting, Management | Economics and Quality Management | Economic and Organizational Foundations of Efficient Production in the Electrical Engineering Industry | Digital Technologies in Economic Calculations | Economic Analysis and Diagnostics of Financial and Economic Activities","career":"Graduates work in construction and housing and utilities, designing and operating electric power facilities. They are in demand in the electric power and electrical engineering sectors, and in industry, working at fiber-optic cable manufacturing facilities, in automation and mechanization projects, and in the operation of electric power systems and electrical engineering systems. They also work in the financial and economic departments of electrical engineering companies, in organizations designing, installing, and maintaining power facilities, at industrial enterprises with their own power systems, and in energy and technological supervision systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10122","passing":"","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"10123","name":"Operation of Relay Protection, Automation and Electrical Equipment of Power Plants","level":"Bachelor’s","inst":"IEPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Russian language, Physics, Computer science (optional), Mathematics (optional)","about":"The program is designed to train specialists in the operation, maintenance, and development of relay protection systems, automation, and electrical equipment for power plants. The practice-oriented training includes extensive on-the-job training (internships at specialized companies) and is conducted with employees of electric power companies. Students acquire fundamental knowledge and practical skills using advanced educational technologies, ensuring their competitiveness and readiness to work in the context of modernization and digitalization of electric power systems.","learn":"Automated process control systems for power grid facilities | Power system automation | Fundamentals of relay protection design, commissioning and operation of relay protection | Relay protection and relay protection calculations for electric power systems | Electrical components of power plants | Electromagnetic transients in electric power systems | Electric power systems and networks","career":"Graduates work at power plants and energy companies, performing setup, testing, operation, and diagnostics of relay protection and automation devices. They are involved in calculating and configuring relay protection and automation parameters, as well as technical metering and analysis of their operation. Specialists are in demand at facilities involving generators, synchronous compensators, power transformers, high-voltage circuit breakers, instrument transformers, complete switchgear units, and auxiliary power systems at power plants, as well as direct current (DC) systems and emergency event recorders.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10123","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"10124","name":"Electrical Power Engineering and Electrical Engineering","level":"Bachelor’s","inst":"IEPE","campus":"Moscow","budget":0,"contract":0,"cost":420000,"exam":"Russian language, Computer science (optional), Mathematics (optional), Physics","about":"The program is designed to train specialists in the generation, transmission, distribution, and use of electrical energy, as well as the development and operation of electrical devices and systems. This program combines theoretical foundations and practical skills necessary for work in the energy industry. Students study electromechanics, electronics, automation, electrical circuit theory, automatic control and protection systems, and modern information technologies in the electric power industry. The curriculum includes laboratory work, practical training, and internships at energy companies.","learn":"Electrical Power Plants and Substations, Electric Power Systems and Networks | Computing Systems in the Electric Power Industry | Layout of Electrical Installations at Power Stations | Physical Foundations of High-Voltage Electrical Technologies | Relay Protection and Automation of Electric Power Systems | Electromagnetic Transients in Electric Power Systems | Software for Solving Scientific and Technical Problems | Electrical Machines, Industrial Electronics","career":"Graduates work in research organizations, energy companies, and industrial enterprises. They operate and design electrical distribution networks and electrical grid equipment (overhead and cable lines, transformer substations), ensuring reliable power supply to cities, industrial facilities, agriculture, and transportation systems. Specialists are in demand at power plants and substations, working with high-voltage installations, lightning and surge protection systems, relay protection, high-voltage electrical technologies, and power plants, including those powered by renewable energy sources.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10124","passing":"214","directionCode":"13.03.02","direction":"Electrical Power Engineering and Electrical Engineering"},
  {"id":"10125","name":"Information Technology and Artificial Intelligence Systems","level":"Bachelor’s","inst":"ITCS","campus":"Moscow","budget":0,"contract":95,"cost":380000,"exam":"Computer Science (optional), Mathematics, Russian Language, Physics (optional)","about":"The program is designed to train specialists in computer science, advanced information technology, applied mathematics, artificial intelligence, and mathematical modeling for the energy and innovation-based economies. Graduates receive fundamental training and skills in developing systems and application software, as well as developing intelligent systems. The program is focused on professional and research activities in various fields of computer science and information technology.","learn":"Information Security: Data Protection, Development of Cryptographic Methods and Systems to Prevent Cyberattacks | Intelligent Systems: Developing Solutions for Process Automation, Robotics, and Smart Devices | Database Management: Designing, Administering, and Optimizing Distributed and Local Databases | Software Development and Implementation: Creating Applications, Algorithms, and Systems to Solve Problems in Various Areas | Computer Network Development and Support: Configuring and Ensuring the Stable Operation of Network Infrastructures | Neural Network Design and Optimization: Developing Artificial Intelligence Models for Pattern Recognition, Natural Language Processing, and Other Tasks | Data Analysis and Processing: Working with Large Volumes of Information, Using Machine Learning and Statistics to Extract Useful Insights","career":"Specialists in this profile work in the following fields: IT companies: software development, creation of intelligent systems and applications; research centers: study and implementation of new technologies in the field of artificial intelligence and data analysis; banks and financial organizations: data analysis, development of systems for fraud detection and forecasting; medical institutions: creation of systems for diagnostics, analysis of medical data and development of personalized solutions; telecommunications companies: network operation, data protection and development of intelligent services; government agencies: creation of secure information systems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10125","passing":"271","directionCode":"02.03.02","direction":"Fundamental Computer Science and Information Technology"},
  {"id":"10127","name":"Information Technology and Artificial Intelligence in Electronics","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":2,"cost":450000,"exam":"Russian language, Physics (optional), Mathematics, Computer science (optional)","about":"The program is designed to develop students' knowledge, skills, and abilities that will enable them to pursue professional careers in information technology and computing, including the design, development, implementation, and operation of software and hardware, computing systems and networks, artificial intelligence systems, and digital signal processing for electronic systems and systems. Graduates are trained based on the current state and development trends of the electronics industry, information technology, and artificial intelligence.","learn":"Radio Circuits and Signals | Quantum and Optical Electronics | Fundamentals of Optical-Electronic Systems Design | Digital Device Circuitry | Operating System Administration | Microcontrollers and Data Interfaces | Network Information Technologies | Artificial Intelligence Systems | Programming Technologies, Languages, and Methods | Programming on Field-Programmable Logic Integrated Circuits | Digital Signal and Image Processing","career":"Graduates can work in information and communications technology, designing, developing, implementing, and operating electronic and information systems, signal and data processing systems, and artificial intelligence systems. They are in demand at research organizations and companies working in computer science, computing, and information technology. Graduates can also work in various sectors of the economy and industry, using software and hardware to solve technological and production problems.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10127","passing":"248","directionCode":"09.03.01","direction":"Informatics and Computer Engineering"},
  {"id":"10128","name":"Wireless Technologies","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":5,"cost":420000,"exam":"Physics, Mathematics (optional), Computer Science (optional), Russian language","about":"The program's goal is to train engineers in the design and operation of radio engineering and telecommunications devices and systems. Graduates acquire skills in analyzing electronic circuits and devices, designing radio communication systems, radio navigation, and signal processing, and use modern simulation software. The program focuses on applying knowledge in the fields of the Internet of Things, telecommunications, radar, and wireless networks. The program combines fundamental training in electrodynamics, signal theory, and electronics with laboratory practice and project work, developing teamwork and engineering design skills.","learn":"Independently conduct experimental research and use basic techniques for processing and presenting the obtained data | Apply methods of searching, storing, processing, analyzing and presenting information from various sources and databases in the required format, observing information security requirements. | Understand the operating principles of modern information technologies and use them to solve professional problems | Collect scientific and technical information to conduct evaluation calculations of individual units of radio-electronic devices (RED) | Develop functional diagrams of RED and computer modeling of individual RED units | Develop mathematical models of radio-electronic devices, subsystems of radio-electronic systems and complexes","career":"Graduates work in telecommunications companies (cellular, satellite, and fiber optic communications), in radio electronics and instrumentation, developing radio systems, antenna devices, and signal processing equipment. They are in demand in the radar, navigation, and space industries, the transportation industry (aviation, shipping, and automotive communication systems), and in IT and IoT projects related to wireless networks and embedded systems. Specialists work in the energy and industrial automation industries, as well as in research organizations and medicine (telemedicine, diagnostic equipment).","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10128","passing":"216","directionCode":"11.03.01","direction":"Radio Engineering"},
  {"id":"10129","name":"Radio-Electronic Systems and Complexes","level":"Bachelor’s","inst":"IRE","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Russian language, Physics, Mathematics (optional), Computer science (optional)","about":"The program is aimed at studying the principles and technologies for the creation and use of electronic systems in various industries and sciences. This focus includes the design, production, operation, and maintenance of electronic systems and complexes used in various fields. The curriculum includes the theory of electronics, circuit design, digital signal processing, data transmission systems, and design methods; electrical communication theory; electromagnetic compatibility; radio system modems and codecs; microwave antennas and devices; geographic information systems; communication networks and switching systems; and mobile radio system switching equipment.","learn":"Work with high-frequency equipment | Program microcontrollers | Understand the development and application of electronic systems in various industries | Repair and configure electronic devices | Be able to develop and configure digital and analog electronic devices | Develop structural and functional diagrams of electronic systems and systems | Understand the theory and practical application of radio communication systems, antennas, digital signal processing, and microprocessor technology | Apply digital signal processing algorithms","career":"Graduates are in demand in the telecommunications, defense, aircraft manufacturing, medical technology, and other fields that utilize electronic systems. Career prospects include work on large-scale projects developing high-tech equipment and advancement to management positions. Graduates can work as electronic systems design engineers, digital device developers, and high-frequency systems specialists in telecommunications companies, manufacturing facilities, and research organizations.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10129","passing":"214","directionCode":"11.05.01","direction":"Radio-Electronic Systems and Complexes"},
  {"id":"10130","name":"Computer System Security (Advanced)","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":1,"cost":420000,"exam":"Russian language, Mathematics, Physics (optional), Computer science (optional)","about":"Training highly professional and competitive specialists in information security and data protection for the country's innovative economy and energy sector. The training focuses on developing a systematic approach to ensuring the security of organizational information systems and assets from software, hardware, and information threats. Students gain in-depth knowledge of information security technologies, cyberattack countermeasures, information risk management, and modern cybersecurity tools.","learn":"Wireless Network Security | Mobile Device and Application Security, Web Applications | Enterprise Information Security Systems, System and Network Administration | Information Security Incident Management | Process Information Protection in APCS | Information Security in Cyber-Physical Systems | Python Programming; Forensic Fundamentals; Windows- and Linux-Based Forensic Tools | Vulnerability Detection Technologies in Automated Systems | Cyber-Attack Protection Technologies, Proactive Information System Protection Technologies | Information System Security Audit | Security of Critical Information Infrastructure of Energy Facilities","career":"Graduates of this program work in information security, communications, and information and communications technology. They are in demand in information security agencies, departments, and services, as well as in research and educational institutions. Specialists work on protecting information systems, computer and telecommunications networks, automated process control systems, and critical information infrastructure facilities, countering cyberattacks, managing information risks, and ensuring organizational cybersecurity.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10130","passing":"261","directionCode":"10.03.01","direction":"Information Security"},
  {"id":"10131","name":"Quality Management of Enterprise Processes and Products","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":50,"cost":420000,"exam":"Russian language, Computer science (optional), Physics (optional), Mathematics","about":"The program provides students with a fundamental understanding of quality management principles and methods across a variety of application areas. It covers a broad range of knowledge and skills necessary for effective quality management in manufacturing and technological systems. The curriculum covers the fundamental aspects of quality management, standards and methodologies, process analysis and improvement, quality control, risk management, statistical data analysis, and the development and implementation of quality management strategies. Special emphasis is placed on statistical methods of quality management and a systems approach to management.","learn":"Management Systems Research | Marketing | Methods and Instruments for Measurement, Testing, and Control | Metrology and Certification | Fundamentals of Quality Assurance, Quality Planning | Production Management | Quality Management Tools and Methods | Technologies and Organization of Production of Products and Services | Technological Fundamentals of Mechanical Engineering | Electric Power Quality Management | Economic Fundamentals of Quality Improvement | Statistical Methods in Quality Management, QMS Certification | Innovative Management | Quality Audit | Information Technology in Quality Management and Information Protection | Intellectual Property Protection","career":"Graduates work in industrial enterprises of any industry, consulting companies, certification bodies and testing laboratories, and organizational quality departments. They implement total quality management (TQM) principles, analyze and improve enterprise performance, and develop product quality improvement methodologies. They organize process and product certification procedures, consult on quality management systems, and support their implementation.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10131","passing":"225","directionCode":"27.03.02","direction":"Quality Management"},
  {"id":"10132","name":"International Energy Cooperation","level":"Bachelor’s","inst":"EEI","campus":"Moscow","budget":0,"contract":2,"cost":370000,"exam":"History, Computer Science (optional), Russian Language, Social Science (optional), Mathematics (optional), Geography (optional), Foreign Language (optional)","about":"The program trains specialists at the intersection of international relations, energy, economics, and law. Students study global energy markets, mechanisms of interstate regulation and diplomatic support for projects, energy security, and foreign economic activity. Mastering international negotiation skills and analyzing global energy processes is combined with fundamental training in the humanities and economics. Graduates work in government agencies, international organizations, energy companies, and think tanks.","learn":"Energy Security | International Project Activities | Legal and Organizational Support for Interstate Cooperation | Foreign Economic Activity of Companies | Expert and Analytical Support for International Projects | International Negotiations and Business Communications | International Cooperation in the Energy Sector","career":"Graduates work as specialists in international energy cooperation; experts in the foreign economic activity of energy companies; analysts of international energy projects; negotiators and business communications specialists at the international level; energy security specialists; lawyers and organizers of intergovernmental cooperation in the energy sector. They also hold positions in international organizations, participate in the development of national energy strategies, support energy export and import operations, and manage infrastructure facilities of international significance.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10132","passing":"","directionCode":"41.03.05","direction":"International Relations"},
  {"id":"10133","name":"Media Communications and Design in Advertising","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":1,"cost":370000,"exam":"Computer Science (optional), History (optional), Foreign Language (optional), Social Science, Russian Language","about":"The program is designed to train multidisciplinary specialists capable of combining skills in strategic marketing, visual design, and digital content management. Students are immersed in an educational process that combines the fundamentals of composition and typography with mastery of modern analytics tools and neural network operations. The curriculum is project-oriented, covering everything from developing a corporate identity to launching comprehensive advertising campaigns in a multimedia environment. Graduates are in demand in creative industries, where they must not only create an aesthetically pleasing product but also effectively manage audience attention across various media channels.","learn":"Advertising Campaign Development and Implementation | Content Creation for Various Media Platforms | Communications and Public Relations Management | Media Analytics and Research | Branding and Image-Making Strategies | Event and PR Event Management | Writing and Editing Media Texts","career":"Graduates work in advertising and branding agencies, digital marketing and SMM agencies, design studios (graphic and multimedia design), media and online publications, PR agencies and public relations departments, event companies, and production studios. They are in demand in publishing houses (digital and print media), IT companies (website and app interface development), and can also freelance in copywriting, design, and brand promotion.","link":"https://studyinrussia.ru/ru/university-show/338/programm-trainings/10133","passing":"","directionCode":"42.03.01","direction":"Advertising and Public Relations"},
  {"id":"10134","name":"Theory and Methods of Teaching Foreign Languages and Cultures","level":"Bachelor’s","inst":"IHAS","campus":"Moscow","budget":0,"contract":2,"cost":370000,"exam":"Russian language, Social science (optional), Foreign language, Literature (optional), History (optional)","about":"The program is aimed at training highly qualified specialists proficient in modern linguodidactic technologies and in-depth knowledge of intercultural communication. The educational process combines intensive language training in two or more foreign languages with the study of the psychological and pedagogical foundations of education. Students master course design methods, learn to use digital tools in education, and explore the cultural codes of the countries where the languages are spoken. Graduates are prepared to implement educational programs in various educational institutions and to serve as experts and analysts in the international environment.","learn":"Theory and Methods of Intercultural Interaction | Fundamentals of Pedagogical Excellence | Analysis and Practical Application of Current Educational Standards and Programs | Theory of Studied Foreign Languages | Processes of Teaching and Learning Foreign Languages and Cultures | Development and Adaptation of Foreign Language Teaching Materials | Application of Modern Techniques, Organizational Forms, and Technologies for Education, Training, and Assessment of Learning Outcomes","career":"Graduates work in schools, colleges, and universities, teaching foreign languages at the basic and vocational levels; they also teach courses for children and adults at language centers and online schools. They are in demand as linguists and translators at international companies, and at research institutes, working in linguistics and teaching. They also pursue careers in intercultural consulting, supporting foreign economic activity, and participating in international humanitarian cooperation projects.","link":"https://studyinr
